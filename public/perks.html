<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perks</title>
  <link rel="stylesheet" href="/css/commun.css">
  <link rel="stylesheet" href="/css/arbre.css">
  <link rel="stylesheet" href="/css/barre.css">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #161616;
      color: var(--texte);
      margin: 0;
      min-height: 100vh;
    }
    .contenu { max-width: 900px; margin: 28px auto; padding: 0 16px 40px; }

    /* ---------- Loterie ---------- */
    .loterie { text-align: center; margin-bottom: 30px; }
    #tirer {
      padding: 16px 34px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font: inherit;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }
    #tirer:disabled { background: #333; color: #888; cursor: default; }
    #resultat { min-height: 28px; margin-top: 14px; font-size: 18px; font-weight: bold; }
    #resultat.nouveau { color: var(--vert); }
    #resultat.doublon { color: var(--or); }

    /* ---------- Perks obtenus ---------- */
    h2 { font-size: 13px; color: var(--texte-doux); text-transform: uppercase; letter-spacing: 1px; margin: 0 0 10px; }
    .perks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .perk {
      background: #242424;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
      color: var(--texte);
      font: inherit;
      cursor: pointer;
    }
    .perk:hover { border-color: var(--accent); }
    .perk.flash { border-color: var(--vert); box-shadow: 0 0 14px rgba(127, 220, 154, 0.4); }
    .perk .icone { font-size: 36px; line-height: 1; }
    .perk .nom { font-weight: bold; font-size: 15px; }
    .perk .effet { font-size: 13px; color: var(--texte-doux); }
    .porteur { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: bold; }
    .porteur img { width: 28px; height: 28px; object-fit: contain; }
    .vide { color: #777; font-size: 14px; }
    #message { min-height: 1.2em; color: var(--or); text-align: center; margin: 14px 0 0; }

    /* ---------- Détail d'un perk ---------- */
    .fond {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 30;
    }
    .fond[hidden] { display: none; }
    .detail {
      position: relative;
      width: min(360px, 100%);
      background: #242424;
      border: 1px solid #444;
      border-radius: 16px;
      padding: 22px 20px 20px;
      text-align: center;
    }
    .detail .icone { font-size: 52px; line-height: 1; }
    .detail .nom { font-size: 20px; font-weight: bold; margin: 8px 0; }
    .detail .description { font-size: 15px; line-height: 1.4; margin: 0 0 14px; }
    .detail .porteur { justify-content: center; margin-bottom: 14px; }
    .detail .non-equipe { font-size: 13px; color: var(--texte-doux); margin: 0 0 14px; }
    .tiers { display: flex; flex-direction: column; gap: 4px; text-align: left; }
    .tier { display: flex; gap: 10px; padding: 6px 10px; border-radius: 8px; background: #1c1c1c; font-size: 13px; color: #777; }
    .tier .num { width: 28px; font-weight: bold; }
    .tier.possede { color: var(--texte); }
    .tier.actuel { outline: 1px solid var(--accent); }
    .fermer {
      position: absolute;
      top: 8px;
      right: 10px;
      background: none;
      border: none;
      color: var(--texte-doux);
      font-size: 22px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="contenu">
    <nav class="onglets-objets">
      <a href="/perks.html" class="actif">🎯 Perks</a>
      <a href="/armes.html">⚔️ Armes</a>
      <a href="/equipements.html">🎒 Équipements</a>
    </nav>
    <section class="loterie">
      <button id="tirer" type="button" disabled>🎰 Tirer un perk</button>
      <div id="resultat"></div>
    </section>

    <h2>Mes perks</h2>
    <div id="perks" class="perks"></div>
    <p id="message"></p>
  </main>

  <div id="fond" class="fond" hidden>
    <div class="detail" role="dialog" aria-modal="true">
      <button class="fermer" type="button" aria-label="Fermer">✕</button>
      <div id="detail"></div>
    </div>
  </div>

  <script src="/js/commun.js"></script>
  <script src="/js/arbre.js"></script>
  <script src="/js/barre.js"></script>
  <script src="/js/session.js"></script>
  <script>
    let donnees = null;          // réponse /perks
    let singes = {};             // espece → singe possédé (image, nom)
    let dernierTire = null;      // "perk:tier" à mettre en valeur
    const message = document.getElementById("message");
    const bouton = document.getElementById("tirer");
    const fond = document.getElementById("fond");

    function majBouton(coins) {
      bouton.textContent = `🎰 Tirer un perk · ${donnees.prix} 💰`;
      bouton.disabled = coins < donnees.prix;
    }

    function lignePorteur(espece) {
      const s = singes[espece];
      if (!s) return null;
      const ligne = document.createElement("div");
      ligne.className = "porteur";
      ligne.innerHTML = `<img src="${s.image}" alt=""><span></span>`;
      ligne.querySelector("span").textContent = s.espece.nom;
      return ligne;
    }

    function ouvrirDetail(p) {
      const c = donnees.catalogue[p.perk];
      const zone = document.getElementById("detail");
      zone.innerHTML = `<div class="icone"></div><div class="nom"></div><p class="description"></p>`;
      zone.querySelector(".icone").textContent = c.icone;
      zone.querySelector(".nom").textContent = nomPerk(donnees.catalogue, p.perk, p.tier);
      zone.querySelector(".description").textContent = descriptionPerk(donnees.catalogue, p.perk, p.tier);

      const porteur = p.espece ? lignePorteur(p.espece) : null;
      if (porteur) {
        zone.appendChild(porteur);
      } else {
        const note = document.createElement("p");
        note.className = "non-equipe";
        note.textContent = "Non équipé · à équiper depuis l'onglet Équipe";
        zone.appendChild(note);
      }

      // Tous les tiers du perk, ceux obtenus en clair
      if (c.nbTiers > 0) {
        const possedes = new Set(donnees.obtenus.filter((o) => o.perk === p.perk).map((o) => o.tier));
        const liste = document.createElement("div");
        liste.className = "tiers";
        for (let t = 1; t <= c.nbTiers; t++) {
          const ligne = document.createElement("div");
          ligne.className = "tier" + (possedes.has(t) ? " possede" : "") + (t === p.tier ? " actuel" : "");
          ligne.innerHTML = `<span class="num"></span><span></span>`;
          ligne.querySelector(".num").textContent = ROMAINS[t];
          ligne.lastChild.textContent = effetPerk(donnees.catalogue, p.perk, t);
          liste.appendChild(ligne);
        }
        zone.appendChild(liste);
      }
      fond.hidden = false;
    }

    function fermerDetail() {
      fond.hidden = true;
    }

    function afficherPerks() {
      const zone = document.getElementById("perks");
      zone.innerHTML = "";
      if (donnees.obtenus.length === 0) {
        zone.innerHTML = `<p class="vide">Aucun perk pour l'instant.</p>`;
        return;
      }
      for (const p of donnees.obtenus) {
        const c = donnees.catalogue[p.perk];
        if (!c) continue;
        const carte = document.createElement("button");
        carte.type = "button";
        carte.className = "perk" + (dernierTire === `${p.perk}:${p.tier}` ? " flash" : "");
        carte.innerHTML = `<span class="icone"></span><span class="nom"></span><span class="effet"></span>`;
        carte.querySelector(".icone").textContent = c.icone;
        carte.querySelector(".nom").textContent = nomPerk(donnees.catalogue, p.perk, p.tier);
        carte.querySelector(".effet").textContent = effetPerk(donnees.catalogue, p.perk, p.tier);
        const porteur = p.espece ? lignePorteur(p.espece) : null;
        if (porteur) carte.appendChild(porteur);
        carte.addEventListener("click", () => ouvrirDetail(p));
        zone.appendChild(carte);
      }
    }

    bouton.addEventListener("click", async () => {
      if (bouton.disabled) return;
      bouton.disabled = true;
      message.textContent = "";
      const resultat = document.getElementById("resultat");
      try {
        const { ok, data } = await api("/perks/loterie", { methode: "POST" });
        if (!ok) {
          message.textContent = data.erreur;
          return;
        }
        const c = donnees.catalogue[data.perk];
        const nom = nomPerk(donnees.catalogue, data.perk, data.tier);
        resultat.className = data.doublon ? "doublon" : "nouveau";
        resultat.textContent = data.doublon ? `${c.icone} ${nom} déjà obtenu : +${data.xp} XP` : `${c.icone} ${nom} !`;
        dernierTire = data.doublon ? null : `${data.perk}:${data.tier}`;
        Barre.afficherStarter(data.starter);
        Barre.afficherPoints(data.pointsArbre);
        const r = await api("/perks");
        if (r.ok) donnees = r.data;
        afficherPerks();
        majBouton(data.starter.coins);
      } catch {
        message.textContent = "Erreur réseau, réessaie.";
      } finally {
        if (donnees) majBouton(Number(document.getElementById("coins").textContent));
      }
    });

    async function charger() {
      const [rp, rd] = await Promise.all([api("/perks"), api("/monkeydex")]);
      if (!rp.ok) {
        message.textContent = rp.data.erreur;
        return;
      }
      donnees = rp.data;
      singes = Object.fromEntries((rd.ok ? rd.data.singes : []).map((s) => [s.id, s]));
      majBouton(donnees.coins);
      afficherPerks();
    }

    fond.addEventListener("click", (e) => { if (e.target === fond) fermerDetail(); });
    fond.querySelector(".fermer").addEventListener("click", fermerDetail);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") fermerDetail(); });
    exigerConnexion().then((moi) => { if (moi) charger(); });
  </script>
</body>
</html>
