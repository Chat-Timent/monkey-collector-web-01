<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aventure</title>
  <link rel="stylesheet" href="/css/commun.css">
  <link rel="stylesheet" href="/css/arbre.css">
  <link rel="stylesheet" href="/css/barre.css">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #161616;
      color: var(--texte);
      margin: 0;
      min-height: 100vh;
    }
    .contenu { max-width: 760px; margin: 24px auto; padding: 0 16px 40px; text-align: center; }

    #etage { font-size: 40px; font-weight: bold; margin: 8px 0 18px; }

    /* Cartes centrées, 3 par ligne au maximum */
    .ennemis { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 18px; }
    .ennemi {
      width: calc((100% - 24px) / 3);
      box-sizing: border-box;
      background: #242424;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .ennemi img { width: 70px; height: 70px; object-fit: contain; }
    .ennemi .nom { font-weight: bold; font-size: 13px; }
    .ennemi .niv { font-size: 12px; color: var(--or); }

    #recompenses { font-size: 16px; color: var(--texte-doux); margin-bottom: 20px; min-height: 1.2em; }
    #recompenses strong { color: var(--texte); }

    #combattre {
      display: inline-block;
      padding: 16px 40px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font: inherit;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }
    #combattre:disabled { opacity: 0.5; cursor: default; }
    #message { min-height: 1.2em; color: var(--or); margin: 14px 0 0; }

    .classement {
      margin: 36px auto 0;
      max-width: 360px;
      text-align: left;
      background: var(--panneau);
      border: 1px solid var(--panneau-bord);
      border-radius: 12px;
      padding: 14px;
    }
    .classement h2 { font-size: 13px; color: var(--texte-doux); text-transform: uppercase; letter-spacing: 1px; margin: 0 0 10px; }
    .classement .ligne { display: flex; gap: 10px; padding: 6px 8px; border-radius: 8px; font-size: 14px; }
    .classement .ligne.moi { outline: 1px solid #2e6b3a; }
    .classement .rang { width: 22px; color: #888; font-weight: bold; font-size: 12px; }
    .classement .pseudo { flex: 1; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .classement .record { color: var(--or); font-weight: bold; }
    .classement:has(#classement:empty) { display: none; }

    @media (max-width: 480px) {
      #etage { font-size: 32px; }
      .ennemis { gap: 8px; }
      .ennemi img { width: 54px; height: 54px; }
    }
  </style>
</head>
<body>
  <main class="contenu">
    <div id="etage"></div>
    <div id="ennemis" class="ennemis"></div>
    <div id="recompenses"></div>
    <button id="combattre" type="button" disabled>Combattre</button>
    <p id="message"></p>

    <section class="classement">
      <h2>Records</h2>
      <div id="classement"></div>
    </section>
  </main>

  <script src="/js/commun.js"></script>
  <script src="/js/arbre.js"></script>
  <script src="/js/barre.js"></script>
  <script src="/js/session.js"></script>
  <script>
    const bouton = document.getElementById("combattre");
    const message = document.getElementById("message");
    let combatEnCours = null;

    function afficher(data) {
      document.getElementById("etage").textContent = `Étage ${data.etage}`;

      const zone = document.getElementById("ennemis");
      zone.innerHTML = "";
      for (const e of data.ennemis) {
        const carte = document.createElement("div");
        carte.className = "ennemi";
        const couleur = infoRarete(e.rarete).couleur;
        carte.style.boxShadow = `inset 0 3px 0 ${couleur}`;
        const img = document.createElement("img");
        img.src = e.image;
        img.alt = "";
        const nom = document.createElement("span");
        nom.className = "nom";
        nom.textContent = e.nom;
        const niv = document.createElement("span");
        niv.className = "niv";
        niv.textContent = `Lvl ${e.niveau}`;
        carte.append(img, nom, niv);
        zone.appendChild(carte);
      }

      const r = data.recompenses;
      const morceaux = [`⭐ <strong>${r.xp}</strong> XP`, `💰 <strong>${r.coins}</strong>`];
      if (r.tirages > 0) morceaux.push(`🎟️ <strong>+${r.tirages}</strong> tirage`);
      document.getElementById("recompenses").innerHTML = morceaux.join(" · ");

      // Un combat encore en cours de replay : on y renvoie au lieu d'en lancer un autre
      combatEnCours = data.combatEnCours;
      bouton.textContent = combatEnCours ? "Voir le combat en cours" : "Combattre";
      bouton.disabled = false;

      const classement = document.getElementById("classement");
      classement.innerHTML = "";
      data.classement.forEach((j, i) => {
        const ligne = document.createElement("div");
        ligne.className = "ligne" + (j.moi ? " moi" : "");
        const rang = document.createElement("span");
        rang.className = "rang";
        rang.textContent = i + 1;
        const pseudo = document.createElement("span");
        pseudo.className = "pseudo";
        pseudo.textContent = j.pseudo;
        const record = document.createElement("span");
        record.className = "record";
        record.textContent = `Étage ${j.record}`;
        ligne.append(rang, pseudo, record);
        classement.appendChild(ligne);
      });
    }

    async function charger() {
      const { ok, data } = await api("/aventure");
      if (!ok) {
        message.textContent = data.erreur;
        return;
      }
      afficher(data);
    }

    bouton.addEventListener("click", async () => {
      if (combatEnCours) {
        location.href = `/combat-live.html?id=${combatEnCours}`;
        return;
      }
      bouton.disabled = true;
      message.textContent = "";
      try {
        const { ok, data } = await api("/aventure/combat", { methode: "POST" });
        if (ok) {
          location.href = `/combat-live.html?id=${data.combatId}`;
          return;
        }
        message.textContent = data.erreur;
      } catch {
        message.textContent = "Erreur réseau, réessaie.";
      }
      bouton.disabled = false;
    });

    exigerConnexion().then((moi) => { if (moi) charger(); });
  </script>
</body>
</html>
