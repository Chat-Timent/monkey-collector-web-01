<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monkey Collector V0.1</title>
  <link rel="stylesheet" href="/css/commun.css">
  <style>
    :root { --topbar-h: 84px; }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, sans-serif;
      background: var(--fond);
      color: var(--texte);
      margin: 0;
      padding: var(--topbar-h) 0 0;
      height: 100vh;
      overflow: hidden;
    }

    /* ---------- Topbar ---------- */

    #topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--topbar-h);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      padding: 0 24px;
      background: linear-gradient(180deg, #2a2640, #232034);
      border-bottom: 1px solid #3a3555;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      z-index: 10;
    }

    .starter-bloc {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .starter-bloc .avatar {
      width: 60px; height: 60px;
      border-radius: 14px;
      background: #1e1b2e;
      border: 2px solid var(--or);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .starter-bloc .avatar img { width: 52px; height: 52px; object-fit: contain; }
    .starter-bloc .avatar img.cachee { display: none; }
    .starter-info { min-width: 0; flex: 1; }
    .starter-ligne { display: flex; align-items: center; gap: 8px; }
    #starter-nom {
      font-size: 16px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #starter-niveau {
      font-size: 12px;
      font-weight: bold;
      color: #1e1b2e;
      background: var(--or);
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .xp-track {
      margin-top: 6px;
      height: 10px;
      width: 100%;
      max-width: 220px;
      background: #111;
      border: 1px solid #3a3555;
      border-radius: 999px;
      overflow: hidden;
    }
    .xp-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f0a020, #ffd36b);
      transition: width 0.6s ease;
    }
    #starter-xp {
      font-size: 11px;
      color: var(--texte-doux);
      margin-top: 3px;
    }

    .titre-topbar {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
      text-align: center;
      white-space: nowrap;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .droite-topbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
    }
    .ressource {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 10px;
      background: #1e1b2e;
      border: 1px solid #3a3555;
      font-weight: bold;
      font-size: 16px;
    }
    .ressource .icone { font-size: 18px; }
    .ressource .valeur { color: var(--or); }

    #deconnexion {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--carte-bord);
      background: var(--carte);
      color: var(--texte);
      cursor: pointer;
    }

    /* ---------- Mise en page ---------- */

    .page {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 320px;
      gap: 0;
      min-height: 0;
    }

    .panneau {
      background: var(--panneau);
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
    }
    .classement-panneau { border-right: 1px solid var(--panneau-bord); }
    .chat-panneau { border-left: 1px solid var(--panneau-bord); }

    .panneau h2 {
      font-size: 14px;
      color: var(--texte-doux);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 12px;
      flex-shrink: 0;
    }

    .liste {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
    }

    .joueur {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #242424;
      font-size: 14px;
      border: 1px solid transparent;
      flex-shrink: 0;
    }
    .joueur.moi { border-color: #2e6b3a; }
    .joueur .rang { width: 22px; color: #888; font-size: 12px; font-weight: bold; }
    .joueur .pseudo { flex: 1; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .joueur .total { font-weight: bold; color: var(--or); }
    .joueur.moi .total { color: var(--vert); }
    .vide { color: #777; font-size: 13px; }

    /* Zone centrale */
    .gacha {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
      min-height: 0;
      height: 100%;
      overflow-y: auto;
      padding: 24px;
    }
    .gacha h1 { margin: 0 0 20px; font-size: 26px; }

    .controles { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; justify-content: center; }
    .bouton {
      padding: 14px 24px;
      border-radius: 10px;
      border: 1px solid var(--carte-bord);
      background: var(--carte);
      color: var(--texte);
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
    }
    #tirer {
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      transition: transform 0.1s, box-shadow 0.2s;
    }
    #tirer:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(229, 68, 122, 0.4);
    }
    #tirer:active { transform: translateY(0); }
    #tirer:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: none; }

    #quota { margin: -12px 0 16px; font-size: 15px; color: var(--texte-doux); min-height: 1.2em; }
    #quota strong { color: var(--texte); }
    #quota.epuise { color: var(--or); font-weight: bold; }

    #carte {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: var(--carte);
      border-radius: 16px;
      padding: 30px;
      width: 340px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    #nom { font-size: 32px; font-weight: bold; margin: 0 0 10px; }
    .rarete {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 14px 4px 6px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      background: var(--carte);
      border: 2px solid;
      margin-bottom: 14px;
    }
    .rarete img { width: 24px; height: 24px; object-fit: contain; }
    #description { font-size: 15px; font-style: italic; color: var(--texte-doux); margin: 0 0 16px; }
    #niveau { color: var(--or); margin-bottom: 16px; }
    #image { width: 200px; height: 200px; object-fit: contain; }
    #stats {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      border-top: 1px solid var(--carte-bord);
      margin-top: 20px;
      padding-top: 16px;
    }
    .stat span { display: block; font-size: 12px; color: #999; }
    .stat strong { display: block; font-size: 18px; }
    .stat small { color: var(--vert); font-size: 12px; }
    #message { color: var(--or); }

    /* Chat */
    .chat-texte {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
    }

    /* ---------- Adaptation petits écrans ---------- */

    @media (max-width: 1100px) {
      body { height: auto; min-height: 100vh; overflow: auto; }
      .page { grid-template-columns: 240px minmax(0, 1fr); height: auto; }
      .gacha { height: auto; overflow: visible; }
      .classement-panneau { height: auto; max-height: 70vh; }
      .chat-panneau {
        grid-column: 1 / -1;
        height: 360px;
        border-left: none;
        border-top: 1px solid var(--panneau-bord);
      }
    }
    @media (max-width: 800px) {
      .page { grid-template-columns: 1fr; }
      .classement-panneau {
        grid-column: auto;
        border-right: none;
        border-bottom: 1px solid var(--panneau-bord);
        max-height: none;
      }
      .classement-panneau .liste { max-height: 260px; flex: none; }
      .chat-panneau { height: 340px; border-top: none; border-bottom: 1px solid var(--panneau-bord); }
      .titre-topbar { font-size: 16px; }
      .droite-topbar #deconnexion { display: none; }
    }
  </style>
</head>
<body>

  <header id="topbar">
    <div class="starter-bloc">
      <div class="avatar">
        <img id="starter-img" alt="">
      </div>
      <div class="starter-info">
        <div class="starter-ligne">
          <span id="starter-nom">Chargement…</span>
          <span id="starter-niveau"></span>
        </div>
        <div class="xp-track"><div id="starter-xp-fill" class="xp-fill"></div></div>
        <div id="starter-xp"></div>
      </div>
    </div>

    <div class="titre-topbar">MONKEY COLLECTOR</div>

    <div class="droite-topbar">
      <div class="ressource" title="Coins">
        <span class="icone">💰</span>
        <span id="coins" class="valeur">0</span>
      </div>
      <button id="deconnexion">Déconnexion</button>
    </div>
  </header>

  <div class="page">
    <aside class="panneau classement-panneau">
      <h2>Classement</h2>
      <div id="classement" class="liste"></div>
    </aside>

    <main class="gacha">
      <div class="controles">
        <button id="tirer" class="bouton">Tirer un singe</button>
        <a href="/monkeydex.html" class="bouton">Monkeydex</a>
        <a href="/combat.html" class="bouton">Combat</a>
      </div>

      <p id="quota"></p>

      <p id="message"></p>

      <div id="carte">
        <h2 id="nom"></h2>
        <div id="rarete" class="rarete"></div>
        <p id="description"></p>
        <div id="niveau"></div>
        <img id="image" alt="">
        <div id="stats">
          <div class="stat"><span>HP</span><strong id="hp"></strong><small id="hp-croissance"></small></div>
          <div class="stat"><span>ATK</span><strong id="atk"></strong><small id="atk-croissance"></small></div>
          <div class="stat"><span>DEF</span><strong id="def"></strong><small id="def-croissance"></small></div>
          <div class="stat"><span>SPD</span><strong id="spd"></strong></div>
          <div class="stat"><span>PRE</span><strong id="prec"></strong></div>
          <div class="stat"><span>ESQ</span><strong id="esq"></strong></div>
          <div class="stat"><span>CRIT</span><strong id="crit"></strong></div>
          <div class="stat"><span>CRIT DMG</span><strong id="critdmg"></strong></div>
        </div>
      </div>
    </main>

    <aside class="panneau chat-panneau">
      <h2>Chat global</h2>
      <div id="messages" class="chat-texte"></div>
      <form id="formChat">
        <input id="texteChat" maxlength="200" placeholder="Parle à tout le monde…" autocomplete="off">
        <button id="envoyerChat" type="submit">Envoyer</button>
      </form>
      <div id="statutChat"></div>
    </aside>
  </div>

  <script src="/js/commun.js"></script>
  <script>
    const IMAGES_STARTERS = {
      "Fire monkey": "/images/Starters/fire_starter.png",
      "Ice monkey": "/images/Starters/ice_starter.png",
    };

    const INTERVALLE_CHAT_MS = 2000;
    const INTERVALLE_CLASSEMENT_MS = 10000;

    const imgStarter = document.getElementById("starter-img");
    imgStarter.addEventListener("error", () => {
      console.warn("Image starter introuvable :", imgStarter.src);
      imgStarter.classList.add("cachee");
    });
    imgStarter.addEventListener("load", () => imgStarter.classList.remove("cachee"));

    // Affiche le starter, sa barre d'XP et les coins
    function afficherStarter(starter) {
      if (!starter) return;
      const chemin = IMAGES_STARTERS[starter.nom];
      if (chemin) imgStarter.src = chemin;

      const seuil = starter.niveau * 100;
      const pct = Math.min(100, Math.round((starter.xp / seuil) * 100));

      document.getElementById("starter-nom").textContent = starter.nom;
      document.getElementById("starter-niveau").textContent = `Niv. ${starter.niveau}`;
      document.getElementById("starter-xp-fill").style.width = pct + "%";
      document.getElementById("starter-xp").textContent = `${starter.xp} / ${seuil} XP`;
      document.getElementById("coins").textContent = starter.coins ?? 0;
    }

    function chargerStarter(profil) {
      if (!profil.ok) return;
      if (!profil.data.starter) {
        window.location.replace("/starter.html");
        return;
      }
      afficherStarter(profil.data.starter);
      afficherQuota(profil.data.quota);
    }

    // ---------- Quota de tirages ----------

    let quotaEpuise = false;
    let minuteurReset = null;

    // Affiche les tirages restants, ou l'heure du prochain reset quand il n'y en a plus.
    // Au reset, le quota est relu auprès du serveur et le bouton réactivé.
    function afficherQuota(quota) {
      if (!quota) return;
      const zone = document.getElementById("quota");
      quotaEpuise = quota.restants <= 0;
      boutonTirer.disabled = quotaEpuise;
      zone.classList.toggle("epuise", quotaEpuise);

      if (quotaEpuise) {
        zone.textContent = `Plus de tirages ! Prochain reset à ${formaterHeure(quota.prochainReset)}`;
        clearTimeout(minuteurReset);
        // Petite marge pour être sûr que le serveur est passé dans la nouvelle fenêtre
        minuteurReset = setTimeout(rafraichirQuota, quota.msAvantReset + 1000);
      } else {
        zone.innerHTML = "";
        const nombre = document.createElement("strong");
        nombre.textContent = `${quota.restants} / ${quota.max}`;
        zone.append("Tirages restants : ", nombre);
      }
    }

    async function rafraichirQuota() {
      try {
        const { ok, data } = await api("/profil");
        if (ok) afficherQuota(data.quota);
      } catch {
        minuteurReset = setTimeout(rafraichirQuota, 5000);
      }
    }

    document.getElementById("deconnexion").addEventListener("click", async () => {
      await api("/deconnexion", { methode: "POST" });
      window.location.replace("/");
    });

    const boutonTirer = document.getElementById("tirer");

    boutonTirer.addEventListener("click", async () => {
      // Un seul tirage à la fois : évite les doubles clics
      if (boutonTirer.disabled) return;
      boutonTirer.disabled = true;
      try {
        await tirer();
      } catch {
        document.getElementById("message").textContent = "Erreur réseau, réessaie.";
      } finally {
        boutonTirer.disabled = quotaEpuise;
      }
    });

    async function tirer() {
      const { ok, data } = await api("/tirage", { methode: "POST" });
      if (!ok) {
        if (data.quota) {
          // Quota épuisé : le message du quota suffit
          document.getElementById("message").textContent = "";
          afficherQuota(data.quota);
        } else {
          document.getElementById("message").textContent = "Erreur : " + data.erreur;
        }
        return;
      }
      document.getElementById("message").textContent = "";
      afficherQuota(data.quota);
      const { espece, niveau, image, stats } = data;

      const rarete = infoRarete(espece.rarete);

      await prechargerImages([image, rarete.icone]);
      await new Promise(requestAnimationFrame);

      const elRarete = document.getElementById("rarete");
      elRarete.innerHTML = "";
      elRarete.style.borderColor = rarete.couleur;
      elRarete.style.color = rarete.couleur;
      const icone = document.createElement("img");
      icone.src = rarete.icone;
      icone.alt = "";
      elRarete.appendChild(icone);
      elRarete.appendChild(document.createTextNode(rarete.label));

      document.getElementById("nom").textContent = espece.nom;
      document.getElementById("description").textContent = espece.description ?? "";
      document.getElementById("niveau").textContent =
        `Niveau ${niveau.niveau} — ${niveau.progression}/${niveau.prochain} vers le suivant`;
      document.getElementById("image").src = image;

      for (const cle of ["hp", "atk", "def"]) {
        document.getElementById(cle).textContent = stats[cle];
        document.getElementById(cle + "-croissance").textContent = `+${espece.croissance[cle]} / niv.`;
      }
      for (const cle of ["spd", "prec", "esq"]) {
        document.getElementById(cle).textContent = stats[cle];
      }
      document.getElementById("crit").textContent = stats.crit + "%";
      document.getElementById("critdmg").textContent = stats.critdmg + "%";

      document.getElementById("carte").style.display = "flex";
      afficherStarter(data.starter);
      chargerClassement();
    }

    // ---------- Classement ----------

    async function chargerClassement() {
      const { ok, data } = await api("/classement");
      if (!ok) return;
      const { joueurs } = data;
      const zone = document.getElementById("classement");
      zone.innerHTML = "";

      if (joueurs.length === 0) {
        zone.innerHTML = `<p class="vide">Aucun joueur pour l'instant.</p>`;
        return;
      }

      joueurs.forEach((j, i) => {
        const ligne = document.createElement("div");
        ligne.className = "joueur" + (j.moi ? " moi" : "");

        const rang = document.createElement("span");
        rang.className = "rang";
        rang.textContent = i + 1;

        const pseudo = document.createElement("span");
        pseudo.className = "pseudo";
        pseudo.textContent = j.pseudo;

        const total = document.createElement("span");
        total.className = "total";
        total.textContent = j.total;

        ligne.append(rang, pseudo, total);
        zone.appendChild(ligne);
      });
    }

    // ---------- Chat global ----------

    let dernierIdMessage = 0;
    let rafraichissementChat = null;

    function retirerAnciens(plusAncienId) {
      if (!plusAncienId) return;
      const zone = document.getElementById("messages");
      for (const bulle of [...zone.children]) {
        if (Number(bulle.dataset.id) < plusAncienId) bulle.remove();
      }
    }

    // Une seule actualisation à la fois : si une tourne déjà, on attend celle-ci
    function rafraichirChat() {
      if (rafraichissementChat) return rafraichissementChat;

      rafraichissementChat = (async () => {
        try {
          const { ok, data } = await api(`/chat?apres=${dernierIdMessage}`);
          if (!ok) return;

          const zone = document.getElementById("messages");
          for (const m of data.messages) {
            if (zone.querySelector(`[data-id="${m.id}"]`)) continue;
            ajouterBulleChat(zone, m);
            dernierIdMessage = Math.max(dernierIdMessage, m.id);
          }
          retirerAnciens(data.plusAncienId);
        } catch {
          // Une perte réseau ne doit pas bloquer le reste de la page.
        } finally {
          rafraichissementChat = null;
        }
      })();

      return rafraichissementChat;
    }

    document.getElementById("formChat").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("texteChat");
      const texte = input.value.trim();
      if (!texte) return;

      const { ok, data } = await api("/chat", { corps: { texte } });
      if (!ok) {
        document.getElementById("statutChat").textContent = data.erreur;
        return;
      }
      input.value = "";
      document.getElementById("statutChat").textContent = "";
      await rafraichirChat();
    });

    // ---------- Chargement ----------

    Promise.all([exigerConnexion(), api("/profil")]).then(([moi, profil]) => {
      if (!moi) return;
      chargerStarter(profil);
      rafraichirChat();
      chargerClassement();
      setInterval(rafraichirChat, INTERVALLE_CHAT_MS);
      setInterval(chargerClassement, INTERVALLE_CLASSEMENT_MS);
    });
  </script>

  <script src="/js/session.js"></script>
</body>
</html>
