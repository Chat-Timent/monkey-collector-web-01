<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monkey Collector V0.1</title>
  <link rel="stylesheet" href="/css/commun.css">
  <link rel="stylesheet" href="/css/arbre.css">
  <link rel="stylesheet" href="/css/barre.css">
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: system-ui, sans-serif;
      background: var(--fond);
      color: var(--texte);
      margin: 0;
      min-height: 100vh;
    }

    /* Les cadres gardent leur hauteur naturelle : on ne les étire pas jusqu'au bas de
       l'écran, ça créait de grandes zones vides. */
    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Haut : le tirage à gauche, le dernier singe tiré à droite. `stretch` aligne le bas
       du cadre de tirage sur celui de la fiche, donc sur le haut de l'historique. */
    .haut {
      display: grid;
      grid-template-columns: minmax(0, 320px) minmax(0, 1fr);
      gap: 16px;
      align-items: stretch;
    }

    .carte {
      display: flex;
      flex-direction: column;
      background: var(--carte);
      border: 1px solid var(--carte-bord);
      border-radius: 16px;
      padding: 18px;
    }
    .carte h2 {
      margin: 0 0 12px;
      font-size: 13px;
      color: var(--texte-doux);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ---------- Bloc de tirage ---------- */

    .stock { text-align: center; }
    /* Le compteur se centre dans la hauteur restante, le bouton reste collé en bas */
    .stock .corps { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    .stock .nombre { font-size: 38px; font-weight: bold; line-height: 1.1; }
    .stock .nombre small { font-size: 16px; color: var(--texte-doux); font-weight: normal; }
    .jauge {
      height: 10px;
      margin: 10px 0 6px;
      background: #161616;
      border: 1px solid #3a3555;
      border-radius: 999px;
      overflow: hidden;
    }
    .jauge > i {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 0.3s ease;
    }
    .recharge { min-height: 18px; font-size: 13px; color: var(--texte-doux); }
    #tirer {
      width: 100%;
      margin-top: 14px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font: inherit;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
    }
    #tirer:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(229, 68, 122, 0.4); }
    #tirer:active { transform: translateY(0); }
    #tirer:disabled { background: #332f42; color: #777; cursor: default; transform: none; box-shadow: none; }
    #message { min-height: 20px; margin: 10px 0 0; color: var(--or); font-size: 13px; text-align: center; }

    /* ---------- Auto-tirage (bas du cadre de tirage) ---------- */

    .auto { margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--carte-bord); text-align: left; }
    .auto .titre { margin: 0 0 8px; font-size: 12px; color: var(--texte-doux); text-transform: uppercase; letter-spacing: 1px; }
    .auto .reglages { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 8px; }
    .auto select {
      width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #3a3555;
      background: #1e1b2e; color: var(--texte); font: inherit; font-size: 13px;
    }
    .auto select:disabled { opacity: 0.6; }
    #auto-bouton {
      width: 100%; margin-top: 8px; padding: 10px; border-radius: 10px; cursor: pointer;
      border: 1px solid var(--accent); background: transparent; color: var(--texte);
      font: inherit; font-size: 14px; font-weight: bold;
    }
    #auto-bouton.actif { background: #3a1f2e; }
    #auto-bouton:disabled { border-color: #332f42; color: #777; cursor: default; }
    #auto-etat { min-height: 18px; margin: 8px 0 0; font-size: 12px; color: var(--texte-doux); text-align: center; }

    /* Singe qui a arrêté l'auto-tirage : la fiche prend la couleur de sa rareté */
    .carte.trouve { border-color: var(--rarete); box-shadow: 0 0 0 1px var(--rarete), 0 0 24px color-mix(in srgb, var(--rarete) 35%, transparent); }
    .carte.trouve #titre-singe { color: color-mix(in srgb, var(--rarete) 55%, #ffffff); }

    /* ---------- Fiche du dernier singe tiré ---------- */

    #fiche-singe { flex: 1; }
    .singe { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 18px; }
    /* Carte haute : le portrait se centre sur la hauteur plutôt que de rester collé en haut */
    .singe .portrait { display: flex; align-items: center; justify-content: center; }
    .singe .portrait img { width: 150px; height: 150px; object-fit: contain; }
    .singe .nom { font-size: 24px; font-weight: bold; margin: 0 0 6px; }
    .singe .badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
    .singe .fam:not(:empty) { margin-bottom: 10px; }
    /* Bordure à la couleur exacte de la rareté, texte éclairci : le bleu du commun (#060ee4)
       est illisible tel quel sur fond sombre. */
    .rarete {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 12px 3px 4px; border-radius: 999px;
      font-size: 12px; font-weight: bold; border: 2px solid; background: #161616;
      color: color-mix(in srgb, var(--rarete) 55%, #ffffff);
    }
    .rarete img { width: 20px; height: 20px; object-fit: contain; }
    .singe .description { font-size: 14px; font-style: italic; color: var(--texte-doux); margin: 0 0 10px; }
    .singe .niveau { font-size: 13px; color: var(--or); margin-bottom: 12px; }
    .singe .competence {
      font-size: 12px; color: var(--texte-doux); margin-bottom: 12px;
      padding: 8px 10px; background: #1e1b2e; border-radius: 8px; border-left: 3px solid var(--accent);
    }
    #stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .stat { background: #1e1b2e; border-radius: 8px; padding: 6px 9px; }
    .stat span { display: block; font-size: 11px; color: #999; }
    .stat strong { display: block; font-size: 16px; }
    .stat small { color: var(--vert); font-size: 11px; }
    .gains { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .gains span {
      padding: 3px 10px; border-radius: 999px; background: #1e1b2e;
      border: 1px solid #3a3555; font-size: 12px; color: var(--vert);
    }

    /* ---------- Historique ---------- */

    /* Une seule ligne : les colonnes s'étirent pour toucher les deux bords du cadre, et le
       script n'affiche que le nombre de vignettes qui tiennent sur cette ligne. */
    .vignettes {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
      /* Filet de sécurité : la première ligne est la seule à avoir une hauteur, tout ce qui
         déborderait en dessous est coupé. */
      grid-template-rows: auto;
      grid-auto-rows: 0;
      overflow: hidden;
      gap: 8px;
    }
    .vignette {
      width: 100%; aspect-ratio: 1; max-height: 72px;
      border-radius: 10px; border: 2px solid var(--rarete, var(--carte-bord));
      background: #1e1b2e; object-fit: contain; padding: 3px;
    }
    .historique .vide { grid-column: 1 / -1; color: #777; font-size: 13px; margin: 0; }

    /* ---------- Bas : probabilités et flux des tirages notables ---------- */

    .bas { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
    .vide { color: #777; font-size: 13px; margin: 0; }

    /* Chances : une ligne par rareté, la barre est proportionnelle à la chance réelle
       (le commun écrase tout, c'est le propos) avec une largeur minimale pour rester visible. */
    .chance {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) 2fr auto;
      align-items: center;
      gap: 10px;
      padding: 3px 0;
      font-size: 13px;
    }
    .chance img { width: 20px; height: 20px; object-fit: contain; }
    .chance .nom { color: var(--texte-doux); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chance .piste { height: 8px; background: #161616; border: 1px solid #3a3555; border-radius: 999px; overflow: hidden; }
    .chance .piste > i { display: block; height: 100%; min-width: 4px; background: var(--rarete); }
    .chance .pct { font-weight: bold; font-variant-numeric: tabular-nums; }
    /* Bonus de l'arbre (Flair) : le taux de base reste affiché, barré */
    .chance .base { color: #6d6a80; font-weight: normal; text-decoration: line-through; margin-right: 6px; font-size: 12px; }

    /* Flux : les derniers légendaires et mythiques tirés par tout le monde */
    .flux { display: flex; flex-direction: column; gap: 6px; max-height: 232px; overflow-y: auto; padding-right: 4px; }
    .notable {
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
      padding: 5px 9px; border-radius: 10px; background: #1e1b2e;
      border: 1px solid transparent; border-left: 3px solid var(--rarete);
    }
    .notable.moi { border-color: var(--accent); border-left-color: var(--rarete); }
    .notable img { width: 32px; height: 32px; object-fit: contain; flex-shrink: 0; }
    .notable .texte { min-width: 0; flex: 1; }
    .notable .qui { font-size: 13px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .notable .quoi { font-size: 12px; color: color-mix(in srgb, var(--rarete) 55%, #ffffff); }
    .notable .quand { font-size: 11px; color: #777; white-space: nowrap; flex-shrink: 0; }

    @media (max-width: 860px) {
      .haut { grid-template-columns: minmax(0, 1fr); }
      .bas { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 560px) {
      .page { padding: 14px 10px; }
      .singe { grid-template-columns: minmax(0, 1fr); }
      .singe .portrait img { width: 120px; height: 120px; }
      #stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      /* Le nom de rareté passe en entier (« Non-commun »), c'est la barre qui rétrécit */
      .chance { grid-template-columns: 22px auto minmax(0, 1fr) auto; gap: 8px; }
    }
  </style>
</head>
<body>

  <div class="page">
    <div class="haut">
      <section class="carte stock">
        <h2>Tirages disponibles</h2>
        <div class="corps">
          <div class="nombre" id="stock-nombre">…</div>
          <div class="jauge"><i id="stock-jauge"></i></div>
          <div class="recharge" id="stock-recharge"></div>
        </div>
        <button id="tirer" type="button" disabled>Tirer un singe</button>
        <p id="message"></p>
        <div class="auto">
          <p class="titre">Auto-tirage</p>
          <div class="reglages">
            <select id="auto-rythme" aria-label="Rythme de l'auto-tirage">
              <option value="1">1 / s</option>
              <option value="2">2 / s</option>
              <option value="5">5 / s</option>
            </select>
            <select id="auto-rarete" aria-label="Rareté qui arrête l'auto-tirage"></select>
          </div>
          <button id="auto-bouton" type="button" disabled>Lancer l'auto-tirage</button>
          <p id="auto-etat"></p>
        </div>
      </section>

      <section class="carte" id="carte-singe">
        <h2 id="titre-singe">Dernier tirage</h2>
        <div id="fiche-singe"></div>
      </section>
    </div>

    <section class="carte historique">
      <h2>Historique des tirages</h2>
      <div class="vignettes" id="historique"></div>
    </section>

    <div class="bas">
      <section class="carte">
        <h2>Chances de tirage</h2>
        <div id="chances"></div>
      </section>

      <section class="carte">
        <h2>Derniers légendaires et mieux</h2>
        <div class="flux" id="flux"></div>
      </section>
    </div>
  </div>

  <script src="/js/commun.js"></script>
  <script src="/js/arbre.js"></script>
  <script src="/js/barre.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    // Historique gardé dans le navigateur : la liste des espèces tirées, la plus récente d'abord.
    // Le serveur ne garde pas l'historique des tirages ; ici seules les espèces sont stockées,
    // les détails sont relus dans /monkeydex à chaque chargement.
    const CLE_HISTORIQUE = "monkey-historique-tirages";
    // Assez de tirages gardés pour remplir des lignes entières de vignettes, quelle que soit la largeur
    const MAX_HISTORIQUE = 24;

    let parEspece = {};        // espece → fiche complète (réponse /monkeydex)
    let historique = [];       // espèces tirées, la plus récente d'abord

    function lireHistorique() {
      try {
        const brut = JSON.parse(localStorage.getItem(CLE_HISTORIQUE) ?? "[]");
        return Array.isArray(brut) ? brut.filter((e) => typeof e === "string") : [];
      } catch {
        return []; // stockage indisponible ou contenu abîmé : on repart d'une liste vide
      }
    }
    function ecrireHistorique() {
      try {
        localStorage.setItem(CLE_HISTORIQUE, JSON.stringify(historique));
      } catch {
        // Navigation privée ou stockage plein : l'historique vit alors le temps de la page
      }
    }

    // ---------- Stock de tirages ----------

    // Dernier quota reçu du serveur et instant de réception : la recharge (+1 toutes les
    // `intervalleMs` sous le plafond) est ensuite simulée ici, seconde par seconde.
    let quotaRecu = null;
    let recuA = 0;
    let quotaEpuise = false;
    let tirageEnCours = false;

    function formaterDuree(ms) {
      const sec = Math.max(0, Math.ceil(ms / 1000));
      return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
    }

    function quotaActuel() {
      let { restants, max, intervalleMs, msAvantProchain } = quotaRecu;
      if (msAvantProchain !== null) {
        msAvantProchain -= performance.now() - recuA;
        while (msAvantProchain <= 0 && restants < max) {
          restants += 1;
          msAvantProchain += intervalleMs;
        }
        if (restants >= max) msAvantProchain = null;
      }
      return { restants, max, msAvantProchain };
    }

    function afficherQuota(quota) {
      if (!quota) return;
      quotaRecu = quota;
      recuA = performance.now();
      dessinerQuota();
    }

    function dessinerQuota() {
      if (!quotaRecu) return;
      const { restants, max, msAvantProchain } = quotaActuel();
      $("stock-nombre").innerHTML = `${restants} <small>/ ${max}</small>`;
      $("stock-jauge").style.width = Math.min(100, Math.round((restants / max) * 100)) + "%";
      $("stock-recharge").textContent = msAvantProchain === null
        ? "Stock plein"
        : `+1 tirage dans ${formaterDuree(msAvantProchain)}`;
      quotaEpuise = restants <= 0;
      // Pendant un tirage, le bouton reste bloqué : il sera réactivé à la fin
      if (!tirageEnCours) $("tirer").disabled = quotaEpuise;
      Barre.afficherQuota({ restants, max });
    }

    setInterval(dessinerQuota, 250);

    async function rafraichirQuota() {
      try {
        const { ok, data } = await api("/profil");
        if (ok) afficherQuota(data.quota);
      } catch { /* on garde le quota simulé */ }
    }

    // ---------- Fiche du singe ----------

    const STATS = [
      ["hp", "PV"], ["atk", "ATK"], ["def", "DEF"], ["spd", "Vitesse"],
      ["prec", "Précision"], ["esq", "Esquive"], ["crit", "Critique"], ["critdmg", "Dégâts crit"],
    ];
    const POURCENTAGE = new Set(["crit", "critdmg"]);
    const CROISSANCE = new Set(["hp", "atk", "def"]);

    // `singe` a la forme d'une entrée de /monkeydex. `gains` (facultatif) : bonus du tirage qui vient
    // d'avoir lieu. `titre` dit si c'est vraiment le dernier tirage ou le singe montré par défaut.
    // `trouve` : singe qui a arrêté l'auto-tirage, la fiche prend la couleur de sa rareté.
    function afficherSinge(singe, { gains = null, titre = "Dernier tirage", trouve = false } = {}) {
      $("titre-singe").textContent = titre;
      const carte = $("carte-singe");
      carte.classList.toggle("trouve", Boolean(trouve && singe));
      if (trouve && singe) carte.style.setProperty("--rarete", infoRarete(singe.espece.rarete).couleur);
      const zone = $("fiche-singe");
      if (!singe) {
        zone.innerHTML = `<p class="description">Fais ton premier tirage pour voir un singe ici.</p>`;
        return;
      }
      const r = infoRarete(singe.espece.rarete);
      zone.className = "singe";
      zone.innerHTML = `
        <div class="portrait"><img alt=""></div>
        <div>
          <div class="badges"><span class="rarete"><img alt=""><span class="label"></span></span></div>
          <h3 class="nom"></h3>
          <p class="description"></p>
          <div class="fam"></div>
          <div class="niveau"></div>
          <div class="competence" hidden></div>
          <div id="stats"></div>
          <div class="gains"></div>
        </div>`;

      const img = zone.querySelector(".portrait img");
      img.src = singe.image;
      img.alt = singe.espece.nom;
      zone.querySelector(".nom").textContent = singe.espece.nom;
      const badge = zone.querySelector(".rarete");
      badge.style.setProperty("--rarete", r.couleur);
      badge.style.borderColor = r.couleur;
      badge.querySelector("img").src = r.icone;
      badge.querySelector(".label").textContent = r.label;
      zone.querySelector(".fam").innerHTML = ligneTraitsHTML(singe.espece);
      zone.querySelector(".description").textContent = singe.espece.description ?? "";
      zone.querySelector(".niveau").innerHTML =
        `Niveau ${singe.niveau.niveau} · ${singe.niveau.progression} / ${singe.niveau.prochain} vers le suivant`
        + (singe.eveil ? ` · ${etoilesEveilHTML(singe.eveil.niveau, singe.eveil.max)}` : "");

      const texteCompetence = descriptionCompetence(singe.competence);
      if (texteCompetence) {
        const bloc = zone.querySelector(".competence");
        bloc.hidden = false;
        bloc.textContent = `${singe.competence.icone} ${singe.competence.nom} : ${texteCompetence}`;
      }

      zone.querySelector("#stats").innerHTML = STATS.map(([cle, libelle]) => {
        const valeur = singe.stats[cle] + (POURCENTAGE.has(cle) ? " %" : "");
        const croissance = CROISSANCE.has(cle) ? `<small>+${singe.espece.croissance[cle]} / niv.</small>` : "";
        return `<div class="stat"><span>${libelle}</span><strong>${valeur}</strong>${croissance}</div>`;
      }).join("");

      const lignes = [];
      if (gains?.xp) lignes.push(`+${gains.xp} XP`);
      if (gains?.coins) lignes.push(`💰 +${gains.coins} coins`);
      if (gains?.copieBonus) lignes.push("Doublon chanceux : une copie en plus");
      if (gains?.etincelle) lignes.push("Étincelle : rare garanti");
      if (gains?.niveauxGagnes) lignes.push("Niveau supérieur : +1 point de talent");
      zone.querySelector(".gains").innerHTML = lignes.map((t) => `<span>${t}</span>`).join("");
    }

    // ---------- Historique ----------

    // Nombre de colonnes que la grille a créées pour la largeur actuelle : c'est exactement
    // le nombre de vignettes qui remplit la ligne d'un bord à l'autre.
    function colonnesHistorique() {
      const colonnes = getComputedStyle($("historique")).gridTemplateColumns.split(" ").filter(Boolean);
      return Math.max(1, colonnes.length);
    }

    function afficherHistorique() {
      const zone = $("historique");
      zone.innerHTML = "";
      // Une seule ligne : au-delà, les plus anciens tirages sortent du cadre.
      const connus = historique.map((e) => parEspece[e]).filter(Boolean).slice(0, colonnesHistorique());
      if (connus.length === 0) {
        zone.innerHTML = `<p class="vide">Aucun tirage pour l'instant.</p>`;
        return;
      }
      for (const s of connus) {
        const img = document.createElement("img");
        img.className = "vignette";
        img.src = s.image;
        img.alt = s.espece.nom;
        img.title = `${s.espece.nom} · ${infoRarete(s.espece.rarete).label}`;
        img.style.setProperty("--rarete", infoRarete(s.espece.rarete).couleur);
        zone.appendChild(img);
      }
    }

    // ---------- Chances et flux des tirages notables ----------

    // Les chances vont de 77 % à moins de 0,1 % : une décimale pour les grandes,
    // trois pour les miettes, sinon le mythique s'afficherait « 0 % ».
    function pctChance(part) {
      const pct = part * 100;
      return pct.toLocaleString("fr-FR", { maximumFractionDigits: pct >= 1 ? 1 : 3 }) + " %";
    }

    function afficherChances({ chances, chancesBase }) {
      const base = Object.fromEntries(chancesBase.map((c) => [c.rarete, c.chance]));
      const maxi = Math.max(...chances.map((c) => c.chance));
      $("chances").innerHTML = chances.map(({ rarete, chance }) => {
        const r = infoRarete(rarete);
        // Flair ne change que les raretés rares : ailleurs il n'y a rien à comparer
        const avant = Math.abs(base[rarete] - chance) > 1e-9
          ? `<span class="base">${pctChance(base[rarete])}</span>` : "";
        return `
          <div class="chance" style="--rarete: ${r.couleur}">
            <img src="${r.icone}" alt="">
            <span class="nom">${r.label}</span>
            <span class="piste"><i style="width: ${(chance / maxi) * 100}%"></i></span>
            <span class="pct">${avant}${pctChance(chance)}</span>
          </div>`;
      }).join("");
    }

    function ilYa(iso) {
      const minutes = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
      if (minutes < 1) return "à l'instant";
      if (minutes < 60) return `il y a ${minutes} min`;
      const heures = Math.round(minutes / 60);
      if (heures < 24) return `il y a ${heures} h`;
      return `il y a ${Math.round(heures / 24)} j`;
    }

    function afficherFlux(notables) {
      const zone = $("flux");
      if (notables.length === 0) {
        zone.innerHTML = `<p class="vide">Personne n'a encore tiré de légendaire. À toi de jouer.</p>`;
        return;
      }
      // Construit avec textContent : un pseudo n'est jamais interprété en HTML.
      zone.innerHTML = "";
      for (const n of notables) {
        const r = infoRarete(n.rarete);
        const ligne = document.createElement("div");
        ligne.className = "notable" + (n.moi ? " moi" : "");
        ligne.style.setProperty("--rarete", r.couleur);
        ligne.innerHTML = `<img alt=""><div class="texte"><div class="qui"></div><div class="quoi"></div></div><div class="quand"></div>`;
        ligne.querySelector("img").src = n.image;
        ligne.querySelector(".qui").textContent = n.moi ? "Toi" : n.pseudo;
        ligne.querySelector(".quoi").textContent = `${n.nom} · ${r.label}`;
        ligne.querySelector(".quand").textContent = ilYa(n.date);
        zone.appendChild(ligne);
      }
    }

    async function rafraichirLoterie() {
      try {
        const { ok, data } = await api("/loterie");
        if (!ok) return;
        afficherChances(data);
        afficherFlux(data.notables);
      } catch {
        // Réseau indisponible : les deux cadres gardent leur contenu précédent
      }
    }

    // La largeur du cadre change le nombre de colonnes : on redessine la ligne. L'observateur
    // réagit à la mise en page elle-même, donc aussi aux changements sans `resize` de fenêtre.
    let largeurHistorique = 0;
    new ResizeObserver(([entree]) => {
      const largeur = Math.round(entree.contentRect.width);
      if (largeur === largeurHistorique) return;
      largeurHistorique = largeur;
      afficherHistorique();
    }).observe($("historique"));

    // ---------- Tirage ----------

    // La fiche du Monkeydex garde la compétence et l'éveil ; le tirage apporte les
    // valeurs fraîches (copies, niveau, stats). On fusionne les deux, et le tirage entre
    // en tête de l'historique (à enregistrer ensuite avec ecrireHistorique).
    function fusionnerTirage(data) {
      const singe = {
        ...(parEspece[data.id] ?? {}),
        id: data.id,
        espece: data.espece,
        image: data.image,
        amount: data.amount,
        niveau: data.niveau,
        stats: data.stats,
        statsBase: data.stats,
      };
      parEspece[data.id] = singe;
      historique = [data.id, ...historique].slice(0, MAX_HISTORIQUE);
      return singe;
    }

    $("tirer").addEventListener("click", async () => {
      if ($("tirer").disabled || tirageEnCours) return;
      tirageEnCours = true;
      $("tirer").disabled = true;
      $("message").textContent = "";
      try {
        const { ok, data } = await api("/tirage", { methode: "POST" });
        if (!ok) {
          // Quota épuisé : le décompte sous la jauge suffit comme explication
          $("message").textContent = data.quota ? "" : `Erreur : ${data.erreur}`;
          if (data.quota) afficherQuota(data.quota);
          return;
        }

        const singe = fusionnerTirage(data);
        ecrireHistorique();

        await prechargerImages([data.image, infoRarete(data.espece.rarete).icone]);
        afficherSinge(singe, { gains: { ...data.gains, niveauxGagnes: data.starter?.niveauxGagnes } });
        afficherHistorique();
        afficherQuota(data.quota);
        Barre.afficherStarter(data.starter);
        Barre.afficherPoints(data.pointsArbre);
        // Un légendaire ou un mythique vient d'entrer dans le flux : on le remonte tout de suite
        if (["legendary", "mythic", "prismatic"].includes(data.espece.rarete)) rafraichirLoterie();
      } catch {
        $("message").textContent = "Erreur réseau, réessaie.";
      } finally {
        tirageEnCours = false;
        dessinerQuota();
      }
    });

    // ---------- Auto-tirage ----------

    // Le serveur fait les tirages : la page l'appelle toutes les secondes pendant que ça tourne,
    // et les autres pages font avancer l'auto-tirage via /profil. Au retour, le singe qui a
    // arrêté l'auto-tirage est montré une fois (son instant d'arrêt est retenu dans le navigateur).
    const RARETES_AUTO = ["uncommon", "rare", "epic", "legendary", "mythic", "prismatic"];
    const CLE_ARRET_VU = "monkey-auto-arret-vu";
    const INTERVALLE_AUTO_MS = 1000;
    let autoEtat = null;
    let autoMinuteur = null;
    let autoRequete = false;

    // La plus haute rareté n'a rien au-dessus d'elle : pas de « ou mieux »
    $("auto-rarete").innerHTML = RARETES_AUTO.map((r, i) => {
      const label = infoRarete(r).label;
      return `<option value="${r}">${label}${i < RARETES_AUTO.length - 1 ? " ou mieux" : ""}</option>`;
    }).join("");
    $("auto-rarete").value = "rare";

    function lireArretVu() {
      try { return localStorage.getItem(CLE_ARRET_VU); } catch { return null; }
    }
    function ecrireArretVu(valeur) {
      try { localStorage.setItem(CLE_ARRET_VU, valeur); } catch { /* stockage indisponible */ }
    }

    function pluriel(n) {
      return `${n} tirage${n > 1 ? "s" : ""}`;
    }

    function afficherAuto(auto) {
      // Premier affichage ou auto-tirage en cours : les listes montrent le réglage enregistré
      const reprendreReglage = auto.actif || autoEtat === null;
      autoEtat = auto;
      const bouton = $("auto-bouton");
      bouton.disabled = false;
      bouton.classList.toggle("actif", auto.actif);
      bouton.textContent = auto.actif ? "Arrêter l'auto-tirage" : "Lancer l'auto-tirage";
      $("auto-rythme").disabled = auto.actif;
      $("auto-rarete").disabled = auto.actif;
      if (reprendreReglage) {
        $("auto-rythme").value = String(auto.rythme);
        $("auto-rarete").value = auto.rareteMin;
      }

      let texte = "";
      if (auto.actif) {
        texte = `En cours · ${pluriel(auto.nbFaits)}`;
      } else if (auto.arret) {
        const nom = auto.arret.espece ? parEspece[auto.arret.espece]?.espece.nom : null;
        const pourquoi = {
          filtre: nom ? `${nom} trouvé !` : "singe trouvé !",
          stock: "stock épuisé.",
          manuel: "arrêté.",
        }[auto.arret.raison] ?? "";
        texte = `${pluriel(auto.nbFaits)} · ${pourquoi}`;
      }
      $("auto-etat").textContent = texte;

      if (auto.actif && !autoMinuteur) autoMinuteur = setInterval(passageAuto, INTERVALLE_AUTO_MS);
      if (!auto.actif && autoMinuteur) {
        clearInterval(autoMinuteur);
        autoMinuteur = null;
      }
    }

    // Singe qui a arrêté l'auto-tirage sur le filtre : affiché en grand une seule fois.
    async function montrerArret(auto, gains = null) {
      const arret = auto.arret;
      if (!arret || arret.raison !== "filtre" || !arret.espece) return;
      const cle = `${arret.espece}|${arret.date}`;
      if (lireArretVu() === cle) return;
      // Espèce obtenue pendant l'absence (tirée via /profil) : pas encore dans le Monkeydex chargé
      if (!parEspece[arret.espece]) {
        const dex = await api("/monkeydex").catch(() => null);
        if (dex?.ok) parEspece = Object.fromEntries(dex.data.singes.map((s) => [s.id, s]));
      }
      const singe = parEspece[arret.espece];
      if (!singe) return;
      ecrireArretVu(cle);
      if (historique[0] !== arret.espece) {
        historique = [arret.espece, ...historique].slice(0, MAX_HISTORIQUE);
        ecrireHistorique();
        afficherHistorique();
      }
      await prechargerImages([singe.image, infoRarete(singe.espece.rarete).icone]);
      afficherSinge(singe, { gains, titre: "Auto-tirage : trouvé !", trouve: true });
      afficherAuto(auto); // le nom du singe est maintenant connu
      // Sur mobile la fiche est sous le cadre de tirage : on la fait venir à l'écran,
      // juste sous la barre du haut (collée en haut, elle cacherait le titre)
      const sousBarre = ($("barre-haut")?.getBoundingClientRect().bottom ?? 0) + 8;
      const haut = $("carte-singe").getBoundingClientRect().top;
      if (haut < sousBarre || haut > window.innerHeight * 0.6) {
        window.scrollBy({ top: haut - sousBarre, behavior: "smooth" });
      }
    }

    async function traiterPassage(data) {
      const tirages = data.tirages ?? [];
      if (tirages.length > 0) {
        let singe = null;
        for (const t of tirages) singe = fusionnerTirage(t);
        ecrireHistorique();
        afficherHistorique();
        const dernier = tirages.at(-1);
        const finFiltre = data.auto.arret?.raison === "filtre" && data.auto.arret.espece === dernier.id;
        if (finFiltre) {
          await montrerArret(data.auto, dernier.gains);
        } else {
          await prechargerImages([dernier.image, infoRarete(dernier.espece.rarete).icone]);
          afficherSinge(singe, { gains: dernier.gains, titre: "Auto-tirage" });
        }
        if (tirages.some((t) => ["legendary", "mythic", "prismatic"].includes(t.espece.rarete))) rafraichirLoterie();
      }
      afficherQuota(data.quota);
      if (data.starter) Barre.afficherStarter(data.starter);
      if (data.pointsArbre !== null && data.pointsArbre !== undefined) Barre.afficherPoints(data.pointsArbre);
      afficherAuto(data.auto);
      await montrerArret(data.auto);
    }

    async function passageAuto() {
      if (autoRequete) return;
      autoRequete = true;
      try {
        const { ok, data } = await api("/tirage/auto");
        if (ok) await traiterPassage(data);
      } catch {
        // Réseau coupé : on réessaie au prochain passage, le serveur rattrapera
      } finally {
        autoRequete = false;
      }
    }

    $("auto-bouton").addEventListener("click", async () => {
      const bouton = $("auto-bouton");
      if (bouton.disabled) return;
      bouton.disabled = true;
      $("message").textContent = "";
      try {
        const lancer = !autoEtat?.actif;
        const { ok, data } = lancer
          ? await api("/tirage/auto", {
            methode: "POST",
            corps: { rythme: Number($("auto-rythme").value), rarete: $("auto-rarete").value },
          })
          : await api("/tirage/auto/arreter", { methode: "POST" });
        if (!ok) {
          $("message").textContent = data.quota ? "Plus de tirages disponibles." : `Erreur : ${data.erreur}`;
          if (data.quota) afficherQuota(data.quota);
          return;
        }
        afficherAuto(data.auto);
      } catch {
        $("message").textContent = "Erreur réseau, réessaie.";
      } finally {
        bouton.disabled = false;
      }
    });

    // ---------- Chargement ----------

    // Un déblocage dans l'arbre peut changer le plafond et la recharge (Ressourcement),
    // et Flair change les probabilités affichées.
    document.addEventListener("arbre-change", () => {
      rafraichirQuota();
      rafraichirLoterie();
    });
    // Tirages gagnés par le cadeau ou les quêtes du footer (et un légendaire offert entre dans le flux)
    document.addEventListener("recompense-recue", () => {
      rafraichirQuota();
      rafraichirLoterie();
    });

    // Les légendaires des autres joueurs arrivent sans qu'on recharge la page
    const INTERVALLE_FLUX_MS = 60000;
    setInterval(rafraichirLoterie, INTERVALLE_FLUX_MS);

    (async () => {
      if (!(await exigerConnexion())) return;
      rafraichirLoterie();
      const [profil, dex] = await Promise.all([Barre.profil, api("/monkeydex")]);
      if (profil.ok) afficherQuota(profil.data.quota);

      if (dex.ok) {
        parEspece = Object.fromEntries(dex.data.singes.map((s) => [s.id, s]));
        // Espèces disparues du jeu ou pas encore possédées : retirées de l'historique
        historique = lireHistorique().filter((e) => parEspece[e]);
        ecrireHistorique();
        afficherHistorique();

        // La fiche ne doit jamais être vide : sans historique dans ce navigateur, on montre
        // le plus beau singe de la collection (les singes sont triés par rareté).
        const dernier = historique[0];
        if (dernier) {
          afficherSinge(parEspece[dernier]);
        } else {
          afficherSinge(dex.data.singes[0], { titre: "Ton plus beau singe" });
        }
      }
      // État de l'auto-tirage (et singe qui l'a arrêté pendant l'absence)
      passageAuto();
    })();
  </script>

  <script src="/js/session.js"></script>
</body>
</html>
