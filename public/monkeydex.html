<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monkeydex</title>
  <link rel="stylesheet" href="/css/commun.css">
  <link rel="stylesheet" href="/css/arbre.css">
  <link rel="stylesheet" href="/css/barre.css">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #161616;
      color: #f2f2f2;
      margin: 0;
      min-height: 100vh;
    }
    .contenu { padding: 24px 20px 40px; }
    #total { max-width: 1000px; margin: 0 auto 20px; color: #bbb; }
    #grille {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
    }
    .carte {
      background: #242424;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      border: 1px solid #333;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
      font: inherit;
      color: inherit;
    }
    .carte:hover { border-color: #ff8a3d; transform: translateY(-2px); }
    .carte img { width: 90px; height: 90px; object-fit: contain; }
    .carte h3 { margin: 0; font-size: 15px; }
    .rarete {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px 2px 3px;
      border-radius: 999px;
      border: 1.5px solid;
      font-size: 11px;
      font-weight: bold;
      background: #1e1b2e;
    }
    .rarete img { width: 14px; height: 14px; object-fit: contain; }
    .niv { color: #ffb86b; font-size: 12px; }
    .pagination {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      margin-top: 24px;
    }
    .pagination button {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #2a2640;
      color: #fff;
      cursor: pointer;
    }
    .pagination button:disabled { opacity: 0.4; cursor: default; }
    .compteur { display: flex; gap: 10px; flex-wrap: wrap; max-width: 1000px; margin: 0 auto 20px; }
    .compteur span {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 999px;
      background: #2a2640; border: 1.5px solid; font-size: 13px; font-weight: bold;
    }
    .compteur img { width: 16px; height: 16px; }

    /* Fenêtre de détail */
    #detail {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }
    #detail.ouverte { display: flex; }
    .fiche {
      background: #242424;
      border: 1px solid #444;
      border-radius: 16px;
      padding: 24px;
      width: min(480px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .fermer {
      position: absolute;
      top: 10px;
      right: 12px;
      background: none;
      border: none;
      color: #bbb;
      font-size: 22px;
      cursor: pointer;
    }
    .fiche-entete { display: flex; gap: 16px; align-items: center; }
    .fiche-entete img { width: 110px; height: 110px; object-fit: contain; flex-shrink: 0; }
    .fiche h2 { margin: 0 0 6px; font-size: 22px; }
    .fiche .description { font-style: italic; color: #bbb; font-size: 14px; margin: 0 0 10px; }
    .fiche .niveau { color: #ffb86b; font-size: 13px; }
    .fiche .detail-traits:not(:empty) { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 8px; }
    .bouton-trait {
      display: inline-flex; align-items: center; gap: 6px;
      background: none; border: none; padding: 0; color: var(--texte-doux); font: inherit; cursor: pointer;
    }
    .bouton-trait:hover .trait { filter: brightness(1.25); }
    .fiche table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 18px;
      font-size: 14px;
    }
    .fiche th, .fiche td {
      padding: 7px 6px;
      border-bottom: 1px solid #333;
      text-align: right;
    }
    .fiche th:first-child, .fiche td:first-child { text-align: left; }
    .fiche th { color: #999; font-weight: normal; font-size: 12px; text-transform: uppercase; }
    .fiche td.croissance { color: #7fdc9a; }
    .competence {
      margin-top: 16px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--couleur);
      background: color-mix(in srgb, var(--couleur) 12%, transparent);
      font-size: 14px;
    }
    .competence[hidden] { display: none; }
    .competence strong { color: var(--couleur); }
    .competence p { margin: 4px 0 0; color: #ddd; }

    /* Éveil : étoiles sur la carte (contour doré au maximum) et section de la fiche */
    .carte .etoiles-eveil { font-size: 17px; line-height: 1; }
    .carte.eveil-max { border-color: #ffd54f; box-shadow: 0 0 14px rgba(255, 213, 79, 0.35); }
    .fiche .etoiles-eveil { font-size: 20px; }
    .eveil {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      border: 1.5px solid #6b5a22;
      background: rgba(255, 213, 79, 0.06);
      font-size: 14px;
    }
    .eveil[hidden] { display: none; }
    .eveil-entete { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .eveil-entete strong { color: #ffd54f; }
    .eveil-niveaux { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    .eveil-niveaux li { display: flex; gap: 10px; padding: 6px 8px; border-radius: 8px; background: #1c1c1c; color: #777; font-size: 13px; }
    .eveil-niveaux li .num { width: 62px; flex-shrink: 0; font-weight: bold; }
    .eveil-niveaux li.atteint { color: var(--texte); }
    .eveil-niveaux li.actuel { outline: 1px solid #ffd54f; }
    .eveil-pied { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .eveil-pied .stock { color: #ffd54f; font-weight: bold; }
    .eveil-pied button {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }
    .eveil-pied button:disabled { background: #333; color: #888; cursor: default; }
    .eveil-message { min-height: 1.2em; margin: 8px 0 0; color: var(--or); font-size: 13px; }
  </style>
</head>
<body>
  <main class="contenu">
  <p id="total"></p>
  <div id="compteur" class="compteur"></div>
  <div id="grille"></div>

  <div class="pagination">
    <button id="precedent">◀</button>
    <span id="page"></span>
    <button id="suivant">▶</button>
  </div>
  </main>

  <div id="detail">
    <div class="fiche">
      <button class="fermer" id="fermer" aria-label="Fermer">×</button>
      <div class="fiche-entete">
        <img id="detail-image" alt="">
        <div>
          <h2 id="detail-nom"></h2>
          <p class="description" id="detail-description"></p>
          <div class="niveau" id="detail-niveau"></div>
          <div id="detail-traits" class="detail-traits"></div>
        </div>
      </div>
      <div id="detail-competence" class="competence" hidden></div>
      <div id="detail-eveil" class="eveil" hidden></div>
      <table>
        <thead>
          <tr><th>Stat</th><th>Actuelle</th><th>Base</th><th>Croissance / niv.</th></tr>
        </thead>
        <tbody id="detail-stats"></tbody>
      </table>
    </div>
  </div>

  <script src="/js/commun.js"></script>
  <script src="/js/arbre.js"></script>
  <script src="/js/barre.js"></script>
  <script src="/js/session.js"></script>
  <script>
    // Libellés et ordre d'affichage des stats dans la fiche
    const STATS_FICHE = [
      { cle: "hp",      libelle: "PV",          suffixe: "" },
      { cle: "atk",     libelle: "ATK",         suffixe: "" },
      { cle: "def",     libelle: "DEF",         suffixe: "" },
      { cle: "spd",     libelle: "Vitesse",     suffixe: "" },
      { cle: "prec",    libelle: "Précision",   suffixe: "" },
      { cle: "esq",     libelle: "Esquive",     suffixe: "" },
      { cle: "crit",    libelle: "Critique",    suffixe: "%" },
      { cle: "critdmg", libelle: "Dégâts crit", suffixe: "%" },
    ];

    const PAR_PAGE = 12;
    let singes = [];
    let essence = 0; // stock d'essence (éveil depuis la fiche)
    let infosTraits = null; // { resonances, compte } pour le panneau des traits (réponse /equipe)
    let page = 0;
    let renduVersion = 0;
    const grille = document.getElementById("grille");

    function carteHTML(s, indexGlobal) {
      const r = infoRarete(s.espece.rarete);
      return `
        <button class="carte${s.eveil && s.eveil.niveau >= s.eveil.max ? " eveil-max" : ""}" data-index="${indexGlobal}">
          <img src="${s.image}" alt="">
          <h3>${s.espece.nom} <small>×${s.amount}</small></h3>
          ${s.eveil ? etoilesEveilHTML(s.eveil.niveau, s.eveil.max) : ""}
          <span class="rarete" style="border-color:${r.couleur}; color:${r.couleur}">
            <img src="${r.icone}" alt="">
            ${r.label}
          </span>
          ${badgesTraitsHTML(s.espece)}
          <div class="niv">Lvl ${s.niveau.niveau} (${s.niveau.progression}/${s.niveau.prochain})</div>
        </button>`;
    }

    async function afficher() {
      const version = ++renduVersion;
      const totalPages = Math.max(1, Math.ceil(singes.length / PAR_PAGE));
      const debut = page * PAR_PAGE;
      const morceau = singes.slice(debut, debut + PAR_PAGE);

      await prechargerImages(morceau.flatMap((s) => [s.image, infoRarete(s.espece.rarete).icone]));
      if (version !== renduVersion) return;

      grille.innerHTML = morceau.length
        ? morceau.map((s, i) => carteHTML(s, debut + i)).join("")
        : "<p>Aucun singe trouvé.</p>";

      document.getElementById("page").textContent = `Page ${page + 1}/${totalPages}`;
      document.getElementById("precedent").disabled = page === 0;
      document.getElementById("suivant").disabled = page >= totalPages - 1;
    }

    // ---------- Fiche détaillée ----------

    function ouvrirFiche(s) {
      const r = infoRarete(s.espece.rarete);

      document.getElementById("detail-image").src = s.image;
      document.getElementById("detail-nom").textContent = s.espece.nom;
      document.getElementById("detail-nom").style.color = r.couleur;
      document.getElementById("detail-description").textContent = s.espece.description ?? "";
      document.getElementById("detail-niveau").textContent =
        `Niveau ${s.niveau.niveau} · ${r.label} · ×${s.amount}`;
      const zoneTraits = document.getElementById("detail-traits");
      zoneTraits.innerHTML = "";
      for (const id of traitsDe(s.espece)) {
        // Badge cliquable : ouvre le panneau des traits, celui-ci en évidence
        const bouton = document.createElement("button");
        bouton.type = "button";
        bouton.className = "bouton-trait";
        bouton.setAttribute("aria-label", `Trait ${infoTrait(id).nom} : voir les effets`);
        bouton.innerHTML = `${badgeTraitHTML(id, true)} <span>ⓘ</span>`;
        bouton.disabled = !infosTraits;
        bouton.addEventListener("click", () => ouvrirInfosTraits(infosTraits.resonances, infosTraits.compte, id));
        zoneTraits.appendChild(bouton);
      }

      const zoneCompetence = document.getElementById("detail-competence");
      zoneCompetence.hidden = !s.competence;
      if (s.competence) {
        zoneCompetence.style.setProperty("--couleur", r.couleur);
        zoneCompetence.innerHTML = "";
        const titre = document.createElement("strong");
        titre.textContent = `${s.competence.icone} ${s.competence.nom}`;
        const texte = document.createElement("p");
        texte.textContent = descriptionCompetence(s.competence);
        zoneCompetence.append(titre, texte);
      }

      const lignes = STATS_FICHE.map(({ cle, libelle, suffixe }) => {
        const base = s.espece.base[cle] ?? 0;
        const croissance = s.espece.croissance[cle] ?? 0;
        const actuelle = s.stats[cle] ?? 0;
        return `
          <tr>
            <td>${libelle}</td>
            <td>${actuelle}${suffixe}</td>
            <td>${base}${suffixe}</td>
            <td class="croissance">+${croissance}${suffixe}</td>
          </tr>`;
      }).join("");
      document.getElementById("detail-stats").innerHTML = lignes;
      afficherEveil(s);

      document.getElementById("detail").classList.add("ouverte");
    }

    // Section Éveil de la fiche (légendaires et mythiques) : étoiles, bonus, détail des 6 niveaux, bouton Éveiller.
    function afficherEveil(s, message = "") {
      const zone = document.getElementById("detail-eveil");
      zone.hidden = !s.eveil;
      if (!s.eveil) return;
      const { niveau, max, cout, paliers } = s.eveil;
      const actuel = paliers[niveau - 1];
      zone.innerHTML = `
        <div class="eveil-entete">
          <strong>Éveil</strong>
          ${etoilesEveilHTML(niveau, max)}
          <span>${actuel.bonusPct > 0 ? `+${actuel.bonusPct} % PV, ATK, DEF` : "Pas encore éveillé"}</span>
        </div>
        <ol class="eveil-niveaux"></ol>
        <div class="eveil-pied">
          <span class="stock">✨ ${essence.toLocaleString("fr-FR")} essence</span>
          <button type="button"></button>
        </div>
        <p class="eveil-message"></p>`;
      // Un niveau par ligne : bonus de stats, et ce qu'il change à la compétence
      const liste = zone.querySelector(".eveil-niveaux");
      let competence = paliers[0].competence;
      for (const p of paliers.slice(1)) {
        const morceaux = [`+${p.bonusPct} % PV, ATK, DEF`];
        if (p.competence) {
          morceaux.push(`${p.competence.icone} ${p.competence.nom} : ${texteAmeliorationCompetence(competence, p.competence)}`);
          competence = p.competence;
        }
        const li = document.createElement("li");
        li.className = (p.niveau <= niveau ? "atteint" : "") + (p.niveau === niveau ? " actuel" : "");
        li.innerHTML = `<span class="num"></span><span></span>`;
        li.querySelector(".num").textContent = `Éveil ${p.niveau}`;
        li.lastChild.textContent = morceaux.join(" · ");
        liste.appendChild(li);
      }
      const bouton = zone.querySelector("button");
      if (cout === null) {
        bouton.textContent = "Éveil maximal";
        bouton.disabled = true;
      } else {
        bouton.textContent = `Éveiller · ${cout} ✨`;
        bouton.disabled = essence < cout;
        bouton.addEventListener("click", () => eveiller(s, bouton));
      }
      zone.querySelector(".eveil-message").textContent = message;
    }

    async function eveiller(s, bouton) {
      bouton.disabled = true;
      try {
        const { ok, data } = await api("/eveil/eveiller", { corps: { espece: s.id } });
        if (!ok) {
          afficherEveil(s, data.erreur);
          return;
        }
        // Le serveur renvoie le Monkeydex à jour : carte, fiche, stats et compétence se redessinent
        singes = data.singes;
        essence = data.essence;
        afficher();
        const maj = singes.find((x) => x.id === s.id);
        ouvrirFiche(maj);
        afficherEveil(maj, `${maj.espece.nom} passe à l'éveil ${maj.eveil.niveau} !`);
      } catch {
        afficherEveil(s, "Erreur réseau, réessaie.");
      }
    }

    function fermerFiche() {
      document.getElementById("detail").classList.remove("ouverte");
    }

    grille.addEventListener("click", (e) => {
      const carte = e.target.closest(".carte");
      if (!carte) return;
      ouvrirFiche(singes[Number(carte.dataset.index)]);
    });

    document.getElementById("fermer").addEventListener("click", fermerFiche);
    document.getElementById("detail").addEventListener("click", (e) => {
      if (e.target.id === "detail") fermerFiche();
    });
    document.addEventListener("keydown", (e) => {
      if (document.getElementById("infos-traits")?.open) return; // Échap ferme d'abord le panneau
      if (e.key === "Escape") fermerFiche();
    });

    // ---------- Navigation et chargement ----------

    document.getElementById("precedent").addEventListener("click", () => {
      if (page > 0) { page--; afficher(); }
    });
    document.getElementById("suivant").addEventListener("click", () => { page++; afficher(); });

    (async () => {
      const [moi, { ok, data }, resEquipe] = await Promise.all([
        exigerConnexion(),
        api("/monkeydex"),
        api("/equipe"),
      ]);
      if (!moi) return;
      if (!ok) {
        document.getElementById("total").textContent = "Erreur de chargement : " + data.erreur;
        return;
      }

      singes = data.singes;
      essence = data.essence ?? 0;
      if (resEquipe.ok) {
        const compte = compterTraitsEspeces(resEquipe.data.equipe.map(({ espece }) => singes.find((s) => s.id === espece)?.espece));
        infosTraits = { resonances: resEquipe.data.resonances, compte };
      }
      document.getElementById("total").textContent = `Nombre total de singes : ${data.total}`;

      const zoneCompteur = document.getElementById("compteur");
      zoneCompteur.innerHTML = "";
      for (const c of data.compteur) {
        const r = infoRarete(c.nom);
        const pastille = document.createElement("span");
        pastille.style.borderColor = r.couleur;
        pastille.style.color = r.couleur;
        pastille.innerHTML = `<img src="${r.icone}" alt=""> ${c.total}`;
        zoneCompteur.appendChild(pastille);
      }
      afficher();
    })();
  </script>
</body>
</html>
