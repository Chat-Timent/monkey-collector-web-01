<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Combat</title>
  <link rel="stylesheet" href="/css/commun.css">
  <link rel="stylesheet" href="/css/arbre.css">
  <link rel="stylesheet" href="/css/barre.css">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #161616;
      color: var(--texte);
      margin: 0;
      min-height: 100vh;
    }
    .modes {
      max-width: 760px;
      margin: 32px auto;
      padding: 0 16px 40px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .mode {
      position: relative;
      min-height: 160px;
      border-radius: 16px;
      border: 1px solid #333;
      background: #242424;
      color: var(--texte);
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.15s, border-color 0.15s;
    }
    a.mode:hover { border-color: var(--accent); transform: translateY(-2px); }
    .mode .icone { font-size: 44px; line-height: 1; }
    .mode .titre { font-size: 20px; font-weight: bold; }
    .mode.bientot { opacity: 0.45; cursor: default; }
    .mode .etiquette:empty { display: none; }
    .mode .etiquette {
      font-size: 12px;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 999px;
      background: #333;
      color: var(--texte-doux);
    }
    .badge {
      position: absolute;
      top: 12px;
      right: 12px;
      min-width: 24px;
      height: 24px;
      padding: 0 7px;
      border-radius: 999px;
      background: var(--accent-2);
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .badge.visible { display: inline-flex; }
    @media (max-width: 480px) {
      .modes { gap: 10px; margin-top: 20px; }
      .mode { min-height: 130px; }
      .mode .icone { font-size: 36px; }
      .mode .titre { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main class="modes">
    <a class="mode" href="/pvp.html">
      <span class="badge" id="badge-pvp" title="Défis reçus"></span>
      <span class="icone">⚔️</span>
      <span class="titre">PVP</span>
    </a>
    <a class="mode" href="/aventure.html">
      <span class="icone">🗺️</span>
      <span class="titre">Aventure</span>
      <span class="etiquette" id="etage-aventure"></span>
    </a>
    <a class="mode" href="/ressources.html">
      <span class="icone">💎</span>
      <span class="titre">Ressources</span>
      <span class="etiquette" id="tickets-ressources"></span>
    </a>
    <div class="mode bientot">
      <span class="icone">🎉</span>
      <span class="titre">Événements</span>
      <span class="etiquette">Bientôt</span>
    </div>
  </main>

  <script src="/js/commun.js"></script>
  <script src="/js/arbre.js"></script>
  <script src="/js/barre.js"></script>
  <script src="/js/session.js"></script>
  <script>
    // Pastille sur la carte PVP : nombre de défis reçus en attente
    async function majDefis() {
      try {
        const { ok, data } = await api("/defis");
        if (!ok) return;
        const badge = document.getElementById("badge-pvp");
        badge.textContent = data.recus.length;
        badge.classList.toggle("visible", data.recus.length > 0);
      } catch {
        // Réseau indisponible : on réessaiera au prochain tour
      }
    }

    async function majAventure() {
      try {
        const { ok, data } = await api("/aventure");
        if (ok) document.getElementById("etage-aventure").textContent = `Étage ${data.etage}`;
      } catch {
        // Réseau indisponible : la carte reste sans étage
      }
    }

    async function majRessources() {
      try {
        const { ok, data } = await api("/ressources");
        if (!ok) return;
        const tickets = data.donjons.reduce((t, d) => t + d.tickets, 0);
        document.getElementById("tickets-ressources").textContent = `🎫 ${tickets}`;
      } catch {
        // Réseau indisponible : la carte reste sans compteur
      }
    }

    exigerConnexion().then((moi) => {
      if (!moi) return;
      majAventure();
      majRessources();
      majDefis();
      setInterval(majDefis, 5000);
    });
  </script>
</body>
</html>
