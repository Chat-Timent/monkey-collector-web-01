<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gacha Monkey</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #1e1b2e;
      color: #f2f2f2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    form { display: flex; flex-direction: column; gap: 12px; width: 280px; }
    input {
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #2a2640;
      color: #fff;
      font-size: 16px;
    }
    button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #ff8a3d, #e5447a);
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Gacha Monkey</h1>
  <form id="formulaire">
    <input id="pseudo" placeholder="Choisis ton pseudo" required>
    <button type="submit">Entrer</button>
  </form>

  <script>
    if (localStorage.getItem("pseudo")) {
      window.location.replace("/tirage.html");
    }

    document.getElementById("formulaire").addEventListener("submit", (e) => {
      e.preventDefault();
      const pseudo = document.getElementById("pseudo").value.trim();
      if (!pseudo) return;
      localStorage.setItem("pseudo", pseudo);
      window.location.replace("/tirage.html");
    });
  </script>
</body>
</html>
