<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Combat en direct</title>
  <link rel="stylesheet" href="/css/commun.css">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #161616;
      color: #f2f2f2;
      margin: 0;
      padding: 30px 20px;
      min-height: 100vh;
      box-sizing: border-box;
    }
    header {
      max-width: 1000px;
      margin: 0 auto 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { margin: 0; font-size: 22px; }
    .lien {
      color: #f2f2f2;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      background: #242424;
      border: 1px solid #333;
    }
    #banniere {
      max-width: 1000px;
      margin: 0 auto 16px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: #ffb86b;
      min-height: 28px;
    }
    .camp { max-width: 1000px; margin: 0 auto 20px; }
    .camp h2 { font-size: 15px; color: #bbb; margin: 0 0 8px; }
    .grille { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

    .carte {
      position: relative;
      background: #242424;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      transition: transform 0.2s, opacity 0.4s, filter 0.4s;
    }
    .carte.moi { border-color: #2e6b3a; }
    .carte.adv { border-color: #6b2e2e; }
    .carte.vide {
      color: #555;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      border-style: dashed;
    }
    .carte img { width: 70px; height: 70px; object-fit: contain; }
    .carte .nom { display: block; font-size: 13px; font-weight: bold; margin: 4px 0; }
    .barre { height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
    .barre div { height: 100%; background: #4caf50; transition: width 0.6s; }
    .carte .pv { font-size: 11px; color: #bbb; margin-top: 3px; }

    .carte.attaque {
      transform: scale(1.06);
      border-color: #ffb86b;
      box-shadow: 0 0 14px rgba(255, 184, 107, 0.5);
    }
    .carte.touche { animation: secousse 0.4s; }
    .carte.mort { filter: grayscale(1); opacity: 0.4; }

    .bulle {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      font-weight: bold;
      font-size: 16px;
      white-space: nowrap;
      pointer-events: none;
      animation: monte 1s forwards;
    }
    .bulle.degats { color: #ff6b6b; }
    .bulle.rate { color: #bbb; }
    .bulle.ko { color: #ff3b3b; font-size: 20px; }
    .bulle.soin { color: #7fdc9a; }
    .carte .perk { position: absolute; top: 6px; left: 8px; font-size: 16px; }

    @keyframes secousse {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    @keyframes monte {
      from { opacity: 1; top: -10px; }
      to { opacity: 0; top: -45px; }
    }

    #resultat {
      max-width: 1000px;
      margin: 16px auto;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      min-height: 30px;
    }
    .deux-colonnes {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 16px;
    }
    @media (max-width: 800px) {
      .deux-colonnes { grid-template-columns: 1fr; }
    }
    .deux-colonnes.sans-chat { grid-template-columns: 1fr; }
    .sans-chat .chat { display: none; }
    #action {
      display: none;
      width: max-content;
      margin: 0 auto 20px;
      padding: 14px 28px;
      border-radius: 10px;
      background: linear-gradient(135deg, #ff8a3d, #e5447a);
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
    }
    #action.visible { display: block; }
    #journal {
      background: #1e1e1e;
      border-radius: 10px;
      padding: 12px;
      height: 340px;
      overflow-y: auto;
      font-size: 13px;
      color: #ccc;
    }
    #journal div { padding: 2px 0; }
    #journal .tour { color: #ffb86b; font-weight: bold; margin-top: 6px; }

    .chat {
      background: #1e1e1e;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      height: 340px;
    }
    .chat h2 { font-size: 14px; color: #bbb; margin: 0 0 8px; }
    #messages {
      flex: 1;
      overflow-y: auto;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Combat en direct</h1>
    <a class="lien" href="/pvp.html">Retour</a>
  </header>

  <div id="banniere">Chargement…</div>

  <div class="camp">
    <h2 id="titre-moi"></h2>
    <div id="grille-moi" class="grille"></div>
  </div>

  <div class="camp">
    <h2 id="titre-adv"></h2>
    <div id="grille-adv" class="grille"></div>
  </div>

  <div id="resultat"></div>
  <a id="action" href="/aventure.html"></a>

  <div class="deux-colonnes" id="colonnes">
    <div id="journal"></div>

    <div class="chat">
      <h2>Chat du combat</h2>
      <div id="messages"></div>
      <form id="formChat">
        <input id="texteChat" maxlength="200" placeholder="Insulte ton adversaire avec amour…" autocomplete="off">
        <button id="envoyerChat" type="submit">Envoyer</button>
      </form>
      <div id="statutChat"></div>
    </div>
  </div>

  <script src="/js/commun.js"></script>
  <script>
    const INTERVALLE_CHAT_MS = 2000;

    const idCombat = new URLSearchParams(location.search).get("id");
    const $ = (id) => document.getElementById(id);

    // Rythme du replay, fourni par le serveur avec le combat
    let pasMs = 0;

    let resultat = null;
    let eloDelta = null;
    let mode = "pvp";
    let contexte = null;
    let monCamp = null;
    let etat = { A: [], B: [] };
    let journal = [];
    let index = 0;
    let actif = null;
    let fx = null;
    let timer = null;

    let dernierIdMessage = 0;
    let chatLive = false;
    let chatTimer = null;

    const adverse = () => (monCamp === "A" ? "B" : "A");

    // ---------- Combat ----------

    function carteHTML(camp, i, m) {
      if (!m) return `<div class="carte vide">Slot ${i + 1}</div>`;

      const estActif = actif && actif.camp === camp && actif.slot === i;
      const estCible = fx && fx.camp === camp && fx.slot === i;

      const classes = ["carte", camp === monCamp ? "moi" : "adv"];
      if (m.dead) classes.push("mort");
      if (estActif) classes.push("attaque");
      if (estCible && fx.type === "degats") classes.push("touche");

      const bulle = estCible ? `<div class="bulle ${fx.type}">${fx.texte}</div>` : "";
      const pct = Math.max(0, Math.round((m.pv / m.max) * 100));
      const bordure = RARETES_AFFICHAGE[m.rarete]
        ? `style="box-shadow: inset 0 3px 0 ${RARETES_AFFICHAGE[m.rarete].couleur}"` : "";

      return `
        <div class="${classes.join(" ")}" ${bordure}>
          ${bulle}
          ${m.perk ? `<span class="perk" title="${m.perk.nom}">${m.perk.icone}</span>` : ""}
          <img src="${m.image}" alt="">
          <span class="nom">${m.nom}</span>
          <div class="barre"><div style="width:${pct}%"></div></div>
          <div class="pv">${Math.max(0, m.pv)} / ${m.max} PV</div>
        </div>`;
    }

    function dessiner() {
      $("grille-moi").innerHTML = etat[monCamp].map((m, i) => carteHTML(monCamp, i, m)).join("");
      $("grille-adv").innerHTML = etat[adverse()].map((m, i) => carteHTML(adverse(), i, m)).join("");
    }

    function ajouterLog(e) {
      let txt = "";
      let classe = "";
      if (e.type === "tour") { txt = `Tour ${e.numero}`; classe = "tour"; }
      else if (e.type === "degats") txt = `${e.de} → ${e.sur} : ${e.degats} dégâts${e.critique ? " (critique)" : ""} · PV restants ${e.pvRestants}`;
      else if (e.type === "rate") txt = `${e.de} rate ${e.sur}`;
      else if (e.type === "KO") txt = `${e.nom} est K.O.`;
      else if (e.type === "soin") txt = `🌸 ${e.de} soigne ${e.sur} : +${e.soin} PV · PV ${e.pvRestants}`;
      if (!txt) return;

      const d = document.createElement("div");
      d.textContent = txt;
      if (classe) d.className = classe;
      $("journal").appendChild(d);
      $("journal").scrollTop = $("journal").scrollHeight;
    }

    function appliquer(e) {
      if (e.type === "tour") {
        $("banniere").textContent = `Tour ${e.numero}`;
      } else if (e.type === "degats") {
        actif = { camp: e.deCamp, slot: e.deSlot };
        etat[e.surCamp][e.surSlot].pv = e.pvRestants;
        fx = { camp: e.surCamp, slot: e.surSlot, type: "degats", texte: `-${e.degats}${e.critique ? " CRIT" : ""}` };
      } else if (e.type === "rate") {
        actif = { camp: e.deCamp, slot: e.deSlot };
        fx = { camp: e.surCamp, slot: e.surSlot, type: "rate", texte: "Raté" };
      } else if (e.type === "KO") {
        etat[e.camp][e.slot].dead = true;
        fx = { camp: e.camp, slot: e.slot, type: "ko", texte: "K.O." };
      } else if (e.type === "soin") {
        actif = { camp: e.deCamp, slot: e.deSlot };
        etat[e.surCamp][e.surSlot].pv = e.pvRestants;
        fx = { camp: e.surCamp, slot: e.surSlot, type: "soin", texte: `+${e.soin}` };
      }
      ajouterLog(e);
    }

    function appliquerSansAnimation(e) {
      if (e.type !== "KO") { actif = null; fx = null; }
      appliquer(e);
    }

    function terminer(redirigerEnDirect) {
      clearTimeout(timer);
      actif = null;
      fx = null;
      dessiner();
      $("banniere").textContent = "Combat terminé";
      const v = resultat.vainqueur;
      $("resultat").textContent = v === null ? "Match nul" : v === monCamp ? "Victoire !" : "Défaite";
      if (eloDelta !== null && eloDelta !== undefined) {
        $("resultat").textContent += eloDelta > 0 ? ` +${eloDelta} elo` : eloDelta < 0 ? ` −${-eloDelta} elo` : " ±0 elo";
      }

      if (mode === "aventure") {
        terminerAventure(v === monCamp);
        return;
      }
      if (mode === "ressource") {
        terminerDonjon(v === monCamp);
        return;
      }

      if (redirigerEnDirect) {
        $("resultat").textContent += " · retour à l'historique…";
        setTimeout(() => location.replace("/pvp.html"), 3000);
      }
    }

    // Donjon de ressources : quantité gagnée, puis retour aux donjons
    function terminerDonjon(victoire) {
      const g = contexte?.gains;
      if (victoire && g) {
        const unite = { tirages: g.quantite > 1 ? "tirages" : "tirage", coins: "coins", xp: "XP" }[g.donjon];
        $("resultat").textContent += ` +${g.quantite} ${unite}`;
        if (g.niveauxGagnes > 0) $("resultat").textContent += " · Niveau supérieur !";
      }
      $("action").textContent = "Retour aux donjons";
      $("action").href = "/ressources.html";
      $("action").classList.add("visible");
    }

    // Aventure : récompenses gagnées, puis « Étage suivant » ou « Réessayer »
    function terminerAventure(victoire) {
      const g = contexte?.gains;
      if (victoire && g) {
        const morceaux = [`+${g.xp} XP`, `+${g.coins} coins`];
        if (g.tirages > 0) morceaux.push(`+${g.tirages} tirage${g.tirages > 1 ? "s" : ""}`);
        if (g.singe) {
          const nom = resultat.equipeB.find((s) => s && s.id === g.singe)?.nom ?? g.singe;
          morceaux.push(`🐒 ${nom}`);
        }
        if (g.niveauxGagnes > 0) morceaux.push("Niveau supérieur !");
        $("resultat").textContent += " " + morceaux.join(" · ");
      }
      $("action").textContent = victoire ? "Étage suivant" : "Réessayer";
      $("action").classList.add("visible");
    }

    function pas() {
      if (index >= journal.length) return terminer(true);

      const e = journal[index++];
      if (e.type !== "KO") { actif = null; fx = null; }
      appliquer(e);
      dessiner();
      timer = setTimeout(pas, pasMs);
    }

    // ---------- Chat ----------

    function majStatutChat() {
      const input = $("texteChat");
      const bouton = $("envoyerChat");
      input.disabled = !chatLive;
      bouton.disabled = !chatLive;
      $("statutChat").textContent = chatLive ? "" : "Le combat est terminé, le chat est fermé.";
    }

    async function rafraichirChat() {
      const { ok, data } = await api(`/combats/${idCombat}/messages?apres=${dernierIdMessage}`);
      if (!ok) return;

      // Deux rafraîchissements peuvent se croiser (envoi + intervalle) : on ignore les doublons
      for (const m of data.messages) {
        if ($("messages").querySelector(`[data-id="${m.id}"]`)) continue;
        ajouterBulleChat($("messages"), m);
        dernierIdMessage = Math.max(dernierIdMessage, Number(m.id));
      }
      if (chatLive !== data.live) {
        chatLive = data.live;
        majStatutChat();
      }
    }

    $("formChat").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = $("texteChat");
      const texte = input.value.trim();
      if (!texte) return;

      const { ok, data } = await api(`/combats/${idCombat}/messages`, { corps: { texte } });
      if (!ok) {
        $("statutChat").textContent = data.erreur;
        if (data.erreur === "le combat est terminé") {
          chatLive = false;
          majStatutChat();
        }
        return;
      }
      input.value = "";
      $("statutChat").textContent = "";
      rafraichirChat();
    });

    // ---------- Chargement ----------

    async function charger() {
      if (!await exigerConnexion()) return;
      if (!idCombat) { $("banniere").textContent = "Aucun combat sélectionné."; return; }

      const { ok, data } = await api(`/combats/${idCombat}`);
      if (!ok) { $("banniere").textContent = "Combat introuvable."; return; }

      pasMs = data.pasMs;
      resultat = data.resultat;
      eloDelta = data.eloDelta;
      mode = data.mode ?? "pvp";
      contexte = data.contexte;
      monCamp = data.monCamp;
      const pseudoMoi = monCamp === "A" ? data.pseudoA : data.pseudoB;
      const pseudoAdv = monCamp === "A" ? data.pseudoB : data.pseudoA;
      $("titre-moi").textContent = `${pseudoMoi} (toi)`;
      $("titre-adv").textContent = pseudoAdv;

      for (const camp of ["A", "B"]) {
        etat[camp] = resultat[`equipe${camp}`].map((m) =>
          m ? { ...m, pv: m.hp, max: m.hp, dead: false } : null
        );
      }
      journal = resultat.journal;

      const ecoule = Math.max(0, data.ecouleMs - data.delaiInitialMs);
      const cible = Math.min(journal.length, Math.floor(ecoule / pasMs));
      for (index = 0; index < cible; index++) appliquerSansAnimation(journal[index]);

      dessiner();

      if (mode !== "pvp") {
        // Combat PVE (Aventure ou donjon) : pas de chat, retour vers la page du mode
        $("colonnes").classList.add("sans-chat");
        document.querySelector("header a.lien").href = mode === "ressource" ? "/ressources.html" : "/aventure.html";
      } else {
        // Chat : on charge tout l'historique du combat, puis on interroge régulièrement
        await rafraichirChat();
        chatTimer = setInterval(rafraichirChat, INTERVALLE_CHAT_MS);
        majStatutChat();
      }

      if (index >= journal.length) {
        terminer(false);
      } else {
        $("banniere").textContent = "En direct";
        timer = setTimeout(pas, pasMs);
      }
    }

    charger();
  </script>
</body>
</html>
