<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Combat en direct</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #161616;
      color: #f2f2f2;
      margin: 0;
      padding: 30px 20px;
      min-height: 100vh;
      box-sizing: border-box;
    }
    header {
      max-width: 1000px;
      margin: 0 auto 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { margin: 0; font-size: 22px; }
    .lien {
      color: #f2f2f2;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      background: #242424;
      border: 1px solid #333;
    }
    #banniere {
      max-width: 1000px;
      margin: 0 auto 16px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: #ffb86b;
      min-height: 28px;
    }
    .camp { max-width: 1000px; margin: 0 auto 20px; }
    .camp h2 { font-size: 15px; color: #bbb; margin: 0 0 8px; }
    .grille { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

    .carte {
      position: relative;
      background: #242424;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      transition: transform 0.2s, opacity 0.4s, filter 0.4s;
    }
    .carte.moi { border-color: #2e6b3a; }
    .carte.adv { border-color: #6b2e2e; }
    .carte.vide {
      color: #555;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      border-style: dashed;
    }
    .carte img { width: 70px; height: 70px; object-fit: contain; }
    .carte .nom { display: block; font-size: 13px; font-weight: bold; margin: 4px 0; }
    .barre { height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
    .barre div { height: 100%; background: #4caf50; transition: width 0.6s; }
    .carte .pv { font-size: 11px; color: #bbb; margin-top: 3px; }

    .carte.attaque {
      transform: scale(1.06);
      border-color: #ffb86b;
      box-shadow: 0 0 14px rgba(255, 184, 107, 0.5);
    }
    .carte.touche { animation: secousse 0.4s; }
    .carte.mort { filter: grayscale(1); opacity: 0.4; }

    .bulle {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      font-weight: bold;
      font-size: 16px;
      white-space: nowrap;
      pointer-events: none;
      animation: monte 1s forwards;
    }
    .bulle.degats { color: #ff6b6b; }
    .bulle.rate { color: #bbb; }
    .bulle.ko { color: #ff3b3b; font-size: 20px; }

    @keyframes secousse {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    @keyframes monte {
      from { opacity: 1; top: -10px; }
      to { opacity: 0; top: -45px; }
    }

    #resultat {
      max-width: 1000px;
      margin: 16px auto;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      min-height: 30px;
    }
    .deux-colonnes {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 16px;
    }
    @media (max-width: 800px) {
      .deux-colonnes { grid-template-columns: 1fr; }
    }
    #journal {
      background: #1e1e1e;
      border-radius: 10px;
      padding: 12px;
      height: 340px;
      overflow-y: auto;
      font-size: 13px;
      color: #ccc;
    }
    #journal div { padding: 2px 0; }
    #journal .tour { color: #ffb86b; font-weight: bold; margin-top: 6px; }

    .chat {
      background: #1e1e1e;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      height: 340px;
    }
    .chat h2 { font-size: 14px; color: #bbb; margin: 0 0 8px; }
    #messages {
      flex: 1;
      overflow-y: auto;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
    }
    .msg { background: #262626; border-radius: 8px; padding: 6px 8px; word-wrap: break-word; }
    .msg.moi { background: #2a3b2f; }
    .msg .auteur { font-weight: bold; font-size: 12px; color: #ffb86b; }
    .msg.moi .auteur { color: #7fdc9a; }
    .msg .heure { font-size: 10px; color: #777; margin-left: 6px; }
    .msg .texte { margin-top: 2px; }
    #formChat { display: flex; gap: 6px; margin-top: 8px; }
    #texteChat {
      flex: 1;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #161616;
      color: #f2f2f2;
      font-size: 13px;
    }
    #formChat button {
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #ff8a3d, #e5447a);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    #formChat button:disabled { background: #333; color: #888; cursor: default; }
    #statutChat { font-size: 12px; color: #ffb86b; min-height: 16px; margin-top: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>Combat en direct</h1>
    <a class="lien" href="/combat.html">Retour</a>
  </header>

  <div id="banniere">Chargement…</div>

  <div class="camp">
    <h2 id="titre-moi"></h2>
    <div id="grille-moi" class="grille"></div>
  </div>

  <div class="camp">
    <h2 id="titre-adv"></h2>
    <div id="grille-adv" class="grille"></div>
  </div>

  <div id="resultat"></div>

  <div class="deux-colonnes">
    <div id="journal"></div>

    <div class="chat">
      <h2>Chat du combat</h2>
      <div id="messages"></div>
      <form id="formChat">
        <input id="texteChat" maxlength="200" placeholder="Insulte ton adversaire avec amour…" autocomplete="off">
        <button id="envoyerChat" type="submit">Envoyer</button>
      </form>
      <div id="statutChat"></div>
    </div>
  </div>

  <script>
    // Doit rester identique à tirage.js
    const DELAI_INITIAL_MS = 1000;
    const PAS_MS = 700;
    const INTERVALLE_CHAT_MS = 2000;

    const idCombat = new URLSearchParams(location.search).get("id");
    const $ = (id) => document.getElementById(id);

    const RARETES_COULEUR = {
      common: "#060ee4", uncommon: "#1af3c3", rare: "#1cc22a",
      epic: "#a831eb", legendary: "#fe9308",
    };

    let resultat = null;
    let monCamp = null;
    let etat = { A: [], B: [] };
    let journal = [];
    let index = 0;
    let actif = null;
    let fx = null;
    let timer = null;

    let dernierIdMessage = 0;
    let chatLive = false;
    let chatTimer = null;

    const adverse = () => (monCamp === "A" ? "B" : "A");

    // ---------- Combat ----------

    function carteHTML(camp, i, m) {
      if (!m) return `<div class="carte vide">Slot ${i + 1}</div>`;

      const estActif = actif && actif.camp === camp && actif.slot === i;
      const estCible = fx && fx.camp === camp && fx.slot === i;

      const classes = ["carte", camp === monCamp ? "moi" : "adv"];
      if (m.dead) classes.push("mort");
      if (estActif) classes.push("attaque");
      if (estCible && fx.type === "degats") classes.push("touche");

      const bulle = estCible ? `<div class="bulle ${fx.type}">${fx.texte}</div>` : "";
      const pct = Math.max(0, Math.round((m.pv / m.max) * 100));
      const bordure = RARETES_COULEUR[m.rarete]
        ? `style="box-shadow: inset 0 3px 0 ${RARETES_COULEUR[m.rarete]}"` : "";

      return `
        <div class="${classes.join(" ")}" ${bordure}>
          ${bulle}
          <img src="${m.image}" alt="">
          <span class="nom">${m.nom}</span>
          <div class="barre"><div style="width:${pct}%"></div></div>
          <div class="pv">${Math.max(0, m.pv)} / ${m.max} PV</div>
        </div>`;
    }

    function dessiner() {
      $("grille-moi").innerHTML = etat[monCamp].map((m, i) => carteHTML(monCamp, i, m)).join("");
      $("grille-adv").innerHTML = etat[adverse()].map((m, i) => carteHTML(adverse(), i, m)).join("");
    }

    function ajouterLog(e) {
      let txt = "";
      let classe = "";
      if (e.type === "tour") { txt = `Tour ${e.numero}`; classe = "tour"; }
      else if (e.type === "degats") txt = `${e.de} → ${e.sur} : ${e.degats} dégâts${e.critique ? " (critique)" : ""} · PV restants ${e.pvRestants}`;
      else if (e.type === "rate") txt = `${e.de} rate ${e.sur}`;
      else if (e.type === "KO") txt = `${e.nom} est K.O.`;
      if (!txt) return;

      const d = document.createElement("div");
      d.textContent = txt;
      if (classe) d.className = classe;
      $("journal").appendChild(d);
      $("journal").scrollTop = $("journal").scrollHeight;
    }

    function appliquer(e) {
      if (e.type === "tour") {
        $("banniere").textContent = `Tour ${e.numero}`;
      } else if (e.type === "degats") {
        actif = { camp: e.deCamp, slot: e.deSlot };
        etat[e.surCamp][e.surSlot].pv = e.pvRestants;
        fx = { camp: e.surCamp, slot: e.surSlot, type: "degats", texte: `-${e.degats}${e.critique ? " CRIT" : ""}` };
      } else if (e.type === "rate") {
        actif = { camp: e.deCamp, slot: e.deSlot };
        fx = { camp: e.surCamp, slot: e.surSlot, type: "rate", texte: "Raté" };
      } else if (e.type === "KO") {
        etat[e.camp][e.slot].dead = true;
        fx = { camp: e.camp, slot: e.slot, type: "ko", texte: "K.O." };
      }
      ajouterLog(e);
    }

    function appliquerSansAnimation(e) {
      if (e.type !== "KO") { actif = null; fx = null; }
      appliquer(e);
    }

    function terminer(redirigerEnDirect) {
      clearTimeout(timer);
      actif = null;
      fx = null;
      dessiner();
      $("banniere").textContent = "Combat terminé";
      const v = resultat.vainqueur;
      $("resultat").textContent = v === null ? "Match nul" : v === monCamp ? "Victoire !" : "Défaite";

      if (redirigerEnDirect) {
        $("resultat").textContent += " · retour à l'historique…";
        setTimeout(() => location.replace("/combat.html"), 3000);
      }
    }

    function pas() {
      if (index >= journal.length) return terminer(true);

      const e = journal[index++];
      if (e.type !== "KO") { actif = null; fx = null; }
      appliquer(e);
      dessiner();
      timer = setTimeout(pas, PAS_MS);
    }

    // ---------- Chat ----------

    function formaterHeure(iso) {
      return new Date(iso).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    }

    // Construit les éléments avec textContent : le texte saisi n'est jamais interprété en HTML
    function ajouterMessage(m) {
      const zone = $("messages");
      const bulle = document.createElement("div");
      bulle.className = "msg" + (m.moi ? " moi" : "");

      const entete = document.createElement("div");
      const auteur = document.createElement("span");
      auteur.className = "auteur";
      auteur.textContent = m.pseudo;
      const heure = document.createElement("span");
      heure.className = "heure";
      heure.textContent = formaterHeure(m.created_at);
      entete.appendChild(auteur);
      entete.appendChild(heure);

      const texte = document.createElement("div");
      texte.className = "texte";
      texte.textContent = m.texte;

      bulle.appendChild(entete);
      bulle.appendChild(texte);
      zone.appendChild(bulle);
      zone.scrollTop = zone.scrollHeight;
    }

    function majStatutChat() {
      const input = $("texteChat");
      const bouton = $("envoyerChat");
      input.disabled = !chatLive;
      bouton.disabled = !chatLive;
      $("statutChat").textContent = chatLive ? "" : "Le combat est terminé, le chat est fermé.";
    }

    async function rafraichirChat() {
      const r = await fetch(`/combats/${idCombat}/messages?apres=${dernierIdMessage}`);
      if (!r.ok) return;
      const data = await r.json();

      for (const m of data.messages) {
        ajouterMessage(m);
        dernierIdMessage = m.id;
      }
      if (chatLive !== data.live) {
        chatLive = data.live;
        majStatutChat();
      }
    }

    $("formChat").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = $("texteChat");
      const texte = input.value.trim();
      if (!texte) return;

      const r = await fetch(`/combats/${idCombat}/messages`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ texte }),
      });
      const data = await r.json();
      if (!r.ok) {
        $("statutChat").textContent = data.erreur;
        if (data.erreur === "le combat est terminé") {
          chatLive = false;
          majStatutChat();
        }
        return;
      }
      input.value = "";
      $("statutChat").textContent = "";
      rafraichirChat();
    });

    // ---------- Chargement ----------

    async function charger() {
      const moi = await fetch("/moi");
      if (!moi.ok) return location.replace("/");
      if (!idCombat) { $("banniere").textContent = "Aucun combat sélectionné."; return; }

      const r = await fetch(`/combats/${idCombat}`);
      if (!r.ok) { $("banniere").textContent = "Combat introuvable."; return; }
      const data = await r.json();

      resultat = data.resultat;
      monCamp = data.monCamp;
      const pseudoMoi = monCamp === "A" ? data.pseudoA : data.pseudoB;
      const pseudoAdv = monCamp === "A" ? data.pseudoB : data.pseudoA;
      $("titre-moi").textContent = `${pseudoMoi} (toi)`;
      $("titre-adv").textContent = pseudoAdv;

      for (const camp of ["A", "B"]) {
        etat[camp] = resultat[`equipe${camp}`].map((m) =>
          m ? { ...m, pv: m.hp, max: m.hp, dead: false } : null
        );
      }
      journal = resultat.journal;

      const ecoule = Math.max(0, data.ecouleMs - DELAI_INITIAL_MS);
      const cible = Math.min(journal.length, Math.floor(ecoule / PAS_MS));
      for (index = 0; index < cible; index++) appliquerSansAnimation(journal[index]);

      dessiner();

      // Chat : on charge tout l'historique du combat, puis on interroge régulièrement
      await rafraichirChat();
      chatTimer = setInterval(rafraichirChat, INTERVALLE_CHAT_MS);
      majStatutChat();

      if (index >= journal.length) {
        terminer(false);
      } else {
        $("banniere").textContent = "En direct";
        timer = setTimeout(pas, PAS_MS);
      }
    }

    charger();
  </script>
</body>
</html>
