<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Combat en direct</title>
  <link rel="stylesheet" href="/css/commun.css">
  <style>
    /* Vitesse du replay (sélecteur x0.5 à x4) : divise la durée des animations */
    :root { --vitesse: 1; }

    body {
      font-family: system-ui, sans-serif;
      background: #161616;
      color: #f2f2f2;
      margin: 0;
      padding: 30px 20px;
      min-height: 100vh;
      box-sizing: border-box;
    }
    header {
      max-width: 1000px;
      margin: 0 auto 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { margin: 0; font-size: 22px; }
    .lien {
      color: #f2f2f2;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      background: #242424;
      border: 1px solid #333;
    }
    #banniere {
      max-width: 1000px;
      margin: 0 auto 16px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: #ffb86b;
      min-height: 28px;
    }
    .camp { max-width: 1000px; margin: 0 auto 20px; }
    .camp h2 { font-size: 15px; color: #bbb; margin: 0 0 8px; }
    .grille { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

    .carte {
      position: relative;
      background: #242424;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      transition: transform calc(0.2s / var(--vitesse)), opacity calc(0.4s / var(--vitesse)), filter calc(0.4s / var(--vitesse));
    }
    .carte.moi { border-color: #2e6b3a; }
    .carte.adv { border-color: #6b2e2e; }
    .carte.vide {
      color: #555;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      border-style: dashed;
    }
    .carte img { width: 70px; height: 70px; object-fit: contain; }
    .carte .nom { display: block; font-size: 13px; font-weight: bold; margin: 4px 0; }
    .barre { height: 8px; background: #333; border-radius: 4px; overflow: hidden; }
    .barre div { height: 100%; background: #4caf50; transition: width calc(0.6s / var(--vitesse)); }
    .carte .pv { font-size: 11px; color: #bbb; margin-top: 3px; }

    .carte.attaque {
      transform: scale(1.06);
      border-color: #ffb86b;
      box-shadow: 0 0 14px rgba(255, 184, 107, 0.5);
    }
    .carte.touche { animation: secousse calc(0.4s / var(--vitesse)); }
    .carte.mort { filter: grayscale(1); opacity: 0.4; }

    .bulle {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      font-weight: bold;
      font-size: 16px;
      white-space: nowrap;
      pointer-events: none;
      animation: monte calc(1s / var(--vitesse)) forwards;
    }
    .bulle.degats { color: #ff6b6b; }
    .bulle.rate { color: #bbb; }
    .bulle.ko { color: #ff3b3b; font-size: 20px; }
    .bulle.soin { color: #7fdc9a; }
    .carte .perk { position: absolute; top: 6px; left: 8px; font-size: 16px; transition: filter calc(0.4s / var(--vitesse)), opacity calc(0.4s / var(--vitesse)); }
    /* Perk à usage unique déjà consommé (Second souffle) */
    .carte .perk.utilise { filter: grayscale(1); opacity: 0.4; }

    /* Second souffle : le singe se relève, le combat marque une pause le temps de l'animation */
    .carte.releve {
      z-index: 2;
      border-color: #7fd8ff;
      animation: releve calc(1.8s / var(--vitesse)) ease-out;
    }
    .carte.releve img { animation: releve-image calc(1.8s / var(--vitesse)) ease-out; }
    .carte.releve .perk.utilise { animation: perk-consomme calc(1.8s / var(--vitesse)) ease-out; }
    .bulle.souffle {
      color: #7fd8ff;
      font-size: 18px;
      text-shadow: 0 0 8px #2a9fd6;
      animation: monte-fort calc(1.8s / var(--vitesse)) forwards;
    }

    /* Compétence Présage : le lanceur s'illumine, la cible encaisse un coup lourd */
    .carte.presage-lanceur {
      transform: scale(1.1);
      border-color: #E01E1E;
      animation: aura calc(0.7s / var(--vitesse)) ease-in-out;
    }
    .carte.touche-fort { animation: secousse-forte calc(0.6s / var(--vitesse)); border-color: #E01E1E; }
    .bulle.presage {
      color: #FF6B5B;
      font-size: 22px;
      text-shadow: 0 0 8px #E01E1E;
      animation: monte-fort calc(1.2s / var(--vitesse)) forwards;
    }

    /* Compétence Décret royal : le roi s'illumine en or, ses alliés reçoivent le bonus */
    .carte.decret-lanceur {
      transform: scale(1.1);
      border-color: #f2c94c;
      box-shadow: 0 0 18px #f2c94c;
    }
    .bulle.decret { color: #f2c94c; text-shadow: 0 0 6px #b8860b; }

    /* Compétence Arc-en-ciel protecteur : un arc-en-ciel balaie la rotation, puis une aura reste sur chaque bouclier */
    .carte.arc-lanceur { transform: scale(1.08); border-color: #9be7ff; }
    .carte.arc::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(100deg, transparent 20%, #ff5e5e, #ffb35e, #fff35e, #6bff8a, #5ec8ff, #b06bff, transparent 80%);
      background-size: 300% 100%;
      opacity: 0;
      animation: arc-balaye calc(0.9s / var(--vitesse)) ease-out forwards;
      animation-delay: calc(var(--delai, 0s) / var(--vitesse));
    }
    /* Aura du bouclier : cadre aux couleurs changeantes (pseudo-élément, pour ne pas toucher au liseré de rareté ni aux animations de la carte) */
    .carte.protege::before {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 15px;
      border: 2px solid #9be7ff;
      pointer-events: none;
      animation: aura-arc 3s linear infinite;
      /* Les cartes sont redessinées à chaque pas : la phase suit l'horloge pour que les couleurs défilent sans à-coup */
      animation-delay: var(--phase, 0s);
    }
    @keyframes aura-arc {
      0% { border-color: #ff8a8a; box-shadow: 0 0 10px rgba(255, 138, 138, 0.5); }
      25% { border-color: #fff38a; box-shadow: 0 0 10px rgba(255, 243, 138, 0.5); }
      50% { border-color: #8affa6; box-shadow: 0 0 10px rgba(138, 255, 166, 0.5); }
      75% { border-color: #8ad4ff; box-shadow: 0 0 10px rgba(138, 212, 255, 0.5); }
      100% { border-color: #ff8a8a; box-shadow: 0 0 10px rgba(255, 138, 138, 0.5); }
    }
    .barre-bouclier { height: 4px; margin-top: 2px; border-radius: 2px; overflow: hidden; background: transparent; }
    .barre-bouclier div {
      height: 100%;
      background: linear-gradient(90deg, #ff5e5e, #ffb35e, #fff35e, #6bff8a, #5ec8ff, #b06bff);
      transition: width calc(0.6s / var(--vitesse));
    }
    .bulle.bouclier { color: #9be7ff; text-shadow: 0 0 6px #5e8cff; }
    @keyframes arc-balaye {
      0% { opacity: 0; background-position: 100% 0; }
      30% { opacity: 0.75; }
      100% { opacity: 0; background-position: 0 0; }
    }

    /* Traits : seconde frappe de Chaos, Malédiction, Sacrifice ; le soin de Dévouement est une seconde bulle */
    .bulle.chaos { color: #ff8a5c; }
    .carte.maudit { animation: secousse calc(0.4s / var(--vitesse)); border-color: #a487e0; }
    .bulle.malediction { color: #c3a6ff; text-shadow: 0 0 6px #6b4fb3; }
    .bulle.sacrifice { color: #ff7aa6; text-shadow: 0 0 6px #b3245a; }
    .bulle.second { top: 14px; }

    @keyframes secousse {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    @keyframes releve {
      0% { filter: grayscale(1) brightness(0.6); transform: scale(0.94); box-shadow: 0 0 0 rgba(127, 216, 255, 0); }
      30% { filter: grayscale(0) brightness(1.6); transform: scale(1.1); box-shadow: 0 0 36px 10px rgba(127, 216, 255, 0.9); }
      60% { filter: none; transform: scale(1.04); box-shadow: 0 0 22px 4px rgba(127, 216, 255, 0.6); }
      100% { filter: none; transform: scale(1); box-shadow: 0 0 0 rgba(127, 216, 255, 0); }
    }
    @keyframes releve-image {
      0% { transform: translateY(14px) rotate(-12deg); opacity: 0.5; }
      35% { transform: translateY(-10px) rotate(4deg); opacity: 1; }
      100% { transform: translateY(0) rotate(0); }
    }
    /* L'icône du perk brille pendant la relève, puis s'éteint (grisée) */
    @keyframes perk-consomme {
      0%, 45% { filter: none; opacity: 1; transform: scale(1.6); }
      100% { filter: grayscale(1); opacity: 0.4; transform: scale(1); }
    }
    @keyframes monte {
      from { opacity: 1; top: -10px; }
      to { opacity: 0; top: -45px; }
    }
    @keyframes aura {
      0%, 100% { box-shadow: 0 0 14px rgba(224, 30, 30, 0.5); }
      50% { box-shadow: 0 0 34px 8px rgba(224, 30, 30, 0.9); }
    }
    @keyframes secousse-forte {
      0%, 100% { transform: translateX(0) scale(1); }
      15% { transform: translateX(-12px) scale(1.04); }
      35% { transform: translateX(12px); }
      55% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    @keyframes monte-fort {
      0% { opacity: 0; top: 10px; transform: translateX(-50%) scale(0.6); }
      20% { opacity: 1; top: -14px; transform: translateX(-50%) scale(1.3); }
      100% { opacity: 0; top: -55px; transform: translateX(-50%) scale(1); }
    }

    .haut {
      position: sticky;
      top: 0;
      z-index: 5;
      margin: -30px -20px 0;
      padding: 16px 20px 0;
      background: #161616;
    }
    .fin {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px 18px;
      padding-bottom: 14px;
    }
    .fin:has(#resultat:empty) { display: none; }
    #resultat {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }
    .deux-colonnes {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 16px;
    }
    @media (max-width: 800px) {
      .deux-colonnes { grid-template-columns: 1fr; }
    }
    .deux-colonnes.sans-chat { grid-template-columns: 1fr; }
    .sans-chat .chat { display: none; }
    #action {
      display: none;
      padding: 12px 26px;
      border-radius: 10px;
      background: linear-gradient(135deg, #ff8a3d, #e5447a);
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
    }
    #action.visible { display: block; }
    #journal {
      background: #1e1e1e;
      border-radius: 10px;
      padding: 12px;
      height: 340px;
      overflow-y: auto;
      font-size: 13px;
      color: #ccc;
    }
    #journal div { padding: 2px 0; }
    #journal .tour { color: #ffb86b; font-weight: bold; margin-top: 6px; }

    .chat {
      background: #1e1e1e;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      height: 340px;
    }
    .chat h2 { font-size: 14px; color: #bbb; margin: 0 0 8px; }
    #messages {
      flex: 1;
      overflow-y: auto;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
    }
    /* Sélecteur de vitesse, collé au bord droit (combats PVE uniquement) */
    #vitesse {
      position: fixed;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 6px;
      background: #242424;
      border: 1px solid #333;
      border-right: none;
      border-radius: 10px 0 0 10px;
    }
    #vitesse[hidden] { display: none; }
    #vitesse button {
      min-width: 44px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #bbb;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    #vitesse button.actif { background: #ffb86b; border-color: #ffb86b; color: #161616; }
  </style>
</head>
<body>
  <!-- Toujours visible en haut : retour, puis résultat et bouton de sortie en fin de combat -->
  <div class="haut">
    <header>
      <h1>Combat en direct</h1>
      <a class="lien" href="/pvp.html">Retour</a>
    </header>
    <div class="fin">
      <div id="resultat"></div>
      <a id="action" href="/aventure.html"></a>
    </div>
  </div>

  <div id="banniere">Chargement…</div>

  <div id="vitesse" title="Vitesse du combat" hidden></div>

  <div class="camp">
    <h2 id="titre-moi"></h2>
    <div id="grille-moi" class="grille"></div>
  </div>

  <div class="camp">
    <h2 id="titre-adv"></h2>
    <div id="grille-adv" class="grille"></div>
  </div>

  <div class="deux-colonnes" id="colonnes">
    <div id="journal"></div>

    <div class="chat">
      <h2>Chat du combat</h2>
      <div id="messages"></div>
      <form id="formChat">
        <input id="texteChat" maxlength="200" placeholder="Insulte ton adversaire avec amour…" autocomplete="off">
        <button id="envoyerChat" type="submit">Envoyer</button>
      </form>
      <div id="statutChat"></div>
    </div>
  </div>

  <script src="/js/commun.js"></script>
  <script>
    const INTERVALLE_CHAT_MS = 2000;

    const idCombat = new URLSearchParams(location.search).get("id");
    const $ = (id) => document.getElementById(id);

    // Rythme du replay, fourni par le serveur avec le combat
    let pasMs = 0;
    // Pas occupés par un Second souffle (pause de la relève), fourni par le serveur
    let pasSouffle = 1;
    let tourCourant = 0;
    const pasDe = (e) => (e?.type === "souffle" ? pasSouffle : 1);

    // Vitesse d'affichage du replay (PVE uniquement), retenue pour les combats suivants
    const VITESSES = [0.5, 1, 2, 4];
    const CLE_VITESSE = "vitesseCombat";
    let vitesse = 1;

    let resultat = null;
    let eloDelta = null;
    let mode = "pvp";
    // Page de retour d'un combat PVE, selon son mode
    const PAGE_DU_MODE = { aventure: "/aventure.html", ressource: "/ressources.html", eveil: "/eveil.html" };
    let contexte = null;
    let monCamp = null;
    let etat = { A: [], B: [] };
    let journal = [];
    let index = 0;
    let actif = null;
    let fx = null;
    // Seconde bulle du même pas : soin de Dévouement sur un allié de l'attaquant
    let fx2 = null;
    let timer = null;

    let dernierIdMessage = 0;
    let chatLive = false;
    let chatTimer = null;

    const adverse = () => (monCamp === "A" ? "B" : "A");
    const iconeTrait = (id) => infoTrait(id)?.icone ?? "";

    // ---------- Combat ----------

    function carteHTML(camp, i, m) {
      if (!m) return `<div class="carte vide">Slot ${i + 1}</div>`;

      const estActif = actif && actif.camp === camp && actif.slot === i;
      const estCible = fx && fx.camp === camp && (fx.slots ? fx.slots.includes(i) : fx.slot === i);

      const classes = ["carte", camp === monCamp ? "moi" : "adv"];
      if (m.dead) classes.push("mort");
      if (estActif) classes.push(actif.presage ? "presage-lanceur" : actif.decret ? "decret-lanceur" : actif.arc ? "arc-lanceur" : "attaque");
      if (estCible && (fx.type === "degats" || fx.type === "chaos")) classes.push("touche");
      if (estCible && fx.type === "bouclier") classes.push("arc");
      if (m.bouclier > 0 && !m.dead) classes.push("protege");
      if (estCible && fx.type === "presage") classes.push("touche-fort");
      if (estCible && fx.type === "souffle") classes.push("releve");
      if (estCible && fx.type === "malediction") classes.push("maudit");
      const estSoigne = fx2 && fx2.camp === camp && fx2.slot === i;

      // Texte de la bulle : un par slot quand les cibles n'ont pas la même valeur (bouclier de chacun)
      const texteFx = estCible ? (fx.textes?.[i] ?? fx.texte) : "";
      const bulle = (estCible ? `<div class="bulle ${fx.type}">${texteFx}</div>` : "")
        + (estSoigne ? `<div class="bulle ${fx2.type}${estCible ? " second" : ""}">${fx2.texte}</div>` : "");
      const pct = Math.max(0, Math.round((m.pv / m.max) * 100));
      const bouclier = m.dead ? 0 : (m.bouclier ?? 0);
      const pctBouclier = Math.min(100, Math.round((bouclier / m.max) * 100));
      // Rareté (liseré du haut), puis délai du balayage de l'arc-en-ciel selon la place dans la rotation
      const styles = [];
      if (RARETES_AFFICHAGE[m.rarete]) styles.push(`box-shadow: inset 0 3px 0 ${RARETES_AFFICHAGE[m.rarete].couleur}`);
      if (estCible && fx.type === "bouclier") styles.push(`--delai: ${(i % 3) * 0.15}s`);
      if (bouclier > 0) styles.push(`--phase: -${Date.now() % 3000}ms`);
      const style = styles.length ? `style="${styles.join("; ")}"` : "";

      return `
        <div class="${classes.join(" ")}" ${style}>
          ${bulle}
          ${m.perk ? `<span class="perk${m.perkUtilise ? " utilise" : ""}" title="${m.perk.nom}${m.perkUtilise ? " (utilisé)" : ""}">${m.perk.icone}</span>` : ""}
          <img src="${m.image}" alt="" onerror="this.style.visibility='hidden'">
          <span class="nom">${m.nom}</span>
          <div class="barre"><div style="width:${pct}%"></div></div>
          ${bouclier > 0 ? `<div class="barre-bouclier" title="Bouclier"><div style="width:${pctBouclier}%"></div></div>` : ""}
          <div class="pv">${Math.max(0, m.pv)} / ${m.max} PV${bouclier > 0 ? ` · 🛡️ ${bouclier}` : ""}</div>
        </div>`;
    }

    function dessiner() {
      $("grille-moi").innerHTML = etat[monCamp].map((m, i) => carteHTML(monCamp, i, m)).join("");
      $("grille-adv").innerHTML = etat[adverse()].map((m, i) => carteHTML(adverse(), i, m)).join("");
    }

    function ajouterLog(e) {
      let txt = "";
      let classe = "";
      if (e.type === "tour") { txt = `Tour ${e.numero}`; classe = "tour"; }
      else if (e.type === "degats" && e.competence) txt = `${e.competence.icone} ${e.competence.nom} : ${e.de} → ${e.sur} : ${e.degats} dégâts (critique) · PV restants ${e.pvRestants}`;
      else if (e.type === "degats" && e.doubleFrappe) txt = `${iconeTrait("chaos")} ${e.de} frappe aussi ${e.sur} : ${e.degats} dégâts · PV restants ${e.pvRestants}`;
      else if (e.type === "degats") txt = `${e.de} → ${e.sur} : ${e.degats} dégâts${e.critique ? " (critique)" : ""} · PV restants ${e.pvRestants}`;
      else if (e.type === "rate") txt = `${e.de} rate ${e.sur}`;
      else if (e.type === "KO") txt = `${e.nom} est K.O.`;
      else if (e.type === "decret") txt = `${e.competence.icone} ${e.competence.nom} : ${e.de} donne +${e.atkPct} % ATK, +${e.hpPct} % PV et +${e.defPct} % DEF à ${e.cibles.length} allié${e.cibles.length > 1 ? "s" : ""}`;
      else if (e.type === "soin") txt = `🌸 ${e.de} soigne ${e.sur} : +${e.soin} PV · PV ${e.pvRestants}`;
      else if (e.type === "souffle") txt = `${e.perk.icone} ${e.perk.nom} : ${e.nom} se relève · PV ${e.pvRestants}`;
      else if (e.type === "malediction") txt = `${iconeTrait("malediction")} Malédiction : ${e.de} maudit ${e.sur} : −${pctFr(e.pct)} % DEF et ATK (−${pctFr(e.cumul)} % au total)`;
      else if (e.type === "sacrifice") txt = `${iconeTrait("sacrifice")} Sacrifice : ${e.nom} tombe, ${e.cibles.length} allié${e.cibles.length > 1 ? "s gagnent" : " gagne"} +${e.hp} PV, +${e.atk} ATK et +${e.def} DEF`;
      else if (e.type === "bouclier") txt = `${e.competence.icone} ${e.competence.nom} : ${e.de} protège ${e.cibles.length} allié${e.cibles.length > 1 ? "s" : ""} d'un bouclier de ${pctFr(e.bouclierPct)} % de leurs PV max`;
      if (!txt) return;
      // Bouclier : part des dégâts absorbée avant les PV
      if (e.type === "degats" && e.absorbe) txt += ` · 🛡️ ${e.absorbe} absorbés (bouclier ${e.bouclierRestant})`;
      // Lumière rasante : bonus de dégâts du coup (absent des combats enregistrés avant la compétence)
      if (e.type === "degats" && e.lumiere) txt += ` · ✨ Lumière rasante ×${e.lumiere.cumul} (+${pctFr(e.lumiere.pct)} %)`;
      // Soin de Dévouement, rangé dans le coup
      if (e.type === "degats" && e.devouement) txt += ` · ${iconeTrait("devouement")} ${e.devouement.sur} +${e.devouement.soin} PV`;

      const d = document.createElement("div");
      d.textContent = txt;
      if (classe) d.className = classe;
      $("journal").appendChild(d);
      $("journal").scrollTop = $("journal").scrollHeight;
    }

    function appliquer(e) {
      // Après la pause d'un Second souffle, le bandeau revient au tour en cours
      if (e.type !== "souffle" && tourCourant) $("banniere").textContent = `Tour ${tourCourant}`;
      if (e.type === "tour") {
        tourCourant = e.numero;
        $("banniere").textContent = `Tour ${e.numero}`;
      } else if (e.type === "degats" && e.competence) {
        actif = { camp: e.deCamp, slot: e.deSlot, presage: true };
        etat[e.surCamp][e.surSlot].pv = e.pvRestants;
        fx = { camp: e.surCamp, slot: e.surSlot, type: "presage", texte: `${e.competence.icone} -${e.degats} CRIT` };
      } else if (e.type === "degats" && e.doubleFrappe) {
        actif = { camp: e.deCamp, slot: e.deSlot };
        etat[e.surCamp][e.surSlot].pv = e.pvRestants;
        fx = { camp: e.surCamp, slot: e.surSlot, type: "chaos", texte: `${iconeTrait("chaos")} -${e.degats}` };
      } else if (e.type === "degats") {
        actif = { camp: e.deCamp, slot: e.deSlot };
        etat[e.surCamp][e.surSlot].pv = e.pvRestants;
        fx = { camp: e.surCamp, slot: e.surSlot, type: "degats", texte: `-${e.degats}${e.critique ? " CRIT" : ""}` };
      } else if (e.type === "rate") {
        actif = { camp: e.deCamp, slot: e.deSlot };
        fx = { camp: e.surCamp, slot: e.surSlot, type: "rate", texte: "Raté" };
      } else if (e.type === "KO") {
        etat[e.camp][e.slot].dead = true;
        fx = { camp: e.camp, slot: e.slot, type: "ko", texte: "K.O." };
      } else if (e.type === "decret") {
        actif = { camp: e.deCamp, slot: e.deSlot, decret: true };
        for (const c of e.cibles) if (c.hp) { etat[e.deCamp][c.slot].max = c.hp; etat[e.deCamp][c.slot].pv = c.pv; }
        fx = { camp: e.deCamp, slots: e.cibles.map((c) => c.slot), type: "decret", texte: `${e.competence.icone} +${e.atkPct} %` };
      } else if (e.type === "bouclier") {
        actif = { camp: e.deCamp, slot: e.deSlot, arc: true };
        const textes = {};
        for (const c of e.cibles) {
          etat[e.deCamp][c.slot].bouclier = c.bouclier;
          textes[c.slot] = `🛡️ +${c.bouclier}`;
        }
        fx = { camp: e.deCamp, slots: e.cibles.map((c) => c.slot), type: "bouclier", textes, texte: e.competence.icone };
      } else if (e.type === "soin") {
        actif = { camp: e.deCamp, slot: e.deSlot };
        etat[e.surCamp][e.surSlot].pv = e.pvRestants;
        fx = { camp: e.surCamp, slot: e.surSlot, type: "soin", texte: `+${e.soin}` };
      } else if (e.type === "souffle") {
        etat[e.camp][e.slot].pv = e.pvRestants;
        etat[e.camp][e.slot].perkUtilise = true;
        $("banniere").textContent = `${e.perk.icone} ${e.perk.nom} : ${e.nom} se relève !`;
        fx = { camp: e.camp, slot: e.slot, type: "souffle", texte: `${e.perk.icone} +${e.pvRestants} PV` };
      } else if (e.type === "malediction") {
        actif = { camp: e.deCamp, slot: e.deSlot };
        fx = { camp: e.surCamp, slot: e.surSlot, type: "malediction", texte: `${iconeTrait("malediction")} -${pctFr(e.pct)} %` };
      } else if (e.type === "sacrifice") {
        for (const c of e.cibles) Object.assign(etat[e.camp][c.slot], { max: c.hp, pv: c.pv });
        fx = { camp: e.camp, slots: e.cibles.map((c) => c.slot), type: "sacrifice", texte: `${iconeTrait("sacrifice")} +${pctFr(e.partStats)} %` };
      }
      // Bouclier touché : il diminue d'autant, la bulle montre la part absorbée
      if (e.type === "degats" && e.absorbe) {
        etat[e.surCamp][e.surSlot].bouclier = e.bouclierRestant;
        if (fx) fx.texte += ` 🛡️${e.absorbe}`;
      }
      // Lumière rasante : petite étincelle et nombre de cumuls sur la bulle du coup
      if (e.type === "degats" && e.lumiere && fx) fx.texte = `✨×${e.lumiere.cumul} ${fx.texte}`;
      // Dévouement : l'allié soigné reçoit sa propre bulle
      if (e.type === "degats" && e.devouement) {
        etat[e.deCamp][e.devouement.surSlot].pv = e.devouement.pvRestants;
        fx2 = { camp: e.deCamp, slot: e.devouement.surSlot, type: "soin", texte: `${iconeTrait("devouement")} +${e.devouement.soin}` };
      }
      ajouterLog(e);
    }

    function appliquerSansAnimation(e) {
      if (e.type !== "KO") { actif = null; fx = null; fx2 = null; }
      appliquer(e);
    }

    async function terminer(redirigerEnDirect) {
      clearTimeout(timer);
      timer = null;
      actif = null;
      fx = null;
      fx2 = null;
      dessiner();
      $("banniere").textContent = "Combat terminé";
      const v = resultat.vainqueur;
      $("resultat").textContent = v === null ? "Match nul" : v === monCamp ? "Victoire !" : "Défaite";
      if (eloDelta !== null && eloDelta !== undefined) {
        $("resultat").textContent += eloDelta > 0 ? ` +${eloDelta} elo` : eloDelta < 0 ? ` −${-eloDelta} elo` : " ±0 elo";
      }

      // Replay PVE fini en accéléré : le serveur avance la fin du combat pour qu'on puisse enchaîner
      if (mode !== "pvp" && redirigerEnDirect && vitesse > 1) {
        await api(`/combats/${idCombat}/fin`, { corps: {} });
      }

      if (mode === "aventure") {
        terminerAventure(v === monCamp);
        return;
      }
      if (mode === "ressource" || mode === "eveil") {
        terminerDonjon(v === monCamp);
        return;
      }

      if (redirigerEnDirect) {
        $("resultat").textContent += " · retour à l'historique…";
        setTimeout(() => location.replace("/pvp.html"), 3000);
      }
    }

    // Donjon de ressources ou d'éveil : quantité gagnée, puis retour à la page du donjon
    function terminerDonjon(victoire) {
      const g = contexte?.gains;
      if (victoire && g) {
        // Nom de la récompense enregistré avec les gains ; anciens combats : déduit du donjon
        const unite = g.nom ?? ({ tirages: "tirages", coins: "coins", xp: "XP" }[g.donjon] ?? g.ressource ?? "");
        $("resultat").textContent += ` +${g.quantite} ${unite}`;
        if (g.niveauxGagnes > 0) $("resultat").textContent += " · Niveau supérieur !";
      }
      $("action").textContent = mode === "eveil" ? "Retour au donjon" : "Retour aux donjons";
      $("action").href = PAGE_DU_MODE[mode];
      $("action").classList.add("visible");
    }

    // Aventure : récompenses gagnées, puis « Étage suivant » ou « Réessayer »
    function terminerAventure(victoire) {
      const g = contexte?.gains;
      if (victoire && g) {
        const morceaux = [`+${g.xp} XP`, `+${g.coins} coins`];
        if (g.tirages > 0) morceaux.push(`+${g.tirages} tirage${g.tirages > 1 ? "s" : ""}`);
        if (g.singe) {
          const nom = resultat.equipeB.find((s) => s && s.id === g.singe)?.nom ?? g.singe;
          morceaux.push(`🐒 ${nom}`);
        }
        if (g.niveauxGagnes > 0) morceaux.push("Niveau supérieur !");
        $("resultat").textContent += " " + morceaux.join(" · ");
      }
      $("action").textContent = victoire ? "Étage suivant" : "Réessayer";
      $("action").classList.add("visible");
    }

    function pas() {
      if (index >= journal.length) return terminer(true);

      const e = journal[index++];
      if (e.type !== "KO") { actif = null; fx = null; fx2 = null; }
      appliquer(e);
      dessiner();
      // Second souffle : le combat reste en pause le temps de l'animation
      timer = setTimeout(pas, (pasMs * pasDe(e)) / vitesse);
    }

    // ---------- Vitesse ----------

    function lireVitesse() {
      try {
        const v = Number(localStorage.getItem(CLE_VITESSE));
        return VITESSES.includes(v) ? v : 1;
      } catch {
        return 1;
      }
    }

    function appliquerVitesse(v) {
      vitesse = v;
      document.documentElement.style.setProperty("--vitesse", v);
      for (const b of $("vitesse").children) b.classList.toggle("actif", Number(b.dataset.v) === v);
    }

    function choisirVitesse(v) {
      appliquerVitesse(v);
      try { localStorage.setItem(CLE_VITESSE, String(v)); } catch {}
      // Combat en cours : le prochain coup part tout de suite au nouveau rythme
      if (timer !== null) {
        clearTimeout(timer);
        timer = setTimeout(pas, pasMs / vitesse);
      }
    }

    function afficherSelecteurVitesse() {
      $("vitesse").innerHTML = VITESSES.map((v) => `<button type="button" data-v="${v}">x${v}</button>`).join("");
      $("vitesse").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (b) choisirVitesse(Number(b.dataset.v));
      });
      $("vitesse").hidden = false;
      appliquerVitesse(lireVitesse());
    }

    // ---------- Chat ----------

    function majStatutChat() {
      const input = $("texteChat");
      const bouton = $("envoyerChat");
      input.disabled = !chatLive;
      bouton.disabled = !chatLive;
      $("statutChat").textContent = chatLive ? "" : "Le combat est terminé, le chat est fermé.";
    }

    async function rafraichirChat() {
      const { ok, data } = await api(`/combats/${idCombat}/messages?apres=${dernierIdMessage}`);
      if (!ok) return;

      // Deux rafraîchissements peuvent se croiser (envoi + intervalle) : on ignore les doublons
      for (const m of data.messages) {
        if ($("messages").querySelector(`[data-id="${m.id}"]`)) continue;
        ajouterBulleChat($("messages"), m);
        dernierIdMessage = Math.max(dernierIdMessage, Number(m.id));
      }
      if (chatLive !== data.live) {
        chatLive = data.live;
        majStatutChat();
      }
    }

    $("formChat").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = $("texteChat");
      const texte = input.value.trim();
      if (!texte) return;

      const { ok, data } = await api(`/combats/${idCombat}/messages`, { corps: { texte } });
      if (!ok) {
        $("statutChat").textContent = data.erreur;
        if (data.erreur === "le combat est terminé") {
          chatLive = false;
          majStatutChat();
        }
        return;
      }
      input.value = "";
      $("statutChat").textContent = "";
      rafraichirChat();
    });

    // ---------- Chargement ----------

    async function charger() {
      if (!await exigerConnexion()) return;
      if (!idCombat) { $("banniere").textContent = "Aucun combat sélectionné."; return; }

      const { ok, data } = await api(`/combats/${idCombat}`);
      if (!ok) { $("banniere").textContent = "Combat introuvable."; return; }

      pasMs = data.pasMs;
      pasSouffle = data.pasSouffle ?? 1;
      resultat = data.resultat;
      eloDelta = data.eloDelta;
      mode = data.mode ?? "pvp";
      contexte = data.contexte;
      monCamp = data.monCamp;
      const pseudoMoi = monCamp === "A" ? data.pseudoA : data.pseudoB;
      const pseudoAdv = monCamp === "A" ? data.pseudoB : data.pseudoA;
      $("titre-moi").textContent = `${pseudoMoi} (toi)`;
      $("titre-adv").textContent = pseudoAdv;

      for (const camp of ["A", "B"]) {
        etat[camp] = resultat[`equipe${camp}`].map((m) =>
          m ? { ...m, pv: m.hp, max: m.hp, dead: false, bouclier: 0 } : null
        );
      }
      journal = resultat.journal;

      const ecoule = Math.max(0, data.ecouleMs - data.delaiInitialMs);
      const fini = resultat.dureeMs !== undefined && data.ecouleMs >= resultat.dureeMs;
      // Événements déjà joués : on avance tant que leurs pas tiennent dans le temps écoulé (une relève en compte plusieurs)
      let pasEcoules = Math.floor(ecoule / pasMs);
      for (index = 0; index < journal.length && (fini || pasEcoules >= pasDe(journal[index])); index++) {
        pasEcoules -= pasDe(journal[index]);
        appliquerSansAnimation(journal[index]);
      }

      dessiner();

      if (mode !== "pvp") {
        // Combat PVE (Aventure ou donjon) : pas de chat, retour vers la page du mode
        $("colonnes").classList.add("sans-chat");
        document.querySelector("header a.lien").href = PAGE_DU_MODE[mode] ?? "/aventure.html";
        afficherSelecteurVitesse();
      } else {
        // Chat : on charge tout l'historique du combat, puis on interroge régulièrement
        await rafraichirChat();
        chatTimer = setInterval(rafraichirChat, INTERVALLE_CHAT_MS);
        majStatutChat();
      }

      if (index >= journal.length) {
        terminer(false);
      } else {
        $("banniere").textContent = "En direct";
        timer = setTimeout(pas, pasMs / vitesse);
      }
    }

    charger();
  </script>
</body>
