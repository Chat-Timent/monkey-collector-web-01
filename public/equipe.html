<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Équipe</title>
  <link rel="stylesheet" href="/css/commun.css">
  <link rel="stylesheet" href="/css/arbre.css">
  <link rel="stylesheet" href="/css/barre.css">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #161616;
      color: var(--texte);
      margin: 0;
      min-height: 100vh;
    }
    .contenu { max-width: 760px; margin: 24px auto; padding: 0 16px 40px; }

    .ligne-equipe { margin-bottom: 22px; }
    .ligne-equipe h2 {
      font-size: 13px;
      color: var(--texte-doux);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 8px;
    }
    .slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

    .slot { position: relative; }
    .slot-bouton {
      width: 100%;
      min-height: 150px;
      background: #242424;
      border: 1px dashed #444;
      border-radius: 12px;
      padding: 10px;
      color: var(--texte);
      font: inherit;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .slot-bouton.plein { border: 1px solid #333; }
    .slot-bouton:hover { border-color: var(--accent); }
    .slot-bouton img { width: 70px; height: 70px; object-fit: contain; }
    .slot-bouton .nom { font-weight: bold; font-size: 13px; }
    .slot-bouton .ajouter { color: #777; font-size: 28px; line-height: 1; }
    .slot-bouton .sous { font-size: 12px; color: var(--or); }

    /* Perk porté, sous le singe */
    .perk-bouton {
      width: 100%;
      margin-top: 6px;
      padding: 7px 8px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #1e1b2e;
      color: var(--texte);
      font: inherit;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .perk-bouton:hover { border-color: var(--accent); }
    .perk-bouton .effet { display: block; font-size: 11px; font-weight: normal; color: var(--texte-doux); overflow: hidden; text-overflow: ellipsis; }
    .perk-bouton.sans { border-style: dashed; color: #888; font-weight: normal; }
    .option .icone-perk { width: 48px; font-size: 30px; text-align: center; flex-shrink: 0; }

    .pastille {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px 2px 3px;
      border-radius: 999px;
      border: 1.5px solid;
      font-size: 11px;
      font-weight: bold;
      background: #161616;
    }
    .pastille img { width: 14px; height: 14px; object-fit: contain; }

    .menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: min(280px, 85vw);
      max-height: 340px;
      overflow-y: auto;
      background: #242424;
      border: 1px solid #444;
      border-radius: 12px;
      padding: 6px;
      z-index: 20;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .slot:nth-child(3) .menu { left: auto; right: 0; }
    .menu.ouvert { display: block; }
    .option {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px;
      background: none;
      border: none;
      border-radius: 8px;
      color: var(--texte);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .option:hover:not(:disabled) { background: #2f2f2f; }
    .option:disabled { opacity: 0.4; cursor: default; }
    .option > img { width: 48px; height: 48px; object-fit: contain; flex-shrink: 0; }
    .option .infos { display: flex; flex-direction: column; gap: 3px; }
    .option .nom { font-weight: bold; font-size: 14px; }
    .option .sous { font-size: 12px; color: var(--texte-doux); }
    .option.retirer { color: #ff8a8a; font-weight: bold; font-size: 14px; }
    .menu .vide { padding: 8px; color: var(--texte-doux); margin: 0; }

    /* Résonances : une pastille par catégorie présente dans l'équipe */
    #resonances { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; min-height: 34px; }
    .resonance {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 999px;
      background: #242424; border: 1px solid #333; color: var(--texte-doux);
      font: inherit; font-size: 14px; cursor: pointer;
    }
    .resonance:hover { border-color: var(--famille, var(--accent)); }
    .resonance.infos { color: var(--texte); }
    .resonance.active { border-color: var(--famille, var(--accent)); color: var(--famille, var(--texte)); font-weight: bold; }
    .option .badges { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }

    #message { min-height: 1.2em; color: var(--or); font-size: 14px; margin: 0; }

    @media (max-width: 640px) {
      .slots { gap: 8px; }
      .slot-bouton { min-height: 120px; padding: 6px; }
      .slot-bouton img { width: 56px; height: 56px; }
      .slot-bouton .pastille { display: none; }
      .slot:nth-child(2) .menu { left: 50%; transform: translateX(-50%); }
      .perk-bouton { font-size: 12px; padding: 6px 4px; }
    }
  </style>
</head>
<body>
  <main class="contenu">
    <div id="resonances"></div>
    <div id="rangees"></div>
    <p id="message"></p>
  </main>

  <script src="/js/commun.js"></script>
  <script src="/js/arbre.js"></script>
  <script src="/js/barre.js"></script>
  <script src="/js/session.js"></script>
  <script>
    // Les emplacements entrent en combat par rangées de 3 : ligne 1, puis ligne 2, puis renfort.
    const RANGEES = ["Ligne 1", "Ligne 2", "Renfort"];

    let possedes = [];
    let perks = { catalogue: {}, obtenus: [] }; // réponse /perks
    let armes = { catalogue: {}, obtenus: [] }; // réponse /armes
    let resonances = { paliers: [], categories: {} }; // réponse /equipe
    let equipe = Array(6).fill(null);
    let minuteurMessage = null;
    const message = document.getElementById("message");

    function afficherMessage(texte, temporaire = false) {
      clearTimeout(minuteurMessage);
      message.textContent = texte;
      if (temporaire) minuteurMessage = setTimeout(() => { message.textContent = ""; }, 2000);
    }

    function pastilleHTML(rarete) {
      const r = infoRarete(rarete);
      return `<span class="pastille" style="border-color:${r.couleur};color:${r.couleur}">
                <img src="${r.icone}" alt="">${r.label}
              </span>`;
    }

    function trouverSinge(id) {
      return possedes.find((s) => s.id === id);
    }

    function fermerMenus() {
      document.querySelectorAll(".menu.ouvert").forEach((m) => m.classList.remove("ouvert"));
    }

    function construireOptions(index) {
      const dejaUtilises = equipe.filter((id, i) => id && i !== index);
      let html = "";
      if (equipe[index] !== null) {
        html += `<button class="option retirer" data-id="">✕ Retirer</button>`;
      }
      if (possedes.length === 0) {
        return html + `<p class="vide">Aucun singe : va tirer !</p>`;
      }
      // Singes disponibles d'abord, ceux déjà placés tout en bas
      const tries = [...possedes].sort((a, b) => dejaUtilises.includes(a.id) - dejaUtilises.includes(b.id));
      for (const s of tries) {
        const dispo = !dejaUtilises.includes(s.id);
        html += `
          <button class="option" data-id="${s.id}" ${dispo ? "" : "disabled"}>
            <img src="${s.image}" alt="">
            <div class="infos">
              <span class="nom">${s.espece.nom}</span>
              <span class="badges">${pastilleHTML(s.espece.rarete)} ${badgeFamilleHTML(s.espece.categorie)}</span>
              <span class="sous">Lvl ${s.niveau.niveau}${dispo ? "" : " · déjà placé"}</span>
            </div>
          </button>`;
      }
      return html;
    }

    function ouvrirMenu(slot, index) {
      const menu = slot.querySelector(".menu");
      const dejaOuvert = menu.classList.contains("ouvert") && menu.dataset.type === "singe";
      fermerMenus();
      if (dejaOuvert) return;
      menu.dataset.type = "singe";
      menu.innerHTML = construireOptions(index);
      menu.classList.add("ouvert");
      menu.querySelectorAll(".option").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          choisir(index, btn.dataset.id || null);
        });
      });
    }

    // ---------- Perks ----------

    function perkPorte(espece) {
      return perks.obtenus.find((p) => p.espece === espece && perks.catalogue[p.perk]) ?? null;
    }

    // `cible` : le singe du slot, pour chiffrer l'effet sur lui (ex. Peau de fer : +25 % DEF (+70))
    function texteOption(p, cible) {
      const c = perks.catalogue[p.perk];
      const porteur = p.espece ? trouverSinge(p.espece) : null;
      const sous = effetPerkSur(perks.catalogue, p.perk, p.tier, (cible?.statsBase ?? cible?.stats)) + (porteur ? ` · sur ${porteur.espece.nom}` : "");
      return `<span class="icone-perk">${c.icone}</span>
              <div class="infos">
                <span class="nom">${nomPerk(perks.catalogue, p.perk, p.tier)}</span>
                <span class="sous">${sous}</span>
              </div>`;
    }

    function ouvrirMenuPerk(slot, espece) {
      const menu = slot.querySelector(".menu");
      const dejaOuvert = menu.classList.contains("ouvert") && menu.dataset.type === "perk";
      fermerMenus();
      if (dejaOuvert) return;
      menu.dataset.type = "perk";
      const actuel = perkPorte(espece);
      // Perks libres d'abord, ceux portés par un autre singe tout en bas
      const autres = perks.obtenus
        .filter((p) => perks.catalogue[p.perk] && p !== actuel)
        .sort((a, b) => Boolean(a.espece) - Boolean(b.espece));
      menu.innerHTML = "";
      if (actuel) {
        const retirer = document.createElement("button");
        retirer.className = "option retirer";
        retirer.textContent = "✕ Retirer le perk";
        retirer.addEventListener("click", (e) => { e.stopPropagation(); equiperPerk(actuel, null); });
        menu.appendChild(retirer);
      }
      if (perks.obtenus.length === 0) {
        menu.insertAdjacentHTML("beforeend", `<p class="vide">Aucun perk : tire-en dans l'onglet Objets !</p>`);
      }
      for (const p of autres) {
        const option = document.createElement("button");
        option.className = "option";
        option.innerHTML = texteOption(p, trouverSinge(espece));
        option.addEventListener("click", (e) => { e.stopPropagation(); equiperPerk(p, espece); });
        menu.appendChild(option);
      }
      menu.classList.add("ouvert");
    }

    async function equiperPerk(p, espece) {
      fermerMenus();
      try {
        const { ok, data } = await api("/perks/equiper", { corps: { perk: p.perk, tier: p.tier, espece } });
        if (!ok) throw new Error(data.erreur);
        perks = data;
        afficherSlots();
        afficherMessage("✓ Sauvegardé", true);
      } catch (err) {
        afficherMessage("Erreur : " + err.message);
      }
    }

    // ---------- Armes ----------

    function armePortee(espece) {
      return armes.obtenus.find((a) => a.espece === espece && armes.catalogue[a.objet]) ?? null;
    }

    function ouvrirMenuArme(slot, espece) {
      const menu = slot.querySelector(".menu");
      const dejaOuvert = menu.classList.contains("ouvert") && menu.dataset.type === "arme";
      fermerMenus();
      if (dejaOuvert) return;
      menu.dataset.type = "arme";
      const actuelle = armePortee(espece);
      const cible = trouverSinge(espece);
      // Armes libres d'abord, celles portées par un autre singe tout en bas
      const autres = armes.obtenus
        .filter((a) => armes.catalogue[a.objet] && a !== actuelle)
        .sort((a, b) => Boolean(a.espece) - Boolean(b.espece));
      menu.innerHTML = "";
      if (actuelle) {
        const retirer = document.createElement("button");
        retirer.className = "option retirer";
        retirer.textContent = "✕ Retirer l'arme";
        retirer.addEventListener("click", (e) => { e.stopPropagation(); equiperArme(actuelle, null); });
        menu.appendChild(retirer);
      }
      if (armes.obtenus.length === 0) {
        menu.insertAdjacentHTML("beforeend", `<p class="vide">Aucune arme : tire-en dans l'onglet Objets !</p>`);
      }
      for (const a of autres) {
        const c = armes.catalogue[a.objet];
        const porteur = a.espece ? trouverSinge(a.espece) : null;
        const option = document.createElement("button");
        option.className = "option";
        option.innerHTML = `<span class="icone-perk"></span><div class="infos"><span class="nom"></span><span class="sous"></span></div>`;
        option.querySelector(".icone-perk").textContent = c.icone;
        option.querySelector(".nom").textContent = `${nomObjet(armes.catalogue, a.objet, a.tier)} · Niv. ${a.niveau}`;
        option.querySelector(".sous").textContent = texteEffetsObjet(a.valeurs, (cible?.statsBase ?? cible?.stats)) + (porteur ? ` · sur ${porteur.espece.nom}` : "");
        option.addEventListener("click", (e) => { e.stopPropagation(); equiperArme(a, espece); });
        menu.appendChild(option);
      }
      menu.classList.add("ouvert");
    }

    async function equiperArme(a, espece) {
      fermerMenus();
      try {
        const { ok, data } = await api("/armes/equiper", { corps: { objet: a.objet, tier: a.tier, espece } });
        if (!ok) throw new Error(data.erreur);
        armes = data;
        afficherSlots();
        afficherMessage("✓ Sauvegardé", true);
      } catch (err) {
        afficherMessage("Erreur : " + err.message);
      }
    }

    async function choisir(index, id) {
      fermerMenus();
      const ancienne = equipe[index];
      equipe[index] = id;
      afficherSlots();
      try {
        const { ok, data } = await api("/equipe", { corps: { especes: equipe } });
        if (!ok) throw new Error(data.erreur);
        afficherMessage("✓ Sauvegardé", true);
      } catch (err) {
        equipe[index] = ancienne;
        afficherSlots();
        afficherMessage("Erreur : " + err.message);
      }
    }

    function slotHTML(index) {
      const id = equipe[index];
      const singe = id ? trouverSinge(id) : null;
      const contenu = singe
        ? `<img src="${singe.image}" alt="">
           <span class="nom">${singe.espece.nom}</span>
           ${pastilleHTML(singe.espece.rarete)}
           ${badgeFamilleHTML(singe.espece.categorie)}
           <span class="sous">Lvl ${singe.niveau.niveau}</span>`
        : `<span class="ajouter">+</span>`;
      let perkHTML = "";
      if (singe) {
        const p = perkPorte(id);
        perkHTML = p
          ? `<button class="perk-bouton" type="button">${perks.catalogue[p.perk].icone} ${nomPerk(perks.catalogue, p.perk, p.tier)}
               <span class="effet">${effetPerkSur(perks.catalogue, p.perk, p.tier, (singe.statsBase ?? singe.stats))}</span></button>`
          : `<button class="perk-bouton sans" type="button">+ Perk</button>`;
        const a = armePortee(id);
        perkHTML += a
          ? `<button class="perk-bouton arme-bouton" type="button">${armes.catalogue[a.objet].icone} ${nomObjet(armes.catalogue, a.objet, a.tier)}
               <span class="effet">${texteEffetsObjet(a.valeurs, (singe.statsBase ?? singe.stats))}</span></button>`
          : `<button class="perk-bouton arme-bouton sans" type="button">+ Arme</button>`;
      }
      return `<button class="slot-bouton ${singe ? "plein" : ""}" type="button" aria-label="Emplacement ${index + 1}">${contenu}</button>
              ${perkHTML}
              <div class="menu"></div>`;
    }

    // Pastilles de résonance : icône et nombre de singes de la catégorie / prochain palier.
    function afficherResonances() {
      const compte = {};
      for (const id of equipe) {
        const cat = id && trouverSinge(id)?.espece.categorie;
        if (cat && resonances.categories[cat]) compte[cat] = (compte[cat] ?? 0) + 1;
      }
      const zone = document.getElementById("resonances");
      zone.innerHTML = "";
      for (const [cat, nb] of Object.entries(compte)) {
        const { paliers } = resonances;
        const atteints = paliers.filter((p) => nb >= p).length;
        const prochain = paliers[atteints] ?? paliers[paliers.length - 1];
        const pastille = document.createElement("button");
        pastille.type = "button";
        pastille.className = "resonance" + (atteints > 0 ? " active" : "");
        pastille.addEventListener("click", () => ouvrirInfosFamilles(resonances, compte, cat));
        const famille = infoFamille(cat);
        if (famille) pastille.style.setProperty("--famille", famille.couleur);
        pastille.textContent = `${famille?.icone ?? ""} ${nb}/${prochain}`;
        const b = atteints > 0 ? resonances.categories[cat].bonus[atteints - 1] : null;
        pastille.title = b ? `${cat} : +${pctFr(b.hp)} % PV, +${pctFr(b.atk)} % ATK, +${pctFr(b.def)} % DEF` : cat;
        pastille.setAttribute("aria-label", `${cat} : ${nb} sur ${prochain}, voir les bonus`);
        zone.appendChild(pastille);
      }
      const infos = document.createElement("button");
      infos.type = "button";
      infos.className = "resonance infos";
      infos.textContent = "ⓘ Familles";
      infos.addEventListener("click", () => ouvrirInfosFamilles(resonances, compte));
      zone.appendChild(infos);
    }

    function afficherSlots() {
      afficherResonances();
      const zone = document.getElementById("rangees");
      zone.innerHTML = "";
      for (let debut = 0; debut < equipe.length; debut += 3) {
        const rangee = document.createElement("section");
        rangee.className = "ligne-equipe";
        const titre = document.createElement("h2");
        titre.textContent = RANGEES[debut / 3] ?? `Ligne ${debut / 3 + 1}`;
        const grille = document.createElement("div");
        grille.className = "slots";

        for (let index = debut; index < Math.min(debut + 3, equipe.length); index++) {
          const slot = document.createElement("div");
          slot.className = "slot";
          slot.innerHTML = slotHTML(index);
          slot.querySelector(".slot-bouton").addEventListener("click", (e) => {
            e.stopPropagation();
            ouvrirMenu(slot, index);
          });
          slot.querySelector(".perk-bouton:not(.arme-bouton)")?.addEventListener("click", (e) => {
            e.stopPropagation();
            ouvrirMenuPerk(slot, equipe[index]);
          });
          slot.querySelector(".arme-bouton")?.addEventListener("click", (e) => {
            e.stopPropagation();
            ouvrirMenuArme(slot, equipe[index]);
          });
          grille.appendChild(slot);
        }
        rangee.append(titre, grille);
        zone.appendChild(rangee);
      }
    }

    async function charger() {
      const [resDex, resEquipe, resPerks, resArmes] = await Promise.all([api("/monkeydex"), api("/equipe"), api("/perks"), api("/armes")]);
      if (resPerks.ok) perks = resPerks.data;
      if (resArmes.ok) armes = resArmes.data;
      if (!resDex.ok || !resEquipe.ok) {
        afficherMessage("Erreur de chargement, réessaie.");
        return;
      }
      possedes = resDex.data.singes;
      resonances = resEquipe.data.resonances ?? resonances;
      equipe = Array(resEquipe.data.nbSlots ?? 6).fill(null);
      for (const { slot, espece } of resEquipe.data.equipe) {
        if (slot <= equipe.length) equipe[slot - 1] = espece;
      }
      afficherSlots();
    }

    document.addEventListener("click", fermerMenus);
    // Débloquer « Rang de renfort » ajoute un emplacement : on recharge l'équipe
    document.addEventListener("arbre-change", charger);

    exigerConnexion().then((moi) => { if (moi) charger(); });
  </script>
</body>
</html>
