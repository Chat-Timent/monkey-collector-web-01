<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Équipe</title>
  <link rel="stylesheet" href="/css/commun.css">
  <link rel="stylesheet" href="/css/arbre.css">
  <link rel="stylesheet" href="/css/barre.css">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #161616;
      color: var(--texte);
      margin: 0;
      min-height: 100vh;
    }
    .contenu { max-width: 1040px; margin: 24px auto; padding: 0 16px 40px; }

    /* Disposition : liste de l'équipe à gauche, fiche du singe sélectionné à droite (plein écran sur mobile) */
    .disposition { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; align-items: start; }

    /* ---------- Liste de l'équipe ---------- */
    .rangee { margin-bottom: 16px; }
    .rangee h2 { font-size: 13px; color: var(--texte-doux); text-transform: uppercase; letter-spacing: 1px; margin: 0 0 6px; }
    .ligne {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin-bottom: 6px;
      padding: 8px 10px;
      background: #242424;
      border: 1px solid #333;
      border-radius: 12px;
      color: var(--texte);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .ligne:hover { border-color: var(--accent); }
    .ligne.selection { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .ligne img { width: 48px; height: 48px; object-fit: contain; }
    .ligne .infos { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .ligne .nom { font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ligne .sous { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--or); }
    .ligne .stats { display: flex; gap: 10px; font-size: 12px; color: var(--texte-doux); }
    .ligne .stats b { color: var(--texte); }
    .ligne .objets { display: flex; gap: 3px; justify-content: flex-end; }
    .ligne .objets span {
      width: 24px; height: 24px; border-radius: 6px; border: 1px solid #3a3a3a; background: #1e1b2e;
      display: flex; align-items: center; justify-content: center; font-size: 14px; color: #666;
    }
    .ligne.vide { grid-template-columns: 1fr; border-style: dashed; color: #888; text-align: center; padding: 16px; }
    .ligne .droite { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }

    /* ---------- Fiche du singe ---------- */
    #fiche {
      position: sticky;
      top: calc(var(--topbar-h, 0px) + 16px);
      background: #242424;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 16px;
    }
    #fiche[hidden] { display: none; }
    .retour { display: none; }
    .fiche-entete { display: flex; gap: 12px; align-items: center; }
    .fiche-entete img { width: 84px; height: 84px; object-fit: contain; flex-shrink: 0; }
    .fiche-entete h3 { margin: 0 0 4px; font-size: 19px; }
    .fiche-entete .badges { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 4px; }
    .fiche-entete .niveau { font-size: 13px; color: var(--or); display: flex; gap: 8px; align-items: center; }
    .fiche-entete .ligne-traits { margin-top: 8px; }
    .actions { display: flex; gap: 8px; margin: 12px 0; }
    .actions button {
      flex: 1; padding: 9px; border-radius: 10px; border: 1px solid #444; background: #2b2f3a;
      color: var(--texte); font: inherit; font-size: 14px; font-weight: bold; cursor: pointer;
    }
    .actions button:hover { border-color: var(--accent); }
    .actions button.danger { color: #ff8a8a; }
    .fiche table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .fiche th, .fiche td { padding: 5px 6px; border-bottom: 1px solid #333; text-align: right; }
    .fiche th:first-child, .fiche td:first-child { text-align: left; }
    .fiche th { color: #999; font-weight: normal; font-size: 11px; text-transform: uppercase; }
    .fiche td.bonus { color: var(--vert); }
    .fiche td.total { font-weight: bold; }
    .fiche h4 { font-size: 12px; color: var(--texte-doux); text-transform: uppercase; letter-spacing: 1px; margin: 14px 0 6px; }
    .competence { font-size: 13px; color: #ddd; margin: 10px 0 0; }
    .emplacement {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      width: 100%; margin-bottom: 5px; padding: 8px 10px;
      background: #1e1b2e; border: 1px solid #333; border-radius: 10px;
      color: var(--texte); font: inherit; text-align: left; cursor: pointer;
    }
    .emplacement:hover { border-color: var(--accent); }
    .emplacement .type { font-size: 12px; color: var(--texte-doux); flex-shrink: 0; width: 86px; }
    .emplacement .objet { flex: 1; min-width: 0; text-align: right; }
    .emplacement .objet b { display: block; font-size: 14px; }
    .emplacement .objet small { display: block; font-size: 12px; color: var(--texte-doux); }
    .emplacement.sans { border-style: dashed; color: #888; }
    /* Arme et équipements de la fiche : une tuile par emplacement */
    .cases-emplacements { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
    .case-emplacement { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .case-emplacement .libelle { font-size: 11px; color: var(--texte-doux); }
    /* Fenêtre de choix : grille de tuiles et aperçu de l'objet choisi */
    .choix-tuiles { padding: 6px; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); }
    .choix-tuiles .tuile-objet .emoji { font-size: 30px; }
    .sans-infobulle .infobulle { display: none !important; }
    .apercu-objet {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      margin: 4px 6px 6px; padding: 10px; border-radius: 10px; background: #1c1c1c; border: 1px solid #333;
    }
    .apercu-objet .infos { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .apercu-objet b { font-size: 14px; }
    .apercu-objet .effet, .apercu-objet .porteur-texte { font-size: 12px; color: var(--texte-doux); }
    .apercu-objet button {
      flex-shrink: 0; padding: 9px 16px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font: inherit; font-weight: bold; cursor: pointer;
    }
    .apercu-objet .vide { padding: 0; }

    /* ---------- Fenêtre de choix ---------- */
    .fond {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65);
      display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 60;
    }
    .fond[hidden] { display: none; }
    .choix {
      width: min(440px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column;
      background: #242424; border: 1px solid #444; border-radius: 16px; overflow: hidden;
    }
    .choix header { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid #333; }
    .choix h3 { margin: 0; font-size: 16px; }
    .choix .fermer { background: none; border: none; color: var(--texte-doux); font-size: 22px; cursor: pointer; }
    #choix-liste { overflow-y: auto; padding: 6px; }
    .option {
      display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; box-sizing: border-box;
      background: none; border: none; border-radius: 8px; color: var(--texte); font: inherit; text-align: left; cursor: pointer;
    }
    .option:hover:not(:disabled) { background: #2f2f2f; }
    .option:disabled { opacity: 0.4; cursor: default; }
    .option > img { width: 46px; height: 46px; object-fit: contain; flex-shrink: 0; }
    .option .icone { width: 46px; font-size: 28px; text-align: center; flex-shrink: 0; }
    .option .infos { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .option .nom { font-weight: bold; font-size: 14px; }
    .option .sous { font-size: 12px; color: var(--texte-doux); }
    .option .badges { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
    .option.retirer { color: #ff8a8a; font-weight: bold; font-size: 14px; }
    /* Ce que le singe porte déjà, rappelé en tête de la fenêtre (non cliquable) */
    .option.actuel {
      align-items: flex-start; cursor: default; margin-bottom: 6px;
      background: #2b2b2b; border: 1px solid var(--accent);
    }
    .option.actuel .infos { flex: 1; }
    .option.actuel .detail { font-size: 12px; color: var(--texte-doux); }
    .option.actuel .marque {
      align-self: center; flex-shrink: 0; padding: 2px 8px; border-radius: 999px;
      background: var(--accent); color: #1e1b2e; font-size: 11px; font-weight: bold;
    }
    .choix .vide { padding: 10px; color: var(--texte-doux); margin: 0; }

    .pastille {
      display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 3px;
      border-radius: 999px; border: 1.5px solid; font-size: 11px; font-weight: bold; background: #161616;
    }
    .pastille img { width: 14px; height: 14px; object-fit: contain; }

    /* Résonances : une pastille par trait présent dans l'équipe */
    #resonances { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; min-height: 34px; }
    .resonance {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
      background: #242424; border: 1px solid #333; color: var(--texte-doux); font: inherit; font-size: 14px; cursor: pointer;
    }
    .resonance:hover { border-color: var(--trait, var(--accent)); }
    .resonance.infos { color: var(--texte); }
    .resonance.active { border-color: var(--trait, var(--accent)); color: var(--trait, var(--texte)); font-weight: bold; }

    #message { min-height: 1.2em; color: var(--or); font-size: 14px; margin: 0 0 10px; }

    /* Téléphone : la liste prend toute la largeur, la fiche s'ouvre par-dessus en plein écran */
    @media (max-width: 760px) {
      .disposition { display: block; }
      .ligne { grid-template-columns: 44px minmax(0, 1fr); }
      .ligne img { width: 44px; height: 44px; }
      .ligne .droite { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; }
      #fiche { position: fixed; inset: 0; z-index: 40; border-radius: 0; border: none; overflow-y: auto; padding: 14px 16px 30px; }
      .retour {
        display: inline-block; margin-bottom: 10px; padding: 6px 12px; border-radius: 999px; border: 1px solid #444;
        background: #2b2f3a; color: var(--texte); font: inherit; font-size: 14px; cursor: pointer;
      }
    }
  </style>
</head>
<body>
  <main class="contenu">
    <div id="resonances"></div>
    <p id="message"></p>
    <div class="disposition">
      <div id="rangees"></div>
      <aside id="fiche" class="fiche" hidden></aside>
    </div>
  </main>

  <div id="fond-choix" class="fond" hidden>
    <div class="choix" role="dialog" aria-modal="true" aria-labelledby="choix-titre">
      <header><h3 id="choix-titre"></h3><button class="fermer" type="button" aria-label="Fermer">✕</button></header>
      <div id="choix-liste"></div>
    </div>
  </div>

  <script src="/js/commun.js"></script>
  <script src="/js/arbre.js"></script>
  <script src="/js/barre.js"></script>
  <script src="/js/session.js"></script>
  <script>
    // Les emplacements entrent en combat par rangées de 3 : ligne 1, puis ligne 2, puis renfort.
    const RANGEES = ["Ligne 1", "Ligne 2", "Renfort"];
    const STATS = [
      ["hp", "PV", ""], ["atk", "ATK", ""], ["def", "DEF", ""], ["spd", "Vitesse", ""],
      ["prec", "Précision", ""], ["esq", "Esquive", ""], ["crit", "Critique", " %"], ["critdmg", "Dégâts crit", " %"],
    ];
    const $ = (id) => document.getElementById(id);
    const mobile = window.matchMedia("(max-width: 760px)");

    let possedes = [];                            // réponse /monkeydex
    let perks = { catalogue: {}, obtenus: [] };   // réponse /perks
    // Objets portés (arme, équipements) : réponses /armes et /equipements
    const OBJETS = {
      arme: { api: "/armes", donnees: { catalogue: {}, obtenus: [], slots: 1 }, nom: "Arme", retirer: "✕ Retirer l'arme", vide: "Aucune arme : tire-en dans l'onglet Objets !" },
      equipement: { api: "/equipements", donnees: { catalogue: {}, obtenus: [], slots: 3 }, nom: "Équipement", retirer: "✕ Retirer l'équipement", vide: "Aucun équipement : tire-en dans l'onglet Objets !" },
    };
    let resonances = { paliers: [], traits: {} };
    let equipe = Array(6).fill(null);
    let combat = [];          // stats de chaque emplacement telles qu'en combat (réponse /equipe)
    let selection = null;     // index de l'emplacement affiché dans la fiche
    let minuteurMessage = null;

    function afficherMessage(texte, temporaire = false) {
      clearTimeout(minuteurMessage);
      $("message").textContent = texte;
      if (temporaire) minuteurMessage = setTimeout(() => { $("message").textContent = ""; }, 2000);
    }

    const trouverSinge = (id) => possedes.find((s) => s.id === id);
    const statsBase = (s) => s?.statsBase ?? s?.stats;
    const perkPorte = (espece) => perks.obtenus.find((p) => p.espece === espece && perks.catalogue[p.perk]) ?? null;
    function objetPorte(type, espece, emplacement = 1) {
      const d = OBJETS[type].donnees;
      return d.obtenus.find((o) => o.espece === espece && o.slot === emplacement && d.catalogue[o.objet]) ?? null;
    }
    function nomPlace(index) {
      return `${RANGEES[Math.floor(index / 3)] ?? `Ligne ${Math.floor(index / 3) + 1}`}, place ${(index % 3) + 1}`;
    }
    function pastilleHTML(rarete) {
      const r = infoRarete(rarete);
      return `<span class="pastille" style="border-color:${r.couleur};color:color-mix(in srgb, ${r.couleur} 55%, #ffffff)"><img src="${r.icone}" alt="">${r.label}</span>`;
    }
    const etoiles = (s) => (s?.eveil ? etoilesEveilHTML(s.eveil.niveau, s.eveil.max) : "");

    // ---------- Résonances ----------

    // Une pastille par trait présent dans l'équipe (un singe compte pour chacun de ses traits) : porteurs / prochain palier,
    // en couleur quand un palier est atteint ; un clic ouvre le panneau des traits sur celui-ci.
    function afficherResonances() {
      const compte = compterTraitsEspeces(equipe.filter(Boolean).map((id) => trouverSinge(id)?.espece));
      const zone = $("resonances");
      zone.innerHTML = "";
      const { paliers } = resonances;
      for (const [id, t] of Object.entries(resonances.traits ?? {})) {
        const nb = compte[id] ?? 0;
        const info = infoTrait(id);
        if (nb === 0 || !info) continue;
        const atteint = indexPalierTrait(paliers, nb);
        const prochain = paliers[atteint] ?? paliers[paliers.length - 1];
        const pastille = document.createElement("button");
        pastille.type = "button";
        pastille.className = "resonance" + (atteint > 0 ? " active" : "");
        pastille.addEventListener("click", () => ouvrirInfosTraits(resonances, compte, id));
        pastille.style.setProperty("--trait", info.couleur);
        pastille.textContent = `${info.icone} ${nb}/${prochain}`;
        pastille.title = atteint > 0 ? `${info.nom} : ${effetTrait(id, t.paliers[atteint - 1])}` : info.nom;
        pastille.setAttribute("aria-label", `${info.nom} : ${nb} sur ${prochain}, voir les traits`);
        zone.appendChild(pastille);
      }
      const infos = document.createElement("button");
      infos.type = "button";
      infos.className = "resonance infos";
      infos.textContent = "ⓘ Traits";
      infos.addEventListener("click", () => ouvrirInfosTraits(resonances, compte));
      zone.appendChild(infos);
    }

    // ---------- Liste de l'équipe ----------

    // Petites icônes des objets portés : perk, arme, puis les équipements (· si vide)
    function iconesObjets(id) {
      const p = perkPorte(id);
      const icones = [p ? perks.catalogue[p.perk].icone : "·"];
      const a = objetPorte("arme", id);
      icones.push(a ? OBJETS.arme.donnees.catalogue[a.objet].icone : "·");
      const eq = OBJETS.equipement.donnees;
      for (let n = 1; n <= (eq.slots ?? 3); n++) {
        const o = objetPorte("equipement", id, n);
        icones.push(o ? eq.catalogue[o.objet].icone : "·");
      }
      return icones.map((i) => `<span>${i}</span>`).join("");
    }

    function ligneHTML(index) {
      const id = equipe[index];
      const s = id ? trouverSinge(id) : null;
      if (!s) return `<button class="ligne vide" type="button" data-index="${index}">+ Ajouter un singe</button>`;
      const c = combat[index];
      const stats = c ? `<span>PV <b>${c.hp}</b></span><span>ATK <b>${c.atk}</b></span><span>DEF <b>${c.def}</b></span>` : "";
      return `<button class="ligne${selection === index ? " selection" : ""}" type="button" data-index="${index}">
        <img src="${s.image}" alt="">
        <span class="infos">
          <span class="nom" style="color:${infoRarete(s.espece.rarete).couleur}">${s.espece.nom}</span>
          <span class="sous">Lvl ${s.niveau.niveau} ${etoiles(s)}</span>
        </span>
        <span class="droite"><span class="stats">${stats}</span><span class="objets">${iconesObjets(id)}</span></span>
      </button>`;
    }

    function afficherListe() {
      const zone = $("rangees");
      zone.innerHTML = "";
      for (let debut = 0; debut < equipe.length; debut += 3) {
        const rangee = document.createElement("section");
        rangee.className = "rangee";
        rangee.innerHTML = `<h2></h2>`;
        rangee.querySelector("h2").textContent = RANGEES[debut / 3] ?? `Ligne ${debut / 3 + 1}`;
        for (let i = debut; i < Math.min(debut + 3, equipe.length); i++) rangee.insertAdjacentHTML("beforeend", ligneHTML(i));
        zone.appendChild(rangee);
      }
      zone.querySelectorAll(".ligne").forEach((b) => b.addEventListener("click", () => {
        const index = Number(b.dataset.index);
        if (equipe[index]) selectionner(index);
        else ouvrirChoixSinge(index);
      }));
    }

    // ---------- Fiche du singe ----------

    function selectionner(index) {
      selection = index;
      afficherListe();
      afficherFiche();
    }

    function fermerFiche() {
      selection = null;
      afficherListe();
      afficherFiche();
    }

    // Une ligne d'emplacement de la fiche : type, objet porté (nom et effet chiffré sur ce singe) ou « + Ajouter »
    function emplacementHTML(type, libelle, nom, effet, cle) {
      return nom
        ? `<button class="emplacement" type="button" data-cle="${cle}"><span class="type">${libelle}</span><span class="objet"><b>${nom}</b><small>${effet}</small></span></button>`
        : `<button class="emplacement sans" type="button" data-cle="${cle}"><span class="type">${libelle}</span><span class="objet">+ Ajouter</span></button>`;
    }

    function afficherFiche() {
      const fiche = $("fiche");
      const id = selection !== null ? equipe[selection] : null;
      const s = id ? trouverSinge(id) : null;
      if (!s) {
        fiche.hidden = true;
        return;
      }
      const r = infoRarete(s.espece.rarete);
      const base = statsBase(s);
      const c = combat[selection] ?? s.stats;
      const lignes = STATS.map(([k, libelle, suffixe]) => {
        const bonus = (c[k] ?? 0) - (base[k] ?? 0);
        return `<tr><td>${libelle}</td><td>${base[k] ?? 0}${suffixe}</td>
          <td class="bonus">${bonus > 0 ? `+${bonus}${suffixe}` : bonus < 0 ? `${bonus}${suffixe}` : ""}</td>
          <td class="total">${c[k] ?? 0}${suffixe}</td></tr>`;
      }).join("");

      let emplacements = "";
      const p = perkPorte(id);
      emplacements += emplacementHTML("perk", "Perk", p && `${perks.catalogue[p.perk].icone} ${nomPerk(perks.catalogue, p.perk, p.tier)}`,
        p && effetPerkSur(perks.catalogue, p.perk, p.tier, base), "perk");
      // Arme et équipements : une tuile par emplacement (émoji, tier, infobulle), « + » si vide
      const caseObjet = (type, n, libelle) => {
        const d = OBJETS[type].donnees;
        const o = objetPorte(type, id, n);
        const tuile = o ? tuileObjetHTML(d.catalogue, o, { stats: base }) : `<button type="button" class="tuile-objet vide" aria-label="${libelle} : vide">+</button>`;
        return `<div class="case-emplacement" data-cle="${type}:${n}">${tuile}<span class="libelle">${libelle}</span></div>`;
      };
      let cases = caseObjet("arme", 1, "Arme");
      for (let n = 1; n <= (OBJETS.equipement.donnees.slots ?? 3); n++) cases += caseObjet("equipement", n, `Équip. ${n}`);
      emplacements += `<div class="cases-emplacements">${cases}</div>`;

      fiche.hidden = false;
      fiche.innerHTML = `
        <button class="retour" type="button">← Équipe</button>
        <div class="fiche-entete">
          <img src="${s.image}" alt="">
          <div>
            <div class="badges">${pastilleHTML(s.espece.rarete)}</div>
            <h3 style="color:${r.couleur}">${s.espece.nom}</h3>
            <div class="niveau">Niveau ${s.niveau.niveau} ${etoiles(s)}</div>
            ${ligneTraitsHTML(s.espece)}
          </div>
        </div>
        <div class="actions">
          <button type="button" data-action="changer">Changer de singe</button>
          <button type="button" class="danger" data-action="retirer">Retirer</button>
        </div>
        <table>
          <thead><tr><th>Stat</th><th>Base</th><th>Bonus</th><th>Combat</th></tr></thead>
          <tbody>${lignes}</tbody>
        </table>
        ${s.competence ? `<p class="competence"></p>` : ""}
        <h4>Équipement</h4>
        ${emplacements}`;
      if (s.competence) fiche.querySelector(".competence").textContent = `${s.competence.icone} ${s.competence.nom} : ${descriptionCompetence(s.competence)}`;
      fiche.querySelector(".retour").addEventListener("click", fermerFiche);
      fiche.querySelector('[data-action="changer"]').addEventListener("click", () => ouvrirChoixSinge(selection));
      fiche.querySelector('[data-action="retirer"]').addEventListener("click", () => choisirSinge(selection, null));
      fiche.querySelector('.emplacement[data-cle="perk"]').addEventListener("click", () => ouvrirChoixPerk(id));
      fiche.querySelectorAll(".case-emplacement").forEach((caseEl) => caseEl.querySelector("button").addEventListener("click", () => {
        const [type, n] = caseEl.dataset.cle.split(":");
        ouvrirChoixObjet(type, id, Number(n));
      }));
    }

    // ---------- Fenêtre de choix ----------

    function ouvrirChoix(titre, options) {
      $("choix-titre").textContent = titre;
      const liste = $("choix-liste");
      liste.innerHTML = "";
      for (const o of options) liste.appendChild(o);
      $("fond-choix").hidden = false;
    }
    function fermerChoix() {
      $("fond-choix").hidden = true;
    }
    // Option de la fenêtre : `visuel` (image ou icône), nom, badges éventuels, sous-texte
    function option({ image, icone, nom, badges = "", traits = "", sous = "", desactive = false, retirer = false, action }) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "option" + (retirer ? " retirer" : "");
      b.disabled = desactive;
      if (retirer) {
        b.textContent = nom;
      } else {
        b.innerHTML = `${image ? `<img src="${image}" alt="">` : `<span class="icone"></span>`}
          <span class="infos">${badges ? `<span class="badges">${badges}</span>` : ""}<span class="nom"></span><span class="sous"></span>${traits}</span>`;
        if (!image) b.querySelector(".icone").textContent = icone;
        b.querySelector(".nom").innerHTML = nom;
        b.querySelector(".sous").textContent = sous;
      }
      b.addEventListener("click", () => { fermerChoix(); action(); });
      return b;
    }
    // Ce que le singe porte déjà, en tête de la fenêtre : sans ça, seul « ✕ Retirer » rappelait
    // qu'un objet était équipé, sans dire lequel ni ce qu'il fait.
    function ligneActuelle({ icone, nom, sous, detail = "" }) {
      const div = document.createElement("div");
      div.className = "option actuel";
      div.innerHTML = `<span class="icone"></span>
        <span class="infos"><span class="nom"></span><span class="sous"></span><span class="detail"></span></span>
        <span class="marque">Équipé</span>`;
      div.querySelector(".icone").textContent = icone;
      div.querySelector(".nom").textContent = nom;
      div.querySelector(".sous").textContent = sous;
      div.querySelector(".detail").textContent = detail;
      return div;
    }

    function messageVide(texte) {
      const p = document.createElement("p");
      p.className = "vide";
      p.textContent = texte;
      return p;
    }

    // Singes : disponibles d'abord ; un singe déjà placé est échangé avec celui de cet emplacement
    function ouvrirChoixSinge(index) {
      const options = [];
      if (equipe[index]) options.push(option({ retirer: true, nom: "✕ Retirer de l'équipe", action: () => choisirSinge(index, null) }));
      const place = (id) => equipe.indexOf(id);
      const tries = possedes.filter((s) => s.id !== equipe[index]).sort((a, b) => (place(a.id) >= 0) - (place(b.id) >= 0));
      for (const s of tries) {
        const j = place(s.id);
        const st = s.stats;
        options.push(option({
          image: s.image,
          nom: `${s.espece.nom} ${etoiles(s)}`,
          badges: pastilleHTML(s.espece.rarete),
          traits: ligneTraitsHTML(s.espece),
          sous: `Lvl ${s.niveau.niveau} · PV ${st.hp} · ATK ${st.atk} · DEF ${st.def}` + (j >= 0 ? ` · échanger avec ${nomPlace(j)}` : ""),
          action: () => choisirSinge(index, s.id),
        }));
      }
      if (possedes.length === 0) options.push(messageVide("Aucun singe : va tirer !"));
      ouvrirChoix(equipe[index] ? `Remplacer ${trouverSinge(equipe[index])?.espece.nom ?? ""}` : `Ajouter un singe (${nomPlace(index)})`, options);
    }

    function ouvrirChoixPerk(espece) {
      const cible = trouverSinge(espece);
      const actuel = perkPorte(espece);
      const options = [];
      if (actuel) {
        options.push(ligneActuelle({
          icone: perks.catalogue[actuel.perk].icone,
          nom: nomPerk(perks.catalogue, actuel.perk, actuel.tier),
          sous: effetPerkSur(perks.catalogue, actuel.perk, actuel.tier, statsBase(cible)),
          detail: descriptionPerk(perks.catalogue, actuel.perk, actuel.tier),
        }));
        options.push(option({ retirer: true, nom: "✕ Retirer le perk", action: () => equiperPerk(actuel, null) }));
      }
      const autres = perks.obtenus.filter((p) => perks.catalogue[p.perk] && p !== actuel).sort((a, b) => Boolean(a.espece) - Boolean(b.espece));
      for (const p of autres) {
        const porteur = p.espece ? trouverSinge(p.espece) : null;
        options.push(option({
          icone: perks.catalogue[p.perk].icone,
          nom: nomPerk(perks.catalogue, p.perk, p.tier),
          sous: effetPerkSur(perks.catalogue, p.perk, p.tier, statsBase(cible)) + (porteur ? ` · sur ${porteur.espece.nom}` : ""),
          action: () => equiperPerk(p, espece),
        }));
      }
      if (perks.obtenus.length === 0) options.push(messageVide("Aucun perk : tire-en dans l'onglet Objets !"));
      ouvrirChoix(`Perk de ${cible?.espece.nom ?? ""}`, options);
    }

    // Objets : l'objet porté en tête (avec Retirer), puis tous les exemplaires en tuiles (libres d'abord).
    // Un clic sur une tuile l'affiche en dessous (nom, effet chiffré sur ce singe, porteur) avec le bouton Équiper :
    // l'infobulle de survol n'existe pas sur téléphone.
    function ouvrirChoixObjet(type, espece, emplacement) {
      const { donnees: d, retirer, vide, nom } = OBJETS[type];
      const cible = trouverSinge(espece);
      const base = statsBase(cible);
      const actuel = objetPorte(type, espece, emplacement);
      const options = [];
      if (actuel) {
        options.push(ligneActuelle({
          icone: d.catalogue[actuel.objet].icone,
          nom: nomObjet(d.catalogue, actuel.objet, actuel.tier),
          sous: texteEffetsObjet(actuel.valeurs, base),
        }));
        options.push(option({ retirer: true, nom: retirer, action: () => equiperObjet(type, actuel, null, emplacement) }));
      }
      const exemplaires = d.obtenus.filter((x) => d.catalogue[x.objet] && x !== actuel)
        .sort((a, b) => Boolean(a.espece) - Boolean(b.espece) || b.tier - a.tier || b.id - a.id);
      if (exemplaires.length > 0) {
        const grille = document.createElement("div");
        grille.className = "tuiles choix-tuiles";
        grille.innerHTML = exemplaires.map((o) => tuileObjetHTML(d.catalogue, o, {
          stats: base, porteur: o.espece ? trouverSinge(o.espece) : null, classe: "sans-infobulle",
        })).join("");
        const apercu = document.createElement("div");
        apercu.className = "apercu-objet";
        apercu.innerHTML = `<p class="vide">Choisis un objet.</p>`;
        grille.querySelectorAll(".tuile-objet").forEach((t) => t.addEventListener("click", () => {
          grille.querySelectorAll(".choisie").forEach((x) => x.classList.remove("choisie"));
          t.classList.add("choisie");
          const o = exemplaires.find((x) => x.id === Number(t.dataset.id));
          const porteur = o.espece ? trouverSinge(o.espece) : null;
          apercu.innerHTML = `<div class="infos"><b></b><span class="effet"></span><span class="porteur-texte"></span></div><button type="button">Équiper</button>`;
          apercu.querySelector("b").textContent = nomObjet(d.catalogue, o.objet, o.tier);
          apercu.querySelector(".effet").textContent = texteEffetsObjet(o.valeurs, base);
          apercu.querySelector(".porteur-texte").textContent = porteur ? `Porté par ${porteur.espece.nom} : il le perdra` : "Libre";
          apercu.querySelector("button").addEventListener("click", () => { fermerChoix(); equiperObjet(type, o, espece, emplacement); });
        }));
        options.push(grille, apercu);
      }
      if (d.obtenus.length === 0) options.push(messageVide(vide));
      const titre = type === "arme" ? `Arme de ${cible?.espece.nom ?? ""}` : `${nom} ${emplacement} de ${cible?.espece.nom ?? ""}`;
      ouvrirChoix(titre, options);
    }

    $("fond-choix").addEventListener("click", (e) => { if (e.target === $("fond-choix")) fermerChoix(); });
    document.querySelector(".choix .fermer").addEventListener("click", fermerChoix);
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape" || document.getElementById("infos-traits")?.open) return;
      if (!$("fond-choix").hidden) fermerChoix();
      else if (mobile.matches && selection !== null) fermerFiche();
    });

    // ---------- Actions ----------

    // Place `id` à l'emplacement `index` (null = vider). Un singe déjà placé ailleurs échange sa place avec l'occupant.
    async function choisirSinge(index, id) {
      const nouvelle = [...equipe];
      const ailleurs = id ? nouvelle.indexOf(id) : -1;
      if (ailleurs >= 0) nouvelle[ailleurs] = nouvelle[index];
      nouvelle[index] = id;
      try {
        const { ok, data } = await api("/equipe", { corps: { especes: nouvelle } });
        if (!ok) throw new Error(data.erreur);
        if (id === null && selection === index) selection = null;
        else if (id) selection = index;
        await rafraichirEquipe();
        afficherMessage("✓ Sauvegardé", true);
      } catch (err) {
        afficherMessage("Erreur : " + err.message);
      }
    }

    async function equiperPerk(p, espece) {
      try {
        const { ok, data } = await api("/perks/equiper", { corps: { perk: p.perk, tier: p.tier, espece } });
        if (!ok) throw new Error(data.erreur);
        perks = data;
        await rafraichirEquipe();
        afficherMessage("✓ Sauvegardé", true);
      } catch (err) {
        afficherMessage("Erreur : " + err.message);
      }
    }

    async function equiperObjet(type, o, espece, emplacement) {
      try {
        const { ok, data } = await api(`${OBJETS[type].api}/equiper`, { corps: { id: o.id, espece, slot: emplacement } });
        if (!ok) throw new Error(data.erreur);
        OBJETS[type].donnees = data;
        await rafraichirEquipe();
        afficherMessage("✓ Sauvegardé", true);
      } catch (err) {
        afficherMessage("Erreur : " + err.message);
      }
    }

    // ---------- Chargement ----------

    // Équipe et stats de combat (après chaque changement : les totaux dépendent de tout l'équipement et des résonances)
    async function rafraichirEquipe() {
      const res = await api("/equipe");
      if (!res.ok) throw new Error(res.data.erreur);
      resonances = res.data.resonances ?? resonances;
      combat = res.data.combat ?? [];
      equipe = Array(res.data.nbSlots ?? 6).fill(null);
      for (const { slot, espece } of res.data.equipe) {
        if (slot <= equipe.length) equipe[slot - 1] = espece;
      }
      if (selection !== null && !equipe[selection]) selection = null;
      afficherTout();
    }

    function afficherTout() {
      afficherResonances();
      afficherListe();
      afficherFiche();
    }

    async function charger() {
      const [resDex, resPerks, resArmes, resEquipements] = await Promise.all(
        [api("/monkeydex"), api("/perks"), api("/armes"), api("/equipements")]);
      if (resPerks.ok) perks = resPerks.data;
      if (resArmes.ok) OBJETS.arme.donnees = resArmes.data;
      if (resEquipements.ok) OBJETS.equipement.donnees = resEquipements.data;
      if (!resDex.ok) {
        afficherMessage("Erreur de chargement, réessaie.");
        return;
      }
      possedes = resDex.data.singes;
      try {
        await rafraichirEquipe();
      } catch {
        afficherMessage("Erreur de chargement, réessaie.");
        return;
      }
      // Sur grand écran, la fiche du premier singe est ouverte d'office
      if (selection === null && !mobile.matches) {
        const premier = equipe.findIndex(Boolean);
        if (premier >= 0) selectionner(premier);
      }
    }

    // Débloquer « Rang de renfort » ajoute un emplacement, et l'arbre change les stats : on recharge l'équipe
    document.addEventListener("arbre-change", charger);

    exigerConnexion().then((moi) => { if (moi) charger(); });
  </script>
</body>
</html>
