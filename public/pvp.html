<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PVP</title>
  <link rel="stylesheet" href="/css/commun.css">
  <link rel="stylesheet" href="/css/arbre.css">
  <link rel="stylesheet" href="/css/barre.css">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #161616;
      color: #f2f2f2;
      margin: 0;
      min-height: 100vh;
    }
    h2 { font-size: 16px; color: #bbb; margin: 0 0 12px; }
    h3 { font-size: 13px; color: #888; margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 1px; }
    .page {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 16px 40px;
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 24px;
      align-items: start;
    }
    @media (max-width: 800px) {
      .page { grid-template-columns: 1fr; }
    }

    aside {
      position: sticky;
      top: calc(var(--topbar-h) + 16px);
      background: #1c1c1c;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 14px;
    }
    .colonne { display: flex; flex-direction: column; gap: 6px; }
    .joueur {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #242424;
      font-size: 14px;
    }
    .joueur .pseudo { flex: 1; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .point { width: 9px; height: 9px; border-radius: 50%; background: #555; flex-shrink: 0; }
    .point.en-ligne { background: #4caf50; }

    main { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
    .panneau {
      background: #1c1c1c;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 16px;
    }

    .ligne {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #242424;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 14px;
    }
    .ligne .pseudo { flex: 1; font-weight: bold; }
    .compte { font-size: 12px; color: #999; }
    .vide { color: #777; font-size: 13px; }

    .bouton-defi {
      padding: 6px 12px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #ff8a3d, #e5447a);
      color: #fff;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
    }
    .bouton-defi:disabled { background: #333; color: #888; cursor: default; }
    .bouton-secondaire {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #2a2640;
      color: #f2f2f2;
      font-size: 13px;
      cursor: pointer;
    }

    .badge {
      min-width: 92px;
      text-align: center;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }
    .badge.victoire { background: #1f8a3e; color: #fff; }
    .badge.defaite { background: #b02a2a; color: #fff; }
    .badge.nul { background: #555; color: #fff; }
    .badge.encours { background: #f0a020; color: #161616; }

    #message { min-height: 1.2em; color: var(--or); margin: 0; font-size: 14px; }
    #message:empty { display: none; }
    .lien-combat { color: #ffb86b; }
  </style>
</head>
<body>

  <div class="page">
    <aside>
      <h2>Joueurs</h2>
      <div id="joueurs" class="colonne"></div>
    </aside>

    <main>
      <p id="message"></p>

      <section class="panneau">
        <h2>Défis en attente</h2>
        <div id="defis"></div>
      </section>

      <section class="panneau">
        <h2>Combat en cours</h2>
        <div id="en-cours" class="colonne"></div>
      </section>

      <section class="panneau">
        <h2>Historique</h2>
        <div id="historique" class="colonne"></div>
      </section>
    </main>
  </div>

  <script src="/js/commun.js"></script>
  <script src="/js/arbre.js"></script>
  <script src="/js/barre.js"></script>
  <script src="/js/session.js"></script>
  <script>
    const INTERVALLE_RAFRAICHISSEMENT_MS = 3000;

    let defisEnvoyes = [];
    let defisRecus = [];
    let premierRafraichissementCombats = true;

    const $ = (id) => document.getElementById(id);
    const message = $("message");
    const zoneJoueurs = $("joueurs");
    const zoneDefis = $("defis");
    const zoneEnCours = $("en-cours");
    const zoneHistorique = $("historique");

    // ---------- Joueurs ----------

    function normaliserDefi(d) {
      return { ...d, fin: Date.now() + d.secondes_restantes * 1000 };
    }

    function tempsRestant(fin) {
      return Math.max(0, Math.ceil((fin - Date.now()) / 1000));
    }

    function afficherJoueurs(joueurs) {
      if (joueurs.length === 0) {
        zoneJoueurs.innerHTML = `<p class="vide">Aucun autre joueur.</p>`;
        return;
      }
      zoneJoueurs.innerHTML = joueurs.map((j) => {
        const envoye = defisEnvoyes.find((d) => d.vers_user === j.id);
        let action;
        if (envoye) {
          action = `<span class="compte"><span data-fin="${envoye.fin}">${tempsRestant(envoye.fin)}</span>s</span>`;
        } else if (!j.en_ligne) {
          action = `<span class="compte">hors ligne</span>`;
        } else {
          action = `<button class="bouton-defi" data-defier="${j.id}">Défier</button>`;
        }
        return `
          <div class="joueur">
            <span class="point ${j.en_ligne ? "en-ligne" : ""}"></span>
            <span class="pseudo">${j.pseudo}</span>
            ${action}
          </div>`;
      }).join("");

      zoneJoueurs.querySelectorAll("[data-defier]").forEach((btn) => {
        btn.addEventListener("click", () => envoyerDefi(btn.dataset.defier));
      });
    }

    // ---------- Défis ----------

    function afficherDefis() {
      const recus = defisRecus.length
        ? defisRecus.map((d) => `
            <div class="ligne">
              <span class="pseudo">${d.de_pseudo} te défie</span>
              <span class="compte">expire dans <span data-fin="${d.fin}">${tempsRestant(d.fin)}</span>s</span>
              <button class="bouton-defi" data-accepter="${d.id}">Accepter</button>
              <button class="bouton-secondaire" data-refuser="${d.id}">Refuser</button>
            </div>`).join("")
        : `<p class="vide">Aucun défi reçu.</p>`;

      const envoyes = defisEnvoyes.length
        ? defisEnvoyes.map((d) => `
            <div class="ligne">
              <span class="pseudo">Défi à ${d.vers_pseudo}</span>
              <span class="compte">expire dans <span data-fin="${d.fin}">${tempsRestant(d.fin)}</span>s</span>
            </div>`).join("")
        : `<p class="vide">Aucun défi envoyé.</p>`;

      zoneDefis.innerHTML = `<h3>Reçus</h3><div class="colonne">${recus}</div>
                             <h3>Envoyés</h3><div class="colonne">${envoyes}</div>`;

      zoneDefis.querySelectorAll("[data-accepter]").forEach((btn) => {
        btn.addEventListener("click", () => repondreDefi(btn.dataset.accepter, true));
      });
      zoneDefis.querySelectorAll("[data-refuser]").forEach((btn) => {
        btn.addEventListener("click", () => repondreDefi(btn.dataset.refuser, false));
      });
    }

    async function envoyerDefi(versUserId) {
      const { ok, data } = await api("/defis", { corps: { versUserId } });
      message.textContent = ok
        ? "Défi envoyé."
        : "Erreur : " + data.erreur;
      await rafraichirJoueurs();
    }

    async function repondreDefi(defiId, accepter) {
      const { ok, data } = await api(`/defis/${defiId}/repondre`, { corps: { accepter } });

      if (!ok) {
        message.textContent = "Erreur : " + data.erreur;
      } else if (accepter) {
        location.href = `/combat-live.html?id=${data.combatId}`;
        return;
      } else {
        message.textContent = "Défi refusé.";
      }
      await rafraichirJoueurs();
      await rafraichirCombats();
    }

    async function rafraichirJoueurs() {
      const [rj, rd] = await Promise.all([api("/joueurs"), api("/defis")]);
      if (!rj.ok || !rd.ok) return;
      const { joueurs } = rj.data;
      const defis = rd.data;
      defisEnvoyes = defis.envoyes.map(normaliserDefi);
      defisRecus = defis.recus.map(normaliserDefi);
      afficherJoueurs(joueurs);
      afficherDefis();
    }

    // ---------- Combats ----------

    function badgeIssue(issue) {
      if (issue === "victoire") return `<span class="badge victoire">VICTOIRE</span>`;
      if (issue === "défaite") return `<span class="badge defaite">DÉFAITE</span>`;
      return `<span class="badge nul">NUL</span>`;
    }

    function ligneCombat(c, badge) {
      return `
        <div class="ligne">
          ${badge}
          <span class="pseudo">Contre ${c.adversaire}</span>
          <a class="bouton-defi" href="/combat-live.html?id=${c.id}">Voir</a>
        </div>`;
    }

    // Un combat lancé par moi (mon défi accepté) qui apparaît après le chargement
    // de la page ouvre directement le spectateur. Les combats déjà existants
    // au chargement sont marqués comme vus et ne redirigent pas.
    function cleVu(id) {
      return "combat_vu_" + id;
    }

    async function rafraichirCombats() {
      const { ok, data } = await api("/combats");
      if (!ok) return;
      const { combats } = data;

      if (premierRafraichissementCombats) {
        combats.forEach((c) => sessionStorage.setItem(cleVu(c.id), "1"));
        premierRafraichissementCombats = false;
      } else {
        const nouveau = combats.find(
          (c) => c.recent && c.lanceParMoi && !sessionStorage.getItem(cleVu(c.id))
        );
        if (nouveau) {
          sessionStorage.setItem(cleVu(nouveau.id), "1");
          location.href = `/combat-live.html?id=${nouveau.id}`;
          return;
        }
      }

      const enCours = combats.filter((c) => c.recent);
      const historique = combats.filter((c) => !c.recent);

      zoneEnCours.innerHTML = enCours.length
        ? enCours.map((c) => ligneCombat(c, `<span class="badge encours">EN COURS</span>`)).join("")
        : `<p class="vide">Aucun combat en cours.</p>`;

      zoneHistorique.innerHTML = historique.length
        ? historique.map((c) => ligneCombat(c, badgeIssue(c.issue))).join("")
        : `<p class="vide">Aucun combat terminé.</p>`;
    }

    // ---------- Compte à rebours ----------

    setInterval(() => {
      document.querySelectorAll("[data-fin]").forEach((el) => {
        el.textContent = tempsRestant(Number(el.dataset.fin));
      });
    }, 1000);

    // ---------- Chargement ----------

    async function init() {
      if (!await exigerConnexion()) return;
      rafraichirJoueurs();
      rafraichirCombats();
      setInterval(rafraichirJoueurs, INTERVALLE_RAFRAICHISSEMENT_MS);
      setInterval(rafraichirCombats, INTERVALLE_RAFRAICHISSEMENT_MS);
    }

    init();
  </script>
</body>
</html>
